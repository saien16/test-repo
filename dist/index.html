<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3a">
<title>むしとりバトル 🐛</title>
<style>
/* ===== src/styles.css ===== */
/* ============================================================
   むしとりバトル — styles.css
   スマホ縦画面（iPhone SE想定）/ 単一HTML。
   画面は .screen を重ね、.active のみ表示。
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  background: #0c1410; color: #fff; overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
#app {
  position: relative; width: 100%; height: 100vh; height: 100dvh;
  max-width: 480px; margin: 0 auto; overflow: hidden;
}

/* ---- 画面の重ね ---- */
.screen { position: absolute; inset: 0; display: none; flex-direction: column;
  align-items: center; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.screen.active { display: flex; }

.screen-title { font-size: 24px; margin: 18px 0 10px; letter-spacing: 2px;
  text-shadow: 0 2px 0 rgba(0,0,0,.4); }

/* ---- 共通ボタン ---- */
.big-btn {
  font: 700 22px/1 inherit; color: #fff; border: none; border-radius: 16px;
  padding: 16px 34px; margin: 10px;
  background: linear-gradient(#3fbf6f, #1f8f4d);
  box-shadow: 0 5px 0 #145e34, 0 8px 16px rgba(0,0,0,.4); cursor: pointer;
  transition: transform .06s, box-shadow .06s;
}
.big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #145e34; }

/* ============================================================
   タイトル
   ============================================================ */
#title-screen {
  justify-content: center;
  background: radial-gradient(120% 80% at 50% 0%, #2e7d4f 0%, #143d27 55%, #0c1410 100%);
}
.title-wrap { display: flex; flex-direction: column; align-items: center; }
.title-logo { font-size: 52px; font-weight: 900; text-align: center; line-height: 1.05;
  text-shadow: 0 3px 0 #0a3a20, 0 6px 10px rgba(0,0,0,.5); letter-spacing: 3px; }
.title-logo span { color: #ffe14d; font-size: 60px; }
.title-bugs { font-size: 30px; margin: 22px 0 6px; letter-spacing: 8px; animation: bob 2.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-7px); } }
.title-foot { margin-top: 14px; opacity: .85; font-size: 14px; }
.mute-btn { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.35);
  border: none; color: #fff; font-size: 22px; width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
  transition: transform .06s, background .06s; }
.mute-btn:active { transform: scale(.88); background: rgba(0,0,0,.55); }

/* ============================================================
   モード選択
   ============================================================ */
#mode-screen { background: linear-gradient(#143d27, #0c1410); justify-content: flex-start; }
.best-label { font-size: 14px; color: #ffe14d; margin-bottom: 14px; }
.mode-grid { width: 100%; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
.mode-card { border-radius: 18px; padding: 16px; text-align: center; border: none; color: #fff;
  background: rgba(255,255,255,.06); box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.mode-card.solo { cursor: pointer; background: linear-gradient(135deg, #2f9e5c, #1c6b3e); }
.mode-card.solo:active { transform: scale(.98); }
.mode-card.vs { background: linear-gradient(135deg, #b5482e, #7d2e1c); }
.mode-emoji { font-size: 40px; }
.mode-name { font-size: 22px; font-weight: 800; margin: 4px 0; }
.mode-desc { font-size: 13px; opacity: .9; }
.cpu-levels { display: flex; gap: 8px; justify-content: center; margin: 12px 0 4px; flex-wrap: wrap; }
.cpu-lv { font: 700 15px inherit; color: #fff; border: 2px solid rgba(255,255,255,.5);
  background: rgba(0,0,0,.25); border-radius: 12px; padding: 8px 12px; cursor: pointer; }
.cpu-lv { transition: transform .06s, background .06s; }
.cpu-lv:active { transform: translateY(2px) scale(.95); background: rgba(0,0,0,.45); }
.cpu-lv.locked { opacity: .35; border-style: dashed; }
.cpu-lv.locked::after { content: " 🔒"; }
.cpu-hint { font-size: 11px; opacity: .8; margin-top: 4px; }

/* ============================================================
   フィールド
   ============================================================ */
#field-screen { background: #0c1410; justify-content: flex-start; }
.hud { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
.hud-pill { background: rgba(0,0,0,.45); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 15px; }
.hud-pill.cpu { background: rgba(180,72,46,.6); }
.hud-pill.combo { background: rgba(226,128,40,.85); color: #fff; }
.hud-give { margin-left: auto; background: rgba(255,255,255,.12); border: none; color: #fff;
  border-radius: 10px; padding: 6px 12px; font: 700 13px inherit; cursor: pointer;
  transition: transform .06s, background .06s; }
.hud-give:active { transform: translateY(2px) scale(.96); background: rgba(255,255,255,.32); }
.field-wrap { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative; }
#field-canvas { width: 100%; height: 100%; max-width: 480px; image-rendering: auto; touch-action: none; }

/* HUDコンボ ピルの パルス */
.hud-pill.combo { animation: combopulse 1s ease-in-out infinite; }
@keyframes combopulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
/* スコア ピルの 一瞬パルス（加点時） */
.hud-pill.pulse { animation: scorepop .55s ease; }
@keyframes scorepop { 0% { transform: scale(1); } 35% { transform: scale(1.35); color: #ffe14d; } 100% { transform: scale(1); } }

/* 復帰トースト（フィールド上・中央やや上＝時計やdパッドを隠さない） */
.toast { position: absolute; top: 14%; left: 50%; transform: translateX(-50%);
  background: rgba(20,54,31,.92); color: #fff; border-radius: 14px; padding: 10px 16px;
  font-weight: 800; font-size: 16px; text-align: center; white-space: nowrap; pointer-events: none;
  box-shadow: 0 4px 14px rgba(0,0,0,.45); z-index: 30; max-width: 92%; }
.toast .t-main { font-size: 17px; }
.toast .t-big { color: #ffd84d; }
.toast .t-combo { color: #ff9b4d; }
.toast.toast-pop { animation: toastpop .5s ease; }
@keyframes toastpop { 0% { transform: translateX(-50%) scale(.5); opacity: 0; } 60% { transform: translateX(-50%) scale(1.1); opacity: 1; } 100% { transform: translateX(-50%) scale(1); } }

/* dパッド（ボタン拡大＋セーフエリア余白で誤タップ低減） */
.dpad { position: relative; width: 220px; height: 220px;
  margin: 6px auto calc(16px + env(safe-area-inset-bottom)); flex: none; }
.dbtn { position: absolute; width: 68px; height: 68px; border-radius: 16px; border: none;
  background: rgba(255,255,255,.16); color: #fff; font-size: 26px; cursor: pointer;
  transition: transform .05s, background .05s; }
.dbtn:active { background: rgba(255,255,255,.42); transform: scale(.92); }
.dbtn.up { top: 0; left: 76px; }
.dbtn.down { bottom: 0; left: 76px; }
.dbtn.left { left: 0; top: 76px; }
.dbtn.right { right: 0; top: 76px; }

/* ============================================================
   捕獲シーン（catch.js が #catch-root に描画）
   スクロール禁止（UIで時計などが隠れない設計）
   ============================================================ */
#catch-screen { overflow: hidden; height: 100%; background: linear-gradient(#7ec9e8, #cde6b0 60%, #8bbf5a); }
#catch-root { width: 100%; height: 100%; display: flex; flex-direction: column; }
.cs-top { display: flex; align-items: center; gap: 8px; padding: 8px 10px; color: #14361f; font-weight: 800; }
.cs-dist { background: rgba(255,255,255,.7); border-radius: 999px; padding: 4px 12px; }
.cs-name { margin-left: auto; background: rgba(255,255,255,.7); border-radius: 999px; padding: 4px 12px; }
/* 警戒ゲージ */
.cs-alert-wrap { padding: 4px 12px; }
.cs-alert-label { font-size: 12px; color: #14361f; font-weight: 700; display: flex; justify-content: space-between; }
.cs-alert-bar { height: 14px; background: rgba(0,0,0,.25); border-radius: 999px; overflow: hidden; margin-top: 3px; }
.cs-alert-fill { height: 100%; width: 0%; border-radius: 999px; transition: width .25s, background .25s; background: #41c46f; }
.cs-alert-fill.warn { background: #f3b13b; }
.cs-alert-fill.danger { background: #e2483a; }
/* アリーナ（横視点） */
.cs-arena { flex: 1; position: relative; min-height: 0; overflow: hidden; }
.cs-arena.warn-glow { box-shadow: inset 0 0 60px 10px rgba(226,72,58,.5); }
.cs-bug { position: absolute; top: 42%; transition: right .4s ease, transform .2s; }
.cs-hunter { position: absolute; bottom: 8%; left: 6%; font-size: 40px; }
.cs-warn-pop { position: absolute; top: 18%; right: 12%; font-size: 22px; font-weight: 900; color: #e2483a;
  text-shadow: 0 2px 0 #fff; animation: pop .4s; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
/* 行動ボタン */
.cs-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; background: rgba(20,54,31,.92); }
.cs-btn { font: 800 16px inherit; color: #fff; border: none; border-radius: 12px; padding: 14px 8px; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.cs-btn:active { transform: translateY(3px); box-shadow: none; }
.cs-btn.approach { background: #c9742e; }
.cs-btn.sneak { background: #4a8f5a; }
.cs-btn.wait { background: #5566b5; }
.cs-btn.net { background: #d24a6a; grid-column: 1 / -1; }
.cs-btn small { display: block; font-size: 11px; font-weight: 600; opacity: .9; margin-top: 2px; }
.cs-btn:disabled { opacity: .5; }
.cs-log { padding: 6px 12px; height: 42px; font-size: 13px; color: #14361f; font-weight: 700; text-align: center; }

/* ============================================================
   リザルト
   ============================================================ */
#result-screen { background: linear-gradient(#1d2b6b, #0c1410); justify-content: flex-start; overflow-y: auto; }
#result-body { width: 100%; padding: 0 16px; }
.res-banner { text-align: center; font-size: 30px; font-weight: 900; margin: 6px 0 12px; }
.res-banner.win { color: #ffe14d; text-shadow: 0 2px 0 #7a5a00; }
.res-banner.lose { color: #c9d1e0; }
.res-vs { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 16px; text-align: center; margin-bottom: 10px; }
.res-vs b { font-size: 28px; }
.vsmid { opacity: .7; }
.res-score { text-align: center; font-size: 18px; }
.res-score b { font-size: 30px; color: #ffe14d; }
.res-best { text-align: center; font-size: 13px; opacity: .85; margin-top: 4px; }
.res-stat { text-align: center; font-size: 13px; opacity: .9; margin: 10px 0 4px; }
.res-dex { text-align: center; font-size: 15px; font-weight: 800; color: #8fe0a8; margin: 0 0 10px; }
.res-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
.res-bug { position: relative; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08);
  border-radius: 10px; padding: 6px 10px; font-size: 12px; }
.res-new { position: absolute; top: -7px; left: -7px; background: #ffce29; color: #5a3a00;
  font-weight: 900; font-size: 10px; padding: 1px 5px; border-radius: 7px; transform: rotate(-12deg);
  box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.res-empty { text-align: center; opacity: .7; padding: 20px; }
.result-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.big-btn.retry { background: linear-gradient(#f0a93a, #d4842a); box-shadow: 0 5px 0 #9a5e15, 0 8px 16px rgba(0,0,0,.4); }
.big-btn.retry:active { box-shadow: 0 1px 0 #9a5e15; }

/* 紙吹雪（勝利） */
.confetti { position: fixed; top: -10px; width: 9px; height: 14px; opacity: .9; z-index: 50; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); } }

/* ===== src/styles-catch.css ===== */
/* ============================================================
   むしとりバトル — styles-catch.css（捕獲シーンの ついかCSS）
   build.mjs が styles.css の あとに 連結する（後勝ち）。
   ・捕獲シーンの 演出・keyframes は ぜんぶ ここ。
   ・#catch-screen の overflow:hidden;height:100% は こわさない。
     演出は すべて transform / opacity / keyframes で 完結させる。
   ============================================================ */

/* ---- ② 虫の 生きてる感: いつも ふわふわ（idle bob） ---- */
.cs-bug { animation: cs-bob 2.4s ease-in-out infinite; will-change: transform; }
@keyframes cs-bob {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50%      { transform: translateY(-7px) rotate(1deg); }
}

/* ② 警戒≥70 で 小刻みに 震える（bob より つよく） */
.cs-bug.tremble { animation: cs-tremble .14s linear infinite; }
@keyframes cs-tremble {
  0%   { transform: translate(0, 0) rotate(0); }
  25%  { transform: translate(-2px, 1px) rotate(-2deg); }
  50%  { transform: translate(2px, -1px) rotate(2deg); }
  75%  { transform: translate(-1px, 2px) rotate(-1deg); }
  100% { transform: translate(1px, -1px) rotate(1deg); }
}

/* ---- ① 命中フラッシュ（白）---- */
.cs-flash {
  position: absolute; inset: 0; background: #fff; opacity: 0;
  pointer-events: none; z-index: 5; border-radius: 4px;
  animation: cs-flash .34s ease-out forwards;
}
@keyframes cs-flash {
  0%   { opacity: 0; }
  20%  { opacity: .92; }
  100% { opacity: 0; }
}

/* ① 命中: 虫が 網へ 吸い込まれ ちいさく消える */
.cs-bug.caught-suck {
  animation: cs-suck .5s cubic-bezier(.5, -0.2, .9, .4) forwards;
  transform-origin: 30% 90%;
}
@keyframes cs-suck {
  0%   { transform: scale(1) translate(0, 0) rotate(0); opacity: 1; }
  60%  { transform: scale(.5) translate(-40px, 30px) rotate(-60deg); opacity: .9; }
  100% { transform: scale(.05) translate(-90px, 70px) rotate(-200deg); opacity: 0; }
}

/* ① big の キラキラ */
.cs-sparkle {
  position: absolute; inset: 0; pointer-events: none; z-index: 6;
}
.cs-sparkle span {
  position: absolute; font-size: 26px; opacity: 0;
  animation: cs-spark .9s ease-out forwards;
}
.cs-sparkle span:nth-child(1) { left: 20%; top: 30%; animation-delay: 0s; }
.cs-sparkle span:nth-child(2) { left: 55%; top: 18%; animation-delay: .08s; }
.cs-sparkle span:nth-child(3) { left: 70%; top: 50%; animation-delay: .16s; }
.cs-sparkle span:nth-child(4) { left: 38%; top: 55%; animation-delay: .24s; }
.cs-sparkle span:nth-child(5) { left: 60%; top: 70%; animation-delay: .12s; }
@keyframes cs-spark {
  0%   { opacity: 0; transform: scale(.3) rotate(0); }
  40%  { opacity: 1; transform: scale(1.2) rotate(40deg); }
  100% { opacity: 0; transform: scale(.6) translateY(-22px) rotate(120deg); }
}

/* ① はずれ: 虫が 素早く回避＋小ゆれ（idle bob を 一時うわがき） */
.cs-bug.dodge { animation: cs-dodge .36s ease-out; }
@keyframes cs-dodge {
  0%   { transform: translateX(0) rotate(0); }
  25%  { transform: translateX(22px) rotate(8deg); }
  50%  { transform: translateX(-10px) rotate(-6deg); }
  75%  { transform: translateX(8px) rotate(4deg); }
  100% { transform: translateX(0) rotate(0); }
}

/* ① 逃走: 画面外へ ダッシュ */
.cs-bug.flee-dash { animation: cs-dash .55s ease-in forwards; }
@keyframes cs-dash {
  0%   { transform: translateX(0) scale(1); opacity: 1; }
  30%  { transform: translateX(-14px) scale(1.05); opacity: 1; }
  100% { transform: translateX(140%) scale(.7); opacity: 0; }
}

/* 逃走の 土ぼこり */
.cs-dust {
  position: absolute; bottom: 16%; right: 8%; font-size: 30px;
  pointer-events: none; z-index: 4; opacity: 0;
  animation: cs-dust .7s ease-out forwards;
}
@keyframes cs-dust {
  0%   { opacity: 0; transform: translateX(0) scale(.6); }
  30%  { opacity: .9; transform: translateX(-10px) scale(1); }
  100% { opacity: 0; transform: translateX(-44px) scale(1.4); }
}

/* ---- ① 網スイング（hunter を 虫へ ふる）---- */
.cs-hunter { transform-origin: 20% 90%; }
.cs-hunter.swing { animation: cs-swing .46s ease-in-out; }
@keyframes cs-swing {
  0%   { transform: rotate(0) translate(0, 0); }
  35%  { transform: rotate(-28deg) translate(6px, -6px); }
  60%  { transform: rotate(38deg) translate(40px, -22px); }
  100% { transform: rotate(0) translate(0, 0); }
}

/* ---- ④ 危険演出: ゲージ 鼓動パルス（≥90 で .danger）---- */
.cs-alert-fill.danger { animation: cs-pulse .6s ease-in-out infinite; }
@keyframes cs-pulse {
  0%, 100% { filter: brightness(1);    box-shadow: 0 0 0 0 rgba(226,72,58,.0); }
  50%      { filter: brightness(1.35); box-shadow: 0 0 8px 2px rgba(226,72,58,.7); }
}

/* ④ アリーナの warn-glow 明滅（≥90 で .danger-glow）。
   既存の .cs-arena.warn-glow（inset shadow）の うえに 明滅を かさねる */
.cs-arena.danger-glow { animation: cs-warnglow .7s ease-in-out infinite; }
@keyframes cs-warnglow {
  0%, 100% { box-shadow: inset 0 0 40px 6px rgba(226,72,58,.30); }
  50%      { box-shadow: inset 0 0 80px 18px rgba(226,72,58,.75); }
}

/* ---- ⑤ 予告誘導: 「いま あみ！」ポップ ---- */
.cs-warn-now {
  position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
  background: #e2483a; color: #fff; font-weight: 900; font-size: 18px;
  padding: 6px 14px; border-radius: 999px; z-index: 7; white-space: nowrap;
  box-shadow: 0 3px 10px rgba(0,0,0,.3);
  animation: cs-nowpop .8s ease-in-out infinite;
}
@keyframes cs-nowpop {
  0%, 100% { transform: translateX(-50%) scale(1);    opacity: .92; }
  50%      { transform: translateX(-50%) scale(1.12); opacity: 1; }
}

/* ⑤ 予告中の 網ボタン 強調パルス */
.cs-btn.net.urge { animation: cs-urge .7s ease-in-out infinite; }
@keyframes cs-urge {
  0%, 100% { transform: scale(1);     box-shadow: 0 0 0 0 rgba(255,210,80,.0); }
  50%      { transform: scale(1.035); box-shadow: 0 0 0 5px rgba(255,210,80,.55); }
}

/* ---- ③ 命中目安 ◎/○/△ の 色（距離バッジ・網ボタンに 色つき）---- */
.cs-mark { font-weight: 900; }
.cs-mark.good { color: #1f9d4d; }
.cs-mark.ok   { color: #e08a18; }
.cs-mark.bad  { color: #d83a2a; }

/* 距離バッジ じたいの ふちどり色（記号と そろえる） */
.cs-dist.mk-good { box-shadow: inset 0 0 0 2px rgba(31,157,77,.6); }
.cs-dist.mk-ok   { box-shadow: inset 0 0 0 2px rgba(224,138,24,.6); }
.cs-dist.mk-bad  { box-shadow: inset 0 0 0 2px rgba(216,58,42,.6); }

/* 網ボタンの ふちで 命中目安を 色づけ */
.cs-btn.net.acc-good { box-shadow: 0 4px 0 #176b35, inset 0 0 0 2px rgba(255,255,255,.35); }
.cs-btn.net.acc-ok   { box-shadow: 0 4px 0 #9a5e0e; }
.cs-btn.net.acc-bad  { box-shadow: 0 4px 0 #8a2118; }
.cs-btn.net .cs-net-main { display: block; }

/* ---- ⑥ けいかいゲージ脇の じょうたい（絵文字＋ことば）---- */
.cs-alert-state {
  display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 999px;
  font-weight: 800; font-size: 11px; color: #14361f;
}
.cs-alert-state.s-calm   { background: rgba(65,196,111,.30); }
.cs-alert-state.s-care   { background: rgba(243,177,59,.32); }
.cs-alert-state.s-danger { background: rgba(226,72,58,.30); color: #7a1810; }
.cs-alert-state.s-flee   { background: rgba(226,72,58,.55); color: #fff;
  animation: cs-pulse .6s ease-in-out infinite; }

/* レイアウトが くずれない ようにする ねんのため（高さ固定は styles.css がもつ） */
.cs-arena { position: relative; }

</style>
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section id="title-screen" class="screen active">
    <div class="title-wrap">
      <div class="title-logo">むしとり<br><span>バトル</span></div>
      <div class="title-bugs">🦋 🐝 🐞 🦗 🐛</div>
      <button id="btn-start" class="big-btn">▶ はじめる</button>
      <div class="title-foot">あみで むしを つかまえよう！</div>
    </div>
    <button id="btn-mute" class="mute-btn" aria-label="おと">🔊</button>
  </section>

  <!-- モード選択 -->
  <section id="mode-screen" class="screen">
    <h1 class="screen-title">モードを えらぶ</h1>
    <div id="best-label" class="best-label">ソロ さいこう: 0 pt</div>
    <div class="mode-grid">
      <button id="btn-solo" class="mode-card solo">
        <div class="mode-emoji">🌳</div>
        <div class="mode-name">ソロ</div>

<script>

/* ===== src/data/bugs.js ===== */
/* ============================================================
   むしとりバトル — data/bugs.js（虫データ＆みため）
   ・BUGS … 虫ずかんの正データ（20種いじょう）
   ・DAY_KEYS / NIGHT_KEYS … time でふりわけたキーの配列
   ・pickSpecies(night) … レア度 w で重みづけ抽選
   ・bugSprite(key, sizePx) … インラインSVG文字列（shape ごとに描き分け）
   ・drawBugMini(ctx, key, cx, cy, r) … Canvas にちいさく描く（任意）
   ※ import/export しない。グローバル共有。トップレベルで document を触らない。
   ============================================================ */

/* ---- 虫ずかん（キー＝英数id） ----
   w: 3=ふつう / 2=中堅 / 1=レア。レア度と pts/alertBase/sizeBase を相関させ、
   出現は w でしぼる（夜は w3 を出さない、昼は w1 を出さない）。 */
const BUGS = {
  /* === ふつう（w:3）：出やすい・低得点・おとなしい === */
  monshiro:  { name: 'もんしろちょう',   color: '#fdfdf6', accent: '#cfcfc2', w: 3, pts: 10, alertBase: 4,  sizeBase: 45,  time: 'day',   shape: 'butterfly' },

  onbubatta: { name: 'おんぶばった',     color: '#a4c489', accent: '#5a9a3a', w: 3, pts: 9,  alertBase: 4,  sizeBase: 42,  time: 'both',  shape: 'grasshopper' },
  nanahoshi: { name: 'ななほしてんとう', color: '#d83a2a', accent: '#1a1712', w: 3, pts: 11, alertBase: 3,  sizeBase: 8,   time: 'both',  shape: 'ladybug' },
  kokuwa:    { name: 'こくわがた',       color: '#4a3a2a', accent: '#241a0f', w: 3, pts: 16, alertBase: 6,  sizeBase: 38,  time: 'both',  shape: 'stag' },
  kokabuto:  { name: 'こかぶとむし',     color: '#5a4632', accent: '#2e2214', w: 3, pts: 18, alertBase: 6,  sizeBase: 40,  time: 'both',  shape: 'beetle' },
  niinii:    { name: 'にいにいぜみ',     color: '#6b6252', accent: '#332e24', w: 3, pts: 14, alertBase: 7,  sizeBase: 35,  time: 'day',   shape: 'cicada' },
  shiokara:  { name: 'しおからとんぼ',   color: '#7ab2c9', accent: '#3a6a8a', w: 3, pts: 15, alertBase: 8,  sizeBase: 50,  time: 'day',   shape: 'dragonfly' },
  enma:      { name: 'えんまこおろぎ',   color: '#4a4036', accent: '#241f16', w: 3, pts: 13, alertBase: 6,  sizeBase: 30,  time: 'night', shape: 'grasshopper' },
  mitsubachi:{ name: 'みつばち',         color: '#d9b441', accent: '#7a5a10', w: 3, pts: 17, alertBase: 9,  sizeBase: 14,  time: 'day',   shape: 'bee' },

  ageha:     { name: 'あげはちょう',     color: '#ffd84d', accent: '#3d3a2e', w: 2, pts: 30, alertBase: 11, sizeBase: 90,  time: 'day',   shape: 'butterfly' },
  nokogiri:  { name: 'のこぎりくわがた', color: '#6b3a1a', accent: '#33180a', w: 2, pts: 42, alertBase: 12, sizeBase: 60,  time: 'both',  shape: 'stag' },

  akiakane:  { name: 'あきあかね',       color: '#c14e34', accent: '#8a2a15', w: 2, pts: 30, alertBase: 11, sizeBase: 38,  time: 'day',   shape: 'dragonfly' },
  minmin:    { name: 'みんみんぜみ',     color: '#4a6e4a', accent: '#1f3a1f', w: 2, pts: 45, alertBase: 13, sizeBase: 60,  time: 'day',   shape: 'cicada' },
  tonosama:  { name: 'とのさまばった',   color: '#6aa84f', accent: '#2e5e1f', w: 2, pts: 34, alertBase: 12, sizeBase: 65,  time: 'night', shape: 'grasshopper' },

  kumazemi:  { name: 'くまぜみ',         color: '#26241f', accent: '#5fd0c0', w: 1, pts: 75, alertBase: 16, sizeBase: 65,  time: 'night', shape: 'cicada' },
};

/* ---- 昼夜キー（time でふりわけ。both は両方へ） ---- */
const DAY_KEYS = Object.keys(BUGS).filter(k => BUGS[k].time === 'day' || BUGS[k].time === 'both');
const NIGHT_KEYS = Object.keys(BUGS).filter(k => BUGS[k].time === 'night' || BUGS[k].time === 'both');

/* ---- レア度抽選 ----
   夜は w3 を出さない（夜=レア寄り）、昼は w1 を出さない（昼=ふつう寄り）。
   候補の w をそのまま重みに使う（w 大=出やすい）。 */
function pickSpecies(night) {
  const pool = night ? NIGHT_KEYS : DAY_KEYS;
  // この時間帯で出してよい候補（昼=w1除外 / 夜=w3除外）
  const cands = pool.filter(k => {
    const w = BUGS[k].w;
    if (night) return w !== 3;   // 夜は ふつう を出さない
    return w !== 1;              // 昼は レア を出さない
  });
  if (!cands.length) return pool[0]; // 念のため
  let total = 0;
  for (let i = 0; i < cands.length; i++) total += BUGS[cands[i]].w;
  let r = Math.random() * total;
  for (let i = 0; i < cands.length; i++) {
    r -= BUGS[cands[i]].w;
    if (r < 0) return cands[i];
  }
  return cands[cands.length - 1];
}

        ${wing}

        <path d="M48 31 Q 40 18, 34 14 M52 31 Q 60 18, 66 14" fill="none" stroke="${A}" stroke-width="2" stroke-linecap="round"/>
        <circle cx="34" cy="14" r="2.4" fill="${A}"/><circle cx="66" cy="14" r="2.4" fill="${A}"/>
        ${sheen(22, 38, 6, 4, 0.3)}`;
      break;
    }

    /* ===== かぶとむし系（rhino）：おおきな一本ヅノ ===== */

      const legs = `
        <path d="M40 56 L 22 48 M40 66 L 20 66 M42 74 L 24 84" stroke="${A}" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <g transform="translate(100 0) scale(-1 1)">
          <path d="M40 56 L 22 48 M40 66 L 20 66 M42 74 L 24 84" stroke="${A}" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        </g>`;
      body = `
        ${legs}
        <ellipse cx="50" cy="66" rx="24" ry="22" fill="${C}" stroke="${A}" stroke-width="2.4"/>
        <line x1="50" y1="46" x2="50" y2="86" stroke="${A}" stroke-width="2"/>

        <!-- 一本ヅノ：先がふたまた -->

        ${sheen(40, 56, 8, 6, 0.22)}`;

    /* ===== くわがた（stag）：大きなはさみ（おおあご） ===== */
    case 'stag': {
      const legs = `
        <path d="M40 58 L 24 50 M40 68 L 22 70 M42 76 L 26 86" stroke="${A}" stroke-width="3.2" fill="none" stroke-linecap="round"/>

    case 'grasshopper': {
      const backleg = `<path d="M54 56 L 84 40 L 90 50 L 60 64 Z" fill="${C}" stroke="${A}" stroke-width="2"/>
        <path d="M86 44 L 96 74 L 90 84" stroke="${A}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      body = `
        ${backleg}
        <path d="M40 58 L 34 76 M50 60 L 48 80" stroke="${A}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <path d="M24 54 Q 50 46, 78 54 Q 84 58, 76 64 Q 50 68, 28 62 Q 22 58, 24 54 Z" fill="${C}" stroke="${A}" stroke-width="2.2"/>
        <path d="M30 54 Q 56 50, 76 56" stroke="${A}" stroke-width="1.4" fill="none" opacity="0.6"/>
        <path d="M24 54 Q 20 46, 26 42 Q 34 44, 34 54 Z" fill="${C}" stroke="${A}" stroke-width="2"/>
        <ellipse cx="20" cy="52" rx="8" ry="9" fill="${C}" stroke="${A}" stroke-width="2"/>
        <circle cx="16" cy="49" r="3" fill="${A}"/>
        <circle cx="15.4" cy="48.2" r="1" fill="#fff"/>
        <path d="M16 47 Q 6 30, 0 22" fill="none" stroke="${A}" stroke-width="1.8" stroke-linecap="round"/>
        ${sheen(46, 52, 14, 3, 0.18)}`;
      break;
    }

    default: {
      body = `<circle cx="50" cy="55" r="26" fill="${C}" stroke="${A}" stroke-width="2.4"/>
        <circle cx="42" cy="48" r="3" fill="${A}"/><circle cx="58" cy="48" r="3" fill="${A}"/>`;
    }
  }
  return head + body + tail;
}

/* ---- Canvas にミニ虫（任意・簡易）。けはい演出などに使える ---- */
function drawBugMini(ctx, key, cx, cy, r) {
  const b = BUGS[key] || { color: '#888', accent: '#333', shape: 'beetle' };
  ctx.save();
  // どうたい
  ctx.fillStyle = b.color;
  ctx.strokeStyle = b.accent;
  ctx.lineWidth = Math.max(1, r * 0.16);
  ctx.beginPath();
  ctx.ellipse(cx, cy, r, r * 1.1, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // shape ごとのちょいアクセント
  if (b.shape === 'butterfly') {
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.ellipse(cx - r, cy - r * 0.4, r * 0.9, r * 0.7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx + r, cy - r * 0.4, r * 0.9, r * 0.7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else if (b.shape === 'rhino' || b.shape === 'stag') {
    ctx.strokeStyle = b.accent;
    ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy - r * 1.8); ctx.stroke();
  } else if (b.shape === 'dragonfly' || b.shape === 'bee') {
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(cx - r * 0.8, cy - r * 0.6, r, r * 0.4, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + r * 0.8, cy - r * 0.6, r, r * 0.4, 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (b.shape === 'ladybug') {
    ctx.fillStyle = b.accent;
    ctx.beginPath(); ctx.arc(cx - r * 0.4, cy, r * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.4, cy, r * 0.18, 0, Math.PI * 2); ctx.fill();
  }
  // め
  ctx.fillStyle = b.accent;
  ctx.beginPath(); ctx.arc(cx - r * 0.3, cy - r * 0.6, r * 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + r * 0.3, cy - r * 0.6, r * 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}


/* ===== src/audio/sound.js ===== */
/* ============================================================
   むしとりバトル — sound.js（おとエンジン / Web Audio 合成のみ）
   公開API（CONTRACT厳守）:
     Sound.unlock()            初回タッチで AudioContext 生成/再開
     Sound.setMuted(bool) / Sound.isMuted()
     Sound.bgm(name)           'title'|'field'|'vs'|'result'（多重再生しない）
     Sound.stop()              BGM停止
     Sound.sfx = { select,step,catch,miss,flee,big,win,lose,warn }
   ・外部音源ファイル禁止。合成のみ。
   ・muted時は鳴らさない。未対応/未生成でも例外を投げず no-op。
   ・トップレベルで AudioContext を即生成しない（ヘッドレス安全）。
   ============================================================ */
const Sound = (() => {
  let ac = null;            // AudioContext（unlock まで遅延生成）
  let master = null;        // マスター gain（→ リミッター → 出力）
  let musicGain = null;     // BGM 用 gain
  let sfxGain = null;       // 効果音 用 gain
  let muted = false;
  let started = false;      // ctx 生成済みか
  let unsupported = false;  // AudioContext 非対応
  let musicTimer = null;    // BGM スケジューラの timeout ハンドル
  let curBgm = null;        // いま鳴っている BGM 名（多重再生ふせぎ）

  /* ---- AudioContext を必要になってから1度だけ作る ---- */
  function ctx() {
    if (ac) return ac;
    if (unsupported) return null;
    try {
      const AC = (typeof window !== 'undefined') &&
        (window.AudioContext || window.webkitAudioContext);
      if (!AC) { unsupported = true; return null; }
      ac = new AC();
      // リミッター（音が重なっても割れないように強めに圧縮）
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -12;
      comp.knee.value = 16;
      comp.ratio.value = 14;
      comp.attack.value = 0.003;
      comp.release.value = 0.25;
      comp.connect(ac.destination);
      master = ac.createGain(); master.gain.value = 0.62; master.connect(comp);
      musicGain = ac.createGain(); musicGain.gain.value = 0.24; musicGain.connect(master);
      sfxGain = ac.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(master);
      started = true;
    } catch (e) { unsupported = true; ac = null; return null; }
    return ac;
  }

  function resumeIfNeeded(a) {
    try { if (a && a.state === 'suspended' && a.resume) a.resume(); } catch (e) {}
  }

  /* ============================================================
     unlock：初回ユーザー操作で呼ぶ。iOS の無音アンロックも行う。
     ============================================================ */
  function unlock() {
    try {
      const a = ctx();
      if (!a) return;
      resumeIfNeeded(a);
      // iOS Safari/Chrome: 同期的に無音バッファを1回再生して解放
      try {
        const b = a.createBuffer(1, 1, 22050);
        const src = a.createBufferSource();
        src.buffer = b; src.connect(a.destination);
        if (src.start) src.start(0); else if (src.noteOn) src.noteOn(0);
      } catch (e) {}
      resumeIfNeeded(a);
    } catch (e) { /* no-op */ }
  }

  function setMuted(b) {
    muted = !!b;
    if (muted) stopBgmLoop();
    else if (curBgm) { const m = curBgm; curBgm = null; startBgm(m); } // 再開
  }
  function isMuted() { return muted; }

  /* ============================================================
     かんたんなオシレータ音（効果音の部品）
     ============================================================ */
  function tone(freq, t0, dur, type, gain, glideTo) {
    const a = ctx(); if (!a) return;
    try {
      const o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      if (glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, glideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(sfxGain);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  function noise(t0, dur, gain, hp) {
    const a = ctx(); if (!a) return;
    try {
      const n = Math.max(1, Math.floor(a.sampleRate * dur));
      const buf = a.createBuffer(1, n, a.sampleRate);
      const d = buf.getChannelData ? buf.getChannelData(0) : null;
      if (d) for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = a.createBufferSource(); src.buffer = buf;
      const g = a.createGain(); g.gain.value = gain;
      const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 800;
      src.connect(f); f.connect(g); g.connect(sfxGain);
      src.start(t0);
    } catch (e) {}
  }

  /* 効果音は呼ばれるたび「今」から鳴らす */
  function now() { const a = ctx(); return a ? a.currentTime : 0; }
  function guard(fn) {
    return function () {
      if (muted) return;
      const a = ctx(); if (!a) return;
      resumeIfNeeded(a);
      try { fn(); } catch (e) { /* no-op */ }
    };
  }

  const sfx = {
    // メニュー選択（ピッ）
    select: guard(() => { const t = now(); tone(660, t, 0.08, 'triangle', 0.18); }),
    // 1マス歩く（控えめ・短い）
    step:   guard(() => { const t = now(); tone(150, t, 0.045, 'square', 0.05, 120); }),
    // 捕獲成功（上昇アルペジオ）
    catch:  guard(() => { const t = now(); [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.09, 0.2, 'triangle', 0.22)); }),
    // あみ はずれ（コツン下降）
    miss:   guard(() => { const t = now(); tone(300, t, 0.14, 'square', 0.14, 130); noise(t, 0.1, 0.06, 600); }),
    // 逃走（さーっと下降）
    flee:   guard(() => { const t = now(); tone(520, t, 0.42, 'sawtooth', 0.16, 110); noise(t, 0.25, 0.06, 500); }),
    // でかい！（きらきら）
    big:    guard(() => { const t = now(); [392, 523, 659, 880, 1175].forEach((f, i) => tone(f, t + i * 0.07, 0.28, 'triangle', 0.24)); noise(t, 0.3, 0.07, 3000); }),
    // 勝ち（ファンファーレ）
    win:    guard(() => { const t = now(); [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * 0.11, 0.26, 'triangle', 0.24)); }),
    // 負け（しょんぼり下降）
    lose:   guard(() => { const t = now(); [392, 330, 262].forEach((f, i) => tone(f, t + i * 0.17, 0.3, 'sine', 0.2)); }),
    // 警戒予告（ピピッ）
    warn:   guard(() => { const t = now(); tone(740, t, 0.1, 'square', 0.16); tone(740, t + 0.16, 0.1, 'square', 0.16); }),
  };

  /* ============================================================
     BGM：絶対時刻スケジューラ（音割れしない四つ打ち系）
     曲ごとに テンポ・コード・リード を変える。
     ============================================================ */
  function semis(n) { return 440 * Math.pow(2, n / 12); }

  // メロディ譜 [半音オフセット(整数) or 'r'休符, 長さ(拍)]
  const MEL_TITLE = [ // わくわく長調・はずむフック
    [7, .5], [7, .5], [12, .5], [7, .5], [9, .5], [7, .5], [4, 1],
    [5, .5], [5, .5], [9, .5], [5, .5], [7, .5], [5, .5], [0, 1],
    [7, .5], [12, .5], [14, .5], [16, .5], [14, .5], [12, .5], [9, 1],
    [11, .5], [9, .5], [7, .5], [9, .5], [7, .5], [4, .5], [0, 1],
  ];
  const MEL_FIELD = [ // 明るい昼・のびやか
    [12, .5], [14, .5], [12, .5], [9, .5], [7, .5], [9, .5], [12, 1],
    [11, .5], [9, .5], [7, .5], [5, .5], [4, .5], [5, .5], [7, 1],
    [9, .5], [12, .5], [9, .5], [7, .5], [5, .5], [7, .5], [9, 1],
    [7, .5], [5, .5], [4, .5], [2, .5], [4, .5], [7, .5], [12, 1],
  ];
  const MEL_VS = [ // 緊張感・短調マイナーフック
    [0, .5], [12, .5], [0, .5], [7, .5], [3, .5], [10, .5], [3, .5], [7, .5],
    [5, .5], [12, .5], [5, .5], [10, .5], [3, .5], [7, .5], [0, 1],
    [12, .5], [11, .5], [10, .5], [7, .5], [5, .5], [7, .5], [10, .5], [11, .5],
    [12, .5], [7, .5], [3, .5], [0, .5], [0, 1], [12, 1],
  ];
  const MEL_RESULT = [ // ファンファーレ風
    [0, 1], [4, .5], [7, .5], [12, 2],
    [7, .5], [12, .5], [16, 1], [12, 1],
    [9, 1], [11, .5], [12, .5], [16, 2],
  ];

  // トラック定義（root=基準周波数, chords=4拍ごと進行）
  const TRACKS = {
    title:  { bpm: 126, root: 294, mel: MEL_TITLE,  drums: true,  chords: [[0, 4, 7], [5, 9, 12], [-3, 0, 4], [2, 5, 9]] },
    field:  { bpm: 132, root: 330, mel: MEL_FIELD,  drums: true,  chords: [[0, 4, 7], [7, 11, 14], [5, 9, 12], [2, 5, 9]] },
    vs:     { bpm: 142, root: 277, mel: MEL_VS,     drums: true,  chords: [[0, 3, 7], [-2, 1, 5], [5, 8, 12], [-1, 3, 7]] },
    result: { bpm: 120, root: 294, mel: MEL_RESULT, drums: false, chords: [[0, 4, 7], [0, 4, 7], [5, 9, 12], [7, 11, 14]] },
  };

  // シンセリード（矩形＋ノコギリ・フィルタで張りのある音）
  function synthLead(a, freq, t, dur, vol) {
    try {
      const o1 = a.createOscillator(), o2 = a.createOscillator();
      const g = a.createGain(), f = a.createBiquadFilter();
      o1.type = 'square'; o2.type = 'sawtooth';
      o1.frequency.setValueAtTime(freq, t);
      o2.frequency.setValueAtTime(freq * 1.006, t);
      f.type = 'lowpass'; f.Q.value = 6;
      f.frequency.setValueAtTime(3000, t);
      f.frequency.exponentialRampToValueAtTime(900, t + dur * 0.9);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.setValueAtTime(vol, t + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.96);
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(musicGain);
      o1.start(t); o2.start(t); o1.stop(t + dur); o2.stop(t + dur);
    } catch (e) {}
  }
  // サブベース（丸い低音）
  function subBass(a, freq, t, dur, vol) {
    try {
      const o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o2.type = 'triangle';
      o.frequency.setValueAtTime(freq, t); o2.frequency.setValueAtTime(freq, t);
      const g2 = a.createGain(); g2.gain.value = 0.25;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.setValueAtTime(vol, t + dur * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.95);
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(musicGain);
      o.start(t); o2.start(t); o.stop(t + dur); o2.stop(t + dur);
    } catch (e) {}
  }
  // キック（四つ打ち）
  function kick(a, t) {
    try {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(165, t);
      o.frequency.exponentialRampToValueAtTime(48, t + 0.1);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.55, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(musicGain);
      o.start(t); o.stop(t + 0.22);
    } catch (e) {}
  }
  // ハイハット
  function hat(a, t, open) {
    try {
      const dur = open ? 0.1 : 0.04;
      const n = Math.max(1, Math.floor(a.sampleRate * dur));
      const buf = a.createBuffer(1, n, a.sampleRate);
      const d = buf.getChannelData ? buf.getChannelData(0) : null;
      if (d) for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = a.createBufferSource(); src.buffer = buf;
      const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = open ? 7000 : 5000;
      const g = a.createGain(); g.gain.value = open ? 0.05 : 0.06;
      src.connect(f); f.connect(g); g.connect(musicGain); src.start(t);
    } catch (e) {}
  }

  function startBgm(name) {
    const a = ctx(); if (!a) { curBgm = name; return; }
    if (curBgm === name && musicTimer) return; // すでに同じ曲が鳴っている
    curBgm = name;
    stopBgmLoop();                              // 前を必ず止める（多重再生ふせぎ）
    if (muted || !name) return;
    const tr = TRACKS[name]; if (!tr) return;
    resumeIfNeeded(a);

    const beat = 60 / tr.bpm;
    const rootSemi = 12 * Math.log2(tr.root / 440);
    let mi = 0;        // メロディ index
    let beatPos = 0;   // 何拍目か
    let nextTime = a.currentTime + 0.12;

    const tick = () => {
      // 鳴らす条件が崩れていたら止める
      if (muted || curBgm !== name) return;
      resumeIfNeeded(a);
      try {
        const nowT = a.currentTime;
        // タブ復帰などで大きく遅れていたら追いつかせる（音の重なり防止）
        if (nextTime < nowT + 0.02) nextTime = nowT + 0.06;
        const t = nextTime;
        const note = tr.mel[mi % tr.mel.length];
        const dur = note[1] * beat;
        const chord = tr.chords[Math.floor(beatPos / 4) % tr.chords.length];

        // 主旋律＋1オクターブ下を薄く
        if (note[0] !== 'r') {
          synthLead(a, semis(rootSemi + note[0]), t, dur * 0.95, 0.24);
          synthLead(a, semis(rootSemi + note[0] - 12), t, dur * 0.9, 0.07);
        }
        // 8分アルペジオ（コードを刻む＝テクノの推進力）
        const eighth = beat / 2;
        const steps = Math.max(1, Math.round(note[1] / 0.5));
        for (let k = 0; k < steps; k++) {
          const an = chord[(beatPos * 2 + k) % chord.length];
          synthLead(a, semis(rootSemi + an + 12), t + k * eighth, eighth * 0.7, 0.06);
        }
        // ベース＋ドラム（拍ごと）
        const beats = Math.max(1, Math.round(note[1]));
        for (let b = 0; b < beats; b++) {
          const bt = t + b * beat;
          const rootNote = chord[0];
          subBass(a, semis(rootSemi + rootNote - 24), bt, beat * 0.48, 0.24);
          if (tr.drums) {
            kick(a, bt);                 // 四つ打ち
            hat(a, bt, false);
            hat(a, bt + beat * 0.5, true); // ウラはオープン
          }
          beatPos++;
        }
        mi++;
        nextTime += dur;
      } catch (e) { /* このティックは捨てる */ }
      // 実時刻に合わせて次を予約
      let waitMs = 60;
      try { waitMs = Math.max(10, (nextTime - a.currentTime - 0.05) * 1000); } catch (e) {}
      if (!isFinite(waitMs)) waitMs = 60;
      musicTimer = setTimeout(tick, waitMs);
    };
    tick();
  }

  function stopBgmLoop() {
    if (musicTimer) { try { clearTimeout(musicTimer); } catch (e) {} musicTimer = null; }
  }
  function bgm(name) {
    try { startBgm(name); } catch (e) { /* no-op */ }
  }
  function stop() {
    curBgm = null;
    stopBgmLoop();
  }

  return {
    unlock,
    setMuted, isMuted,
    bgm, stop,
    sfx,
  };
})();


/* ===== src/game/core.js ===== */
/* ============================================================
   むしとりバトル — core.js（ゲームのせなか骨）
   状態・設定・共通関数・画面フロー・統合点をここに集約する。
   ほかのモジュールはここで定義した G / CONFIG / U と
   関数（genMap など）を「グローバル共有」で呼び合う。
   ※ ESモジュール化しない（import/export禁止）。
   ============================================================ */

/* ---- チューニング値（数値の正） ---- */
const CONFIG = {
  // フィールド（カメラ追従の広いマップ）
  MAP_W: 30,            // タイル横
  MAP_H: 34,            // タイル縦
  VIEW_TILE: 40,        // 描画時の1タイルpx（カメラのズーム感）
  STEP_MS: 150,         // プレイヤーが1マス進む時間
  SIGN_TARGET: 9,       // 場に出す「けはい」の目安数
  SIGN_RESPAWN_MS: 1400,// けはい再出現の待ち
  // ラウンド
  ROUND_SEC: 90,        // 1ラウンドの秒数
  // 捕獲シーン
  START_DIST: 8,        // 開始きょり(m)
  NET_HIT: { 2: 0.60, 1: 0.80, 0: 0.30 }, // きょり別あみ命中
  ALERT_FLEE: 100,      // これ以上でにげる
  ALERT_WARN: 70,       // これ以上で「けいかい！」予告
  WARN_FLEE_P: 0.45,    // 予告後の毎手にげ確率（まつ除く）
  // CPU（対戦）
  CPU_STEP_MS: { 1: 760, 2: 700, 3: 640, 4: 580, 5: 520 },
  CPU_CATCH_P: { 1: 0.35, 2: 0.45, 3: 0.55, 4: 0.65, 5: 0.75 },
  CPU_CHASE_R: 9,       // この範囲内のけはいへ追跡
  WIN_BONUS: 50,        // 対戦勝利ボーナス
};

/* ---- ゲーム全体の状態 ---- */
const G = {
  screen: 'title',
  mode: 'solo',     // 'solo' | 'vs'
  cpuLv: 1,         // 1..5（vs時）
  night: false,     // 夜フィールドか
  // ラウンド進行
  running: false,
  timeLeft: 0,
  score: 0,
  cpuScore: 0,
  combo: 0,         // れんぞく ほかく かず（0=とぎれた）
  caught: [],       // [{key,name,pts,mm,big}]
  cpuCaught: [],
  // フィールド
  map: null,        // {w,h,tiles:Int8Array} tiles:0草 1水 2岩 3木 4道 5砂利
  signs: [],        // [{tx,ty,key,id}]
  signSeq: 0,
  player: { tx: 0, ty: 0, x: 0, y: 0, dir: 'down', moving: false, mvT: 0, fx: 0, fy: 0, busy: false },
  cpu: { tx: 0, ty: 0, x: 0, y: 0, dir: 'down', moving: false, mvT: 0, fx: 0, fy: 0, stopUntil: 0, path: null, targetId: null },
  input: { dx: 0, dy: 0 }, // 押されている方向
  // 捕獲シーン
  cs: null,
  // 保存
  best: { solo: 0, seen: [] }, // seen: つかまえた ことの ある しゅの キーはいれつ
  vsUnlocked: 1,    // 解放済みCPUレベル
  sfxOn: true,
};

/* ---- 共通ユーティリティ U ---- */
const U = {
  rnd: () => Math.random(),
  rint: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  chance: (p) => Math.random() < p,
  clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
  // タイルが歩けるか
  walkable: (tx, ty) => {
    const m = G.map; if (!m) return false;
    if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) return false;
    const t = m.tiles[ty * m.w + tx];
    return t === 0 || t === 4 || t === 5; // 草・道・砂利
  },
  tile: (tx, ty) => {
    const m = G.map; if (!m) return 2;
    if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) return 2;
    return m.tiles[ty * m.w + tx];
  },
};

/* ---- コンボ倍率（combo1→×1, 2→×1.25, 3→×1.5, 4→×1.75, 5+→×2） ---- */
function comboMult(n) {
  return Math.min(2, 1 + 0.25 * (n - 1));
}

/* ---- ずかんの総しゅすう ---- */
function bugTotal() {
  return (typeof BUGS !== 'undefined') ? Object.keys(BUGS).length : 0;
}

/* ---- DOM参照（init で埋める） ---- */
const D = {};

/* ---- 画面きりかえ ---- */
function showScreen(id) {
  G.screen = id;
  document.querySelectorAll('.screen').forEach(el => {
    el.classList.toggle('active', el.id === id);
  });
}

/* ---- 永続化（window.storage 優先・localStorage フォールバック） ---- */
function loadSave() {
  try {
    const raw = (window.storage && window.storage.getItem)
      ? window.storage.getItem('mushiBattle')
      : localStorage.getItem('mushiBattle');
    if (raw) {
      const s = JSON.parse(raw);
      if (s.best) G.best = Object.assign(G.best, s.best);
      if (!Array.isArray(G.best.seen)) G.best.seen = []; // ふるい セーブの ほご
      if (s.vsUnlocked) G.vsUnlocked = s.vsUnlocked;
      if (typeof s.sfxOn === 'boolean') G.sfxOn = s.sfxOn;
    }
  } catch (e) { /* むし */ }
}
function persistSave() {
  const s = { best: G.best, vsUnlocked: G.vsUnlocked, sfxOn: G.sfxOn };
  try {
    const raw = JSON.stringify(s);
    if (window.storage && window.storage.setItem) window.storage.setItem('mushiBattle', raw);
    else localStorage.setItem('mushiBattle', raw);
  } catch (e) { /* むし */ }
}

/* ============================================================
   画面フロー
   ============================================================ */

/* タイトル → モード選択 */
function gotoModeSelect() {
  Sound.unlock();
  Sound.bgm('title');
  refreshModeSelect();
  showScreen('mode-screen');
}

function refreshModeSelect() {
  // 対戦レベルボタンの解放状態
  document.querySelectorAll('[data-cpulv]').forEach(btn => {
    const lv = +btn.dataset.cpulv;
    const locked = lv > G.vsUnlocked;
    btn.disabled = locked;
    btn.classList.toggle('locked', locked);
  });
  if (D.bestLabel) D.bestLabel.textContent = 'ソロ さいこう: ' + (G.best.solo || 0) + ' pt';
}

/* ラウンド開始（mode/cpuLv/night は呼び出し側で設定済み） */
function startRun() {
  G.running = true;
  G.score = 0; G.cpuScore = 0;
  G.combo = 0;
  G.caught = []; G.cpuCaught = [];
  resetGiveup(); // 「やめる」かくにん じょうたいの リセット
  G.timeLeft = CONFIG.ROUND_SEC;
  G.signs = []; G.signSeq = 0;
  G.input.dx = 0; G.input.dy = 0;
  G.player.busy = false;

  genMap();                 // field-cpu.js: G.map / G.signs / プレイヤー初期位置
  if (G.mode === 'vs') setupCpu(); // field-cpu.js

  updateHud();
  showScreen('field-screen');
  Sound.bgm(G.mode === 'vs' ? 'vs' : 'field');
  startField();             // field-cpu.js: rAF ループ開始

  startTimer();
}

/* 1秒タイマー */
let _timerH = null;
function startTimer() {
  stopTimer();
  _timerH = setInterval(() => {
    if (!G.running || G.player.busy) return; // 捕獲中はとめる
    G.timeLeft--;
    updateHud();
    if (G.timeLeft <= 0) endRun();
  }, 1000);
}
function stopTimer() { if (_timerH) { clearInterval(_timerH); _timerH = null; } }

/* HUD更新 */
function updateHud() {
  if (D.hudTime) D.hudTime.textContent = '⏱ ' + Math.max(0, G.timeLeft);
  if (D.hudScore) D.hudScore.textContent = '🐛 ' + G.score;
  if (D.hudCpu) {
    D.hudCpu.style.display = G.mode === 'vs' ? '' : 'none';
    D.hudCpu.textContent = '🤖 ' + G.cpuScore;
  }
  if (D.hudCombo) {
    if (G.combo >= 2) {
      D.hudCombo.style.display = '';
      D.hudCombo.textContent = '🔥コンボ ×' + G.combo;
    } else {
      D.hudCombo.style.display = 'none';
    }
  }
}

/* 一瞬だけ クラスを つけて はずす（パルス用） */
function pulseEl(el, cls, ms) {
  if (!el) return;
  el.classList.remove(cls);
  // リフロー させて アニメを やりなおす
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(function () { if (el) el.classList.remove(cls); }, ms || 500);
}

/* フィールド復帰トースト（時計や操作を隠さない位置＝中央やや上） */
let _toastH = null;
function showToast(html, ms) {
  const t = D.toast;
  if (!t) return;
  t.innerHTML = html;
  t.style.display = '';
  pulseEl(t, 'toast-pop', 700);
  if (_toastH) clearTimeout(_toastH);
  _toastH = setTimeout(function () { if (t) t.style.display = 'none'; }, ms || 1400);
}

/* 捕獲シーンから もどる。result = {caught:bool, key, name, pts, mm, big} | null */
function returnToField(result) {
  if (result && result.caught) {
    // コンボ ふやして 倍率を かける（result.pts は base＝big×2 まで反映ずみ）
    G.combo++;
    const gained = Math.round((result.pts || 0) * comboMult(G.combo));
    result.gained = gained; // りれきに のこす
    // ずかん：はじめての しゅかどうか しらべてから seen へ
    let isNew = false;
    if (result.key) {
      if (!Array.isArray(G.best.seen)) G.best.seen = [];
      if (G.best.seen.indexOf(result.key) < 0) { isNew = true; G.best.seen.push(result.key); }
    }
    result.isNew = isNew;
    G.caught.push(result);
    G.score += gained;
    // トースト（でかい!!・コンボ×N を併記）
    let extra = '';
    if (result.big) extra += ' <b class="t-big">でかい!!</b>';
    if (G.combo >= 2) extra += ' <b class="t-combo">コンボ ×' + G.combo + '</b>';
    showToast('<span class="t-main">+' + gained + 'pt ' + (result.name || 'むし') + '！</span>' + extra, 1500);
    pulseEl(D.hudScore, 'pulse', 600);
  } else if (result && result.caught === false) {
    G.combo = 0; // にがした → とぎれる
  }
  G.player.busy = false;
  G.cs = null;
  updateHud();
  if (!G.running) return;
  showScreen('field-screen');
  Sound.bgm(G.mode === 'vs' ? 'vs' : 'field');
  startField(); // ループ再開
}

/* ラウンド終了 → リザルト */
function endRun() {
  if (!G.running) return;
  G.running = false;
  stopTimer();
  stopField();
  G.player.busy = false;

  // ソロ ベスト更新
  let win = null;
  if (G.mode === 'solo') {
    if (G.score > (G.best.solo || 0)) { G.best.solo = G.score; }
  } else {
    win = G.score >= G.cpuScore;
    if (win) {
      G.score += CONFIG.WIN_BONUS;
      // つぎのレベルを解放
      if (G.cpuLv >= G.vsUnlocked && G.vsUnlocked < 5) G.vsUnlocked++;
    }
  }
  persistSave();
  showResult(win);
  Sound.bgm('result');
}

function showResult(win) {
  const big = G.caught.filter(c => c.big).length;
  const maxMm = G.caught.reduce((m, c) => Math.max(m, c.mm || 0), 0);
  let html = '';
  if (G.mode === 'vs') {
    html += `<div class="res-banner ${win ? 'win' : 'lose'}">${win ? '🏆 かち！' : '🥲 まけ…'}</div>`;
    html += `<div class="res-vs"><span>あなた<br><b>${G.score}</b></span><span class="vsmid">VS</span><span>CPU Lv${G.cpuLv}<br><b>${G.cpuScore}</b></span></div>`;
    if (win) Sound.sfx.win(); else Sound.sfx.lose();
  } else {
    html += `<div class="res-banner win">⏱ タイムアップ！</div>`;
    html += `<div class="res-score">スコア <b>${G.score}</b> pt</div>`;
    html += `<div class="res-best">ソロ さいこう: ${G.best.solo} pt</div>`;
    Sound.sfx.win();
  }
  html += `<div class="res-stat">つかまえた: ${G.caught.length}ひき ／ でかい!! ×${big} ／ さいだい ${maxMm}mm</div>`;
  // ずかん コンプ ぐあい
  const seenN = (G.best.seen && G.best.seen.length) || 0;
  html += `<div class="res-dex">📖 ずかん ${seenN}/${bugTotal()}</div>`;
  // つかまえた虫の一覧（はじめて の しゅには NEW バッジ）
  html += '<div class="res-list">';
  G.caught.forEach(c => {
    const newBadge = c.isNew ? '<span class="res-new">NEW</span>' : '';
    html += `<div class="res-bug">${newBadge}${bugSprite(c.key, 42)}<span>${c.name}<br>${c.mm}mm ${c.big ? '★' : ''}</span></div>`;
  });
  if (!G.caught.length) html += '<div class="res-empty">1ぴきも つかまえられなかった…</div>';
  html += '</div>';
  if (D.resultBody) D.resultBody.innerHTML = html;
  showScreen('result-screen');
}

/* ============================================================
   入力（dパッド＋キーボード）→ G.input にためる
   フィールド側がこれを読んで移動する
   ============================================================ */
function bindInput() {
  const set = (dx, dy) => { G.input.dx = dx; G.input.dy = dy; };
  const dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  document.querySelectorAll('[data-dir]').forEach(btn => {
    const [dx, dy] = dirs[btn.dataset.dir];
    const on = (e) => { e.preventDefault(); set(dx, dy); };
    const off = (e) => { e.preventDefault(); if (G.input.dx === dx && G.input.dy === dy) set(0, 0); };
    btn.addEventListener('touchstart', on, { passive: false });
    btn.addEventListener('touchend', off, { passive: false });
    btn.addEventListener('mousedown', on);
    btn.addEventListener('mouseup', off);
    btn.addEventListener('mouseleave', off);
  });
  // キーボード
  const keymap = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  const held = new Set();
  window.addEventListener('keydown', (e) => {
    const dir = keymap[e.key]; if (!dir) return;
    held.add(dir); const [dx, dy] = dirs[dir]; set(dx, dy);
  });
  window.addEventListener('keyup', (e) => {
    const dir = keymap[e.key]; if (!dir) return;
    held.delete(dir);
    if (held.size === 0) set(0, 0);
    else { const last = [...held].pop(); const [dx, dy] = dirs[last]; set(dx, dy); }
  });
}

/* ============================================================
   「やめる」二だんかい かくにん
   1回目：ラベルかえて トースト。2.5秒いないの 2回目で endRun。
   ============================================================ */
let _giveArmed = false;
let _giveH = null;
function resetGiveup() {
  _giveArmed = false;
  if (_giveH) { clearTimeout(_giveH); _giveH = null; }
  if (D.giveBtn) D.giveBtn.textContent = 'やめる';
}
function handleGiveup() {
  if (!G.running) return;
  if (_giveArmed) {
    resetGiveup();
    endRun();
    return;
  }
  _giveArmed = true;
  if (D.giveBtn) D.giveBtn.textContent = 'ほんとに？';
  showToast('もういちど おすと やめる', 2400);
  if (_giveH) clearTimeout(_giveH);
  _giveH = setTimeout(function () { resetGiveup(); }, 2500);
}

/* ============================================================
   初期化
   ============================================================ */
function initGame() {
  // DOM参照
  D.canvas = document.getElementById('field-canvas');
  D.hudTime = document.getElementById('hud-time');
  D.hudScore = document.getElementById('hud-score');
  D.hudCpu = document.getElementById('hud-cpu');
  D.hudCombo = document.getElementById('hud-combo');
  D.toast = document.getElementById('toast');
  D.giveBtn = document.getElementById('btn-giveup');
  D.bestLabel = document.getElementById('best-label');
  D.resultBody = document.getElementById('result-body');

  loadSave();

  // タイトル
  const startBtn = document.getElementById('btn-start');
  if (startBtn) startBtn.addEventListener('click', gotoModeSelect);

  // モード選択
  const soloBtn = document.getElementById('btn-solo');
  if (soloBtn) soloBtn.addEventListener('click', () => {
    G.mode = 'solo'; G.night = false; startRun();
  });
  document.querySelectorAll('[data-cpulv]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      G.mode = 'vs'; G.cpuLv = +btn.dataset.cpulv; G.night = (G.cpuLv >= 4);
      startRun();
    });
  });

  // リザルト → もどる
  const againBtn = document.getElementById('btn-again');
  if (againBtn) againBtn.addEventListener('click', () => { gotoModeSelect(); });

  // リザルト →「もう一回」（直前の mode/cpuLv/night の まま）
  const retryBtn = document.getElementById('btn-retry');
  if (retryBtn) retryBtn.addEventListener('click', () => { startRun(); });

  // フィールドの「やめる」（二だんかい かくにん）
  if (D.giveBtn) D.giveBtn.addEventListener('click', handleGiveup);

  // サウンドトグル
  const muteBtn = document.getElementById('btn-mute');
  if (muteBtn) {
    const sync = () => { muteBtn.textContent = G.sfxOn ? '🔊' : '🔇'; };
    sync();
    muteBtn.addEventListener('click', () => {
      G.sfxOn = !G.sfxOn; Sound.setMuted(!G.sfxOn); persistSave(); sync();
    });
  }

  bindInput();
  Sound.setMuted(!G.sfxOn);
  showScreen('title-screen');
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initGame);
  else initGame();
}


/* ===== src/game/catch.js ===== */
/* ============================================================
   むしとりバトル — catch.js（ほかく＝むしとの かけひき）
   フィールドで「けはい」に たどりついたら enterCatch(sign) が よばれる。
   ちかよる／そっと／まつ／あみ の 4つの 行動で むしを つかまえる。
   おわったら returnToField({caught,key,name,pts,mm,big}) で フィールドへ もどる。
   ※ import/export しない。G/CONFIG/U/BUGS/bugSprite/Sound/showScreen/returnToField は
     ほかの ファイルで さだめずみ（グローバル共有）。
   ============================================================ */

/* むしの ビジュアル さいだいサイズ(px)。アリーナに おさまるよう ひかえめ */
var CS_BUG_PX_MIN = 64;
var CS_BUG_PX_MAX = 118;

/* ほかくシーンに はいる。sign = {tx,ty,key,...} */
function enterCatch(sign) {
  var key = sign.key;
  var bug = BUGS[key];
  if (!bug) { returnToField(null); return; } // ねんのため

  // 個体差(0.85〜1.35) と 夜ボーナス で サイズと でかむし判定
  // ⑦(任意・軽) でかい!! を レア度と そうかん: レア(w 小)ほど 大物が でやすい
  var w = bug.w || 3;
  var rareBoost = w === 1 ? 0.10 : w === 2 ? 0.05 : 0; // やり過ぎない
  var sizeF = 0.85 + U.rnd() * 0.5 + rareBoost;
  sizeF = U.clamp(sizeF, 0.85, 1.45);
  var big = sizeF >= 1.25;
  var mm = Math.round(bug.sizeBase * sizeF * (G.night ? 1.06 : 1));

  // ほかく中の じょうたい
  G.cs = {
    key: key,
    name: bug.name,
    dist: CONFIG.START_DIST, // きょり(m)
    alert: bug.alertBase || 0, // けいかい度 0〜100
    sizeF: sizeF,
    big: big,
    mm: mm,
    pts: bug.pts * (big ? 2 : 1),
    over: false, // けっちゃくが ついたか
    busy: false, // えんしゅつ中（ボタン れんだ ふせぎ）
    busyAnim: false, // 吸い込み／逃走の アニメ中（right を いじらない）
    warned: false, // 「にげそう!」予告ずみか
    graced: false, // 予告の 1かい ゆうよを つかったか
  };

  G.player.busy = true;
  buildCatchUI();
  csLog('🌿 ガサッ…! <b>' + bug.name + '</b>を みつけた！（' + CONFIG.START_DIST + 'm さき・およそ ' + mm + 'mm）');
  Sound.sfx.select();
  showScreen('catch-screen');

  // combo>=2 なら もりあげる（G.combo は core が かんり・ここでは よむだけ）
  var combo = (typeof G !== 'undefined' && G && typeof G.combo === 'number') ? G.combo : 0;
  if (combo >= 2) {
    csLog('🔥 コンボ ×' + combo + ' つづいてる！ この いきおいで いこう！');
  }

  // でかむしは とうじょうで ひとこえ
  if (big) {
    Sound.sfx.warn();
    csLog('✨ うわっ、<b>でかい!!</b> ' + mm + 'mm の おおもの だ！');
  }
  csRender();
}

/* #catch-root に UIを くみたてる */
function buildCatchUI() {
  var root = document.getElementById('catch-root');
  if (!root) return;
  var cs = G.cs;
  var bugPx = csBugPx();
  root.innerHTML =
    '<div class="cs-top">' +
      '<span class="cs-dist" id="cs-dist">あと ' + cs.dist + 'm</span>' +
      '<span class="cs-name" id="cs-name">' + cs.name + (cs.big ? ' ★' : '') + '</span>' +
    '</div>' +
    '<div class="cs-alert-wrap">' +
      '<div class="cs-alert-label">' +
        '<span>けいかい <span class="cs-alert-state" id="cs-alert-state">よゆう😺</span></span>' +
        '<span id="cs-alert-num">0%</span>' +
      '</div>' +
      '<div class="cs-alert-bar"><div class="cs-alert-fill" id="cs-alert-fill"></div></div>' +
    '</div>' +
    '<div class="cs-arena" id="cs-arena">' +
      '<div class="cs-bug" id="cs-bug">' + bugSprite(cs.key, bugPx) + '</div>' +
      '<div class="cs-hunter" id="cs-hunter">🥅</div>' +
    '</div>' +
    '<div class="cs-log" id="cs-log"></div>' +
    '<div class="cs-actions">' +
      '<button class="cs-btn approach" id="cs-approach">ちかよる<small>2m すすむ・ばれやすい</small></button>' +
      '<button class="cs-btn sneak" id="cs-sneak">そっと<small>1m すすむ・しずか</small></button>' +
      '<button class="cs-btn wait" id="cs-wait">まつ<small>けいかいを さげる</small></button>' +
      '<button class="cs-btn net" id="cs-net"><span class="cs-net-main">あみを ふる！</span><small id="cs-net-acc"></small></button>' +
    '</div>';

  document.getElementById('cs-approach').onclick = function () { csAct('approach'); };
  document.getElementById('cs-sneak').onclick = function () { csAct('sneak'); };
