  document.getElementById('cs-net').onclick = function () { csSwing(); };
}

/* むしの 見た目サイズ(px)。個体差で すこし おおきく */
function csBugPx() {
  var f = U.clamp(G.cs.sizeF, 0.85, 1.45);
  return Math.round(CS_BUG_PX_MIN + (CS_BUG_PX_MAX - CS_BUG_PX_MIN) * ((f - 0.85) / 0.5));
}

/* ログ欄に じっきょうを だす */
function csLog(html) {
  var el = document.getElementById('cs-log');
  if (el) el.innerHTML = html;
}

/* きょり(m) → あみの 実効 命中りつ(0〜1) */
function csHitRate() {
  var d = U.clamp(Math.round(G.cs.dist), 0, 2);
  var base = CONFIG.NET_HIT[d] != null ? CONFIG.NET_HIT[d] : 0.3;
  // 近接ボーナス: 0mで +0.12 / 1mで +0.06 / 2mで +0
  var bonus = (2 - d) * 0.06;
  return U.clamp(base + bonus, 0.05, 0.97);
}

/* 命中りつ → めやす記号 ◎/○/△ と クラス名 */
function csHitMark(rate) {
  if (rate >= 0.75) return { mark: '◎', cls: 'good', word: 'ねらいめ！' };
  if (rate >= 0.55) return { mark: '○', cls: 'ok', word: 'いけそう' };
  return { mark: '△', cls: 'bad', word: 'むずかしい' };
}

/* 画面（きょり・ゲージ・ボタン・むし位置）を かきなおす */
function csRender() {
  var cs = G.cs;
  if (!cs) return;
  var a = Math.round(cs.alert);
  var aClamp = Math.min(100, Math.max(0, a));
  var rate = csHitRate();
  var hm = csHitMark(rate);
  var round0 = Math.round(cs.dist) <= 0; // 0m（ちかすぎ）

  // きょりバッジ: めやす記号を 色つきで そえる（数値%も いきる）
  var dist = document.getElementById('cs-dist');
  if (dist) {
    var distTxt = cs.dist <= 1 ? '🎯 とどく！' : 'あと ' + cs.dist + 'm';
    if (round0) distTxt = '⚠️ ちかすぎ！';
    dist.innerHTML = distTxt + ' <span class="cs-mark ' + hm.cls + '">' + hm.mark + '</span>';
    dist.classList.remove('mk-good', 'mk-ok', 'mk-bad');
    dist.classList.add('mk-' + hm.cls);
  }

  var fill = document.getElementById('cs-alert-fill');
  if (fill) {
    fill.style.width = aClamp + '%';
    fill.classList.toggle('warn', aClamp >= 70 && aClamp < 90);
    fill.classList.toggle('danger', aClamp >= 90); // ≥90 で 鼓動パルス(CSS)
  }
  var num = document.getElementById('cs-alert-num');
  if (num) num.textContent = aClamp + '%';

  // ⑥ ゲージ脇の じょうたい（色だけに たよらない）
  var stEl = document.getElementById('cs-alert-state');
  if (stEl) {
    var st = csAlertState(aClamp);
    stEl.textContent = st.word + st.emoji;
    stEl.classList.remove('s-calm', 's-care', 's-danger', 's-flee');
    stEl.classList.add(st.cls);
  }

  var arena = document.getElementById('cs-arena');
  if (arena) {
    arena.classList.toggle('warn-glow', aClamp >= 70);
    arena.classList.toggle('danger-glow', aClamp >= 90); // ④ 明滅
  }

  // むしの 横位置: きょりが ちかいほど 左(プレイヤー)へ よる
  var bugEl = document.getElementById('cs-bug');
  if (bugEl) {
    var t = U.clamp(cs.dist / CONFIG.START_DIST, 0, 1); // 0=ちかい 1=とおい
    // えんしゅつ中(吸い込み・逃走)は right を いじらない
    if (!cs.over && !cs.busyAnim) bugEl.style.right = (6 + t * 30) + '%';
    // ② 警戒≥70 で 震える / 解除で 外す
    bugEl.classList.toggle('tremble', aClamp >= 70 && !cs.over);
  }

  // あみ命中りつ ひょうじ（記号＋%）。0mは「ちかすぎ！」を出す
  var accEl = document.getElementById('cs-net-acc');
  if (accEl) {
    if (round0) {
      accEl.innerHTML = '<span class="cs-mark ' + hm.cls + '">' + hm.mark + '</span> ちかすぎ！ てづかみは むずかしい';
    } else {
      accEl.innerHTML = '<span class="cs-mark ' + hm.cls + '">' + hm.mark + '</span> めいちゅう やく ' + Math.round(rate * 100) + '%';
    }
  }
  var netBtn = document.getElementById('cs-net');
  if (netBtn) {
    netBtn.classList.remove('acc-good', 'acc-ok', 'acc-bad');
    netBtn.classList.add('acc-' + hm.cls);
    // ⑤ 予告(warn)中は 網ボタンを 強調パルス
    netBtn.classList.toggle('urge', cs.warned && !cs.over);
  }

  // ⑤ 予告中の さそい「いま あみ！」
  csUpdateWarnPop(cs.warned && !cs.over && aClamp >= CONFIG.ALERT_WARN);

  // ボタン ゆうこう／むこう
  csSetButtons(!cs.busy && !cs.over);
}

/* ⑥ けいかい度 → じょうたい（絵文字＋ことば＋クラス） */
function csAlertState(a) {
  if (a < 40) return { word: 'よゆう', emoji: '😺', cls: 's-calm' };
  if (a < 70) return { word: 'ちゅうい', emoji: '😼', cls: 's-care' };
  if (a < 90) return { word: 'あぶない', emoji: '🙀', cls: 's-danger' };
  return { word: 'にげる！', emoji: '😾', cls: 's-flee' };
}

/* ⑤ 「いま あみ！」さそいポップの 出し入れ（常設・点滅はCSS） */
function csUpdateWarnPop(show) {
  var arena = document.getElementById('cs-arena');
  if (!arena) return;
  var pop = arena.querySelector('.cs-warn-now');
  if (show) {
    if (!pop) {
      pop = document.createElement('div');
      pop.className = 'cs-warn-now';
      pop.textContent = 'いま あみ！';
      arena.appendChild(pop);
    }
  } else if (pop) {
    pop.remove();
  }
}

/* ぜんボタンの ゆうこう／むこうを いっかつ きりかえ */
function csSetButtons(enabled) {
  var cs = G.cs;
  var ids = ['cs-approach', 'cs-sneak', 'cs-wait', 'cs-net'];
  ids.forEach(function (id) {
    var b = document.getElementById(id);
    if (!b) return;
    b.disabled = !enabled;
  });
  if (enabled) {
    // きょり0mでは これ以上 すすめない
    var ap = document.getElementById('cs-approach');
    var sn = document.getElementById('cs-sneak');
    if (cs.dist <= 0) { if (ap) ap.disabled = true; if (sn) sn.disabled = true; }
  }
}

/* 行動: approach / sneak / wait */
function csAct(mode) {
  var cs = G.cs;
  if (!cs || cs.over || cs.busy) return;
  cs.busy = true;
  csSetButtons(false);
  Sound.sfx.select();

  if (mode === 'wait') {
    // まつ: 30%-0.5 / 30%-1 / 20%±0 / 20%+1.5（×10して けいかい度に）
    var r = U.rnd();
    var dA = r < 0.3 ? -5 : r < 0.6 ? -10 : r < 0.8 ? 0 : 15;
    cs.alert = U.clamp(cs.alert + dA, 0, 200);
    csLog(dA < 0 ? '🤫 いきを ひそめて まった…（けいかい ' + dA + '）'
        : dA === 0 ? '🤫 いきを ひそめて まった…（へんか なし）'
        : '😨 もぞもぞ して かえって あやしまれた！（けいかい +' + dA + '）');
  } else {
    var stepM = mode === 'approach' ? 2 : 1;
    var dBefore = cs.dist;
    cs.dist = Math.max(0, cs.dist - stepM);
    // けいかい上昇: ちかよる大 / そっと小
    var gain = mode === 'approach' ? (16 + U.rnd() * 14) : (6 + U.rnd() * 8);
    // 距離係数: とおい8m×0.6 → ちかい0m×1.0（ちかいほど ばれやすい）
    var distF = 0.6 + 0.4 * (CONFIG.START_DIST - dBefore) / CONFIG.START_DIST;
    gain *= distF;
    if (G.night) gain *= 0.9; // よるの むしは ねぼけぎみ
    cs.alert = U.clamp(cs.alert + gain, 0, 200);
    csLog((mode === 'approach' ? '🚶 ' : '🐢 そっと ')
      + cs.dist + 'm まで ちかづいた！');
  }

  csRender();
  // すこし えんしゅつ → けっか判定
  setTimeout(function () { csResolveMove(mode); }, mode === 'approach' ? 520 : 600);
}

/* 行動の あとの にげる／予告 判定（まつ・接近 きょうつう） */
function csResolveMove(mode) {
  var cs = G.cs;
  if (!cs || cs.over) return;

  // けいかい100いじょう → そくにげ
  if (cs.alert >= CONFIG.ALERT_FLEE) {
    csFlee('💨 きづかれた！ ' + cs.name + 'は にげてしまった…');
    return;
  }

  // けいかい70いじょう → 予告（1かいの ゆうよ） → 以後 まつ いがいで 逃走チェック
  if (cs.alert >= CONFIG.ALERT_WARN) {
    if (!cs.warned) {
      cs.warned = true;
      cs.graced = true; // この1てで にげない（ゆうよ）
      Sound.sfx.warn();
      var pop = document.getElementById('cs-arena');
      if (pop) csShowWarnPop();
      csLog('⚠️ ' + cs.name + 'が こちらを みている… <b>にげそう だ！</b>');
      cs.busy = false;
      csRender();
      return;
    }
    if (mode !== 'wait') {
      if (U.chance(CONFIG.WARN_FLEE_P)) {
        csFlee('💨 ' + cs.name + 'は きけんを かんじて にげてしまった！');
        return;
      }
    }
  }

  // けいかいが さがれば 予告かいじょ
  if (cs.warned && cs.alert < CONFIG.ALERT_WARN - 15) {
    cs.warned = false;
    csLog('😮‍💨 ' + cs.name + 'は すこし おちついたようだ…');
  }

  cs.busy = false;
  csRender();
}

/* 「にげそう!」ポップを アリーナに 1かい だす */
function csShowWarnPop() {
  var arena = document.getElementById('cs-arena');
  if (!arena) return;
  var old = arena.querySelector('.cs-warn-pop');
  if (old) old.remove();
  var pop = document.createElement('div');
  pop.className = 'cs-warn-pop';
  pop.textContent = 'にげそう！';
  arena.appendChild(pop);
  setTimeout(function () { if (pop.parentNode) pop.remove(); }, 900);
}

/* クラスを つけて 一定時間後に はずす（アニメ完了まち・例外で落ちない） */
function csClassFor(el, cls, ms) {
  if (!el) return;
  el.classList.add(cls);
  setTimeout(function () { if (el && el.classList) el.classList.remove(cls); }, ms || 600);
}

/* ① 白フラッシュを アリーナに 一瞬 だす */
function csFlash() {
  var arena = document.getElementById('cs-arena');
  if (!arena) return;
  var fx = document.createElement('div');
  fx.className = 'cs-flash';
  arena.appendChild(fx);
  setTimeout(function () { if (fx.parentNode) fx.remove(); }, 360);
}

/* ① big のキラキラ */
function csSparkle() {
  var arena = document.getElementById('cs-arena');
  if (!arena) return;
  var box = document.createElement('div');
  box.className = 'cs-sparkle';
  box.innerHTML = '<span>✨</span><span>⭐</span><span>✨</span><span>🌟</span><span>✨</span>';
  arena.appendChild(box);
  setTimeout(function () { if (box.parentNode) box.remove(); }, 900);
}

/* 逃走の 土ぼこり */
function csDust() {
  var arena = document.getElementById('cs-arena');
  if (!arena) return;
  var d = document.createElement('div');
  d.className = 'cs-dust';
  d.textContent = '💨';
  arena.appendChild(d);
  setTimeout(function () { if (d.parentNode) d.remove(); }, 700);
}

/* あみを ふる */
function csSwing() {
  var cs = G.cs;
  if (!cs || cs.over || cs.busy) return;
  cs.busy = true;
  csSetButtons(false);
  Sound.sfx.select();

  var rate = csHitRate();
  csLog('🥅 えいっ！ あみを ふった！');

  // ① 網スイングアニメ（虫へ ふる）
  csClassFor(document.getElementById('cs-hunter'), 'swing', 460);

  setTimeout(function () {
    if (!cs || cs.over) return;
    if (U.chance(rate)) {
      // めいちゅう → ほかく せいこう
      cs.over = true;
      cs.busyAnim = true;
      Sound.sfx.catch();
      // ① 白フラッシュ＋虫が 網へ 吸い込まれ消える
      csFlash();
      var bugEl = document.getElementById('cs-bug');
      if (bugEl) { bugEl.classList.add('caught-suck'); }
      if (cs.big) { Sound.sfx.big(); csSparkle(); } // big は キラキラ追加・音
      csLog('🎉 やったー！ <b>' + cs.name + '</b>（' + cs.mm + 'mm）を つかまえた！ +' + cs.pts + 'てん'
        + (cs.big ? '（でかボーナス ×2！）' : ''));
      csFinish(true);
    } else {
      // はずれ → 虫が 素早く回避＋小ゆれ → けいかい大up
      Sound.sfx.miss();
      cs.alert = U.clamp(cs.alert + 35, 0, 200);
      var bugEl2 = document.getElementById('cs-bug');
      csClassFor(bugEl2, 'dodge', 360); // ① 素早い回避＋小ゆれ
      csRender();
      if (cs.alert >= CONFIG.ALERT_FLEE) {
        csLog('😖 はずした…！ ' + cs.name + 'が おどろいた！');
        setTimeout(function () { csFlee('💨 ' + cs.name + 'は にげてしまった！'); }, 600);
        return;
      }
      if (cs.alert >= CONFIG.ALERT_WARN && !cs.warned) {
        cs.warned = true; cs.graced = true;
        Sound.sfx.warn();
        csShowWarnPop();
      }
      csLog('😖 はずした！ ' + cs.name + 'が けいかい している…');
      cs.busy = false;
      csRender();
    }
  }, 460);
}

/* にげられた */
function csFlee(msg) {
  var cs = G.cs;
  if (!cs || cs.over) { /* over=trueでも 演出ずみなら そのまま */ }
  if (cs) { cs.over = true; cs.busyAnim = true; }
  Sound.sfx.flee();
  var bugEl = document.getElementById('cs-bug');
  if (bugEl) {
    bugEl.classList.remove('tremble');
    bugEl.classList.add('flee-dash'); // ① 画面外へ ダッシュ（CSS）
  }
  csDust(); // ① 土ぼこり
  csUpdateWarnPop(false);
  csLog(msg);
  csSetButtons(false);
  csFinish(false);
}

/* けっちゃく → フィールドへ もどる */
function csFinish(caught) {
  var cs = G.cs;
  var result = caught
    ? { caught: true, key: cs.key, name: cs.name, pts: cs.pts, mm: cs.mm, big: cs.big }
    : { caught: false, key: cs.key, name: cs.name, pts: 0, mm: cs.mm, big: cs.big };
  // みじかい えんしゅつの あと もどる
  setTimeout(function () { returnToField(result); }, caught ? 1100 : 1000);
}


/* ===== src/render/tiles.js ===== */
/* ============================================================
   むしとりバトル — render/tiles.js
   SNES風（ドラクエ6／クロノ・トリガー級）の立体的タイル描画プリミティブ。
   ここは「じゅんすいな えがく かんすう」だけ。ゲームの じょうたいには さわらない。

   ★ つかいかた（だいじ）
     - すべて スクリーンざひょう（カメラてきようは よびだしがわ field-cpu）で うけとる。
     - ctx=2D / ts=タイルpx / seed=せいすう（おなじ みためを かためる）/ time=ms（みず・くさの うごき）。
     - れいがいを なげない（はんいがいでも あんぜん）。document を トップレベルで さわらない。

   ★ transition の base しよう（ここに めいき）
     - base は「りくがわ（みず・どうろ・すなの たかい／ちがう がわ）」の タイルに かさねる。
       つまり mask.n=true は「きたの となりが ちがう／ひくい ちめん（みず など）」をしめす。
       みずべの しろい なみ・すなの きしは、base=land がわの ふちに そって えがく。
     - import/export きんし。Tiles は ひとつの グローバル const。
   ============================================================ */

const Tiles = (function () {
  'use strict';

  /* ---- かるい seed らんすう（document も Math.random も つかわず かためる） ---- */
  // 32bit せいすうから 0..1 を かえす。seed と salt で ばらす。
  function rnd1(seed, salt) {
    let x = (seed | 0) ^ ((salt | 0) * 0x9e3779b9);
    x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
    x = x >>> 0;
    return x / 4294967296;
  }
  // a..b の せいすう（seed・salt で かためる）
  function rndRange(seed, salt, a, b) {
    return a + Math.floor(rnd1(seed, salt) * (b - a + 1));
  }
  // クランプ
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ---- いろの ヘルパ（rgb / rgba もじれつ） ---- */
  function rgb(r, g, b) { return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')'; }
  function rgba(r, g, b, a) { return 'rgba(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ',' + a + ')'; }

  /* ============================================================
     じめん ground
     ============================================================ */
  function ground(ctx, sx, sy, ts, kind, seed, time, night) {
    try {
      seed = seed | 0;
      time = time || 0;
      if (kind === 'water') { drawWater(ctx, sx, sy, ts, seed, time); }
      else if (kind === 'path') { drawSoil(ctx, sx, sy, ts, seed, false); }
      else if (kind === 'gravel') { drawSoil(ctx, sx, sy, ts, seed, true); }
      else { drawGrass(ctx, sx, sy, ts, seed); }
      // よる は うっすら あおく しずめる（ぜんたいの nightOverlay とは べつに、てもとを しめる）
      if (night) {
        ctx.fillStyle = rgba(20, 30, 70, 0.18);
        ctx.fillRect(sx, sy, ts, ts);
      }
    } catch (e) { /* むし */ }
  }

  // くさ：2〜3しょくの しぜんな のうたん＋まばらな くさの てんびょう
  function drawGrass(ctx, sx, sy, ts, seed) {
    // ベースいろ（タイルごとに ほんの すこし ゆらす→チェッカーに ならない）
    const v = rnd1(seed, 11);
    const base = 118 + Math.floor(v * 16); // 118..134
    ctx.fillStyle = rgb(74, base, 56);
    ctx.fillRect(sx, sy, ts, ts);

    // のうたんの まだら（やわらかい パッチを 2〜3こ）
    const patches = 2 + (seed & 1);
    for (let i = 0; i < patches; i++) {
      const px = sx + rnd1(seed, 20 + i) * ts;
      const py = sy + rnd1(seed, 30 + i) * ts;
      const pr = ts * (0.20 + rnd1(seed, 40 + i) * 0.22);
      const lighter = rnd1(seed, 50 + i) > 0.5;
      ctx.fillStyle = lighter ? rgba(150, 196, 96, 0.30) : rgba(52, 104, 44, 0.28);
      ctx.beginPath();
      ctx.ellipse(px, py, pr, pr * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // くさの てんびょう（ちいさな たての ひっかき。seed で いちを かためる）
    const blades = 5 + (seed % 4);
    ctx.lineWidth = Math.max(1, ts * 0.03);
    for (let i = 0; i < blades; i++) {
      const bx = sx + rnd1(seed, 100 + i) * ts;
      const by = sy + (0.35 + rnd1(seed, 110 + i) * 0.6) * ts;
      const h = ts * (0.12 + rnd1(seed, 120 + i) * 0.10);
      const tone = rnd1(seed, 130 + i);
      ctx.strokeStyle = tone > 0.5 ? rgba(60, 120, 50, 0.55) : rgba(170, 210, 110, 0.55);
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + (tone - 0.5) * ts * 0.12, by - h);
      ctx.stroke();
    }
  }

  // つち（path）／じゃり（gravel）：つぶ感
  function drawSoil(ctx, sx, sy, ts, seed, gravel) {
    // ベース：つちは あたたかい ちゃ、じゃりは あかるい グレーちゃ
    if (gravel) ctx.fillStyle = rgb(176, 166, 146);
    else ctx.fillStyle = rgb(170, 132, 86);
    ctx.fillRect(sx, sy, ts, ts);

    // すこし のうたんを ふって のっぺり させない
    ctx.fillStyle = gravel ? rgba(120, 112, 96, 0.22) : rgba(120, 86, 50, 0.22);
    const blob = 2 + (seed & 1);
    for (let i = 0; i < blob; i++) {
      const px = sx + rnd1(seed, 200 + i) * ts;
      const py = sy + rnd1(seed, 210 + i) * ts;
      const pr = ts * (0.18 + rnd1(seed, 220 + i) * 0.2);
      ctx.beginPath();
      ctx.ellipse(px, py, pr, pr * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // つぶ（じゃりは おおめ＆こいし、つちは ちいさな てん）
    const grains = gravel ? 9 + (seed % 5) : 6 + (seed % 4);
    for (let i = 0; i < grains; i++) {
      const gx = sx + rnd1(seed, 300 + i) * ts;
      const gy = sy + rnd1(seed, 310 + i) * ts;
      const gr = gravel
        ? ts * (0.05 + rnd1(seed, 320 + i) * 0.07)
        : ts * (0.02 + rnd1(seed, 320 + i) * 0.03);
      const light = rnd1(seed, 330 + i) > 0.5;
      if (gravel) {
        // こいし：あかるい面＋した影で すこし たちあがって みえる
        ctx.fillStyle = rgba(0, 0, 0, 0.18);
        ctx.beginPath();
        ctx.ellipse(gx, gy + gr * 0.5, gr, gr * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = light ? rgb(208, 200, 184) : rgb(150, 142, 126);
        ctx.beginPath();
        ctx.ellipse(gx, gy, gr, gr * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = light ? rgba(200, 160, 110, 0.5) : rgba(110, 78, 44, 0.5);
        ctx.beginPath();
        ctx.arc(gx, gy, gr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // みず：time で よこに ながれる さざなみ／はんしゃ
  function drawWater(ctx, sx, sy, ts, seed, time) {
    // ふかい あお → あさい あお の たてグラデで おくゆき
    let g;
    try { g = ctx.createLinearGradient(sx, sy, sx, sy + ts); }
    catch (e) { g = null; }
    if (g) {
      g.addColorStop(0, rgb(46, 110, 176));
      g.addColorStop(1, rgb(30, 84, 150));
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = rgb(40, 100, 168);
    }
    ctx.fillRect(sx, sy, ts, ts);

    // さざなみ：time で よこに ながす しろい よこせん（2〜3ぽん）
    const t = time * 0.001;
    ctx.lineWidth = Math.max(1, ts * 0.04);
    for (let i = 0; i < 3; i++) {
      const baseY = sy + ts * (0.25 + i * 0.27);
      const phase = t * (0.6 + i * 0.18) + rnd1(seed, 400 + i) * 6.28;
      const amp = ts * 0.05;
      const off = Math.sin(phase) * amp;
      ctx.strokeStyle = rgba(220, 240, 255, 0.16 + 0.06 * i);
      ctx.beginPath();
      for (let k = 0; k <= 4; k++) {
        const x = sx + (k / 4) * ts;
        const y = baseY + Math.sin(phase + k * 1.1) * amp + off * 0.2;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // きらめき：うごく ちいさな ハイライト てん
    const spark = 2;
    for (let i = 0; i < spark; i++) {
      const sxp = sx + ((rnd1(seed, 500 + i) + t * 0.08) % 1) * ts;
      const syp = sy + rnd1(seed, 510 + i) * ts;
      const a = 0.25 + 0.25 * (0.5 + 0.5 * Math.sin(t * 2 + i));
      ctx.fillStyle = rgba(255, 255, 255, a * 0.6);
      ctx.beginPath();
      ctx.arc(sxp, syp, ts * 0.04, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ============================================================
     さかいめ transition（base=land がわの ふちに かさねる）
     ============================================================ */
  function transition(ctx, sx, sy, ts, base, mask, time) {
    try {
      mask = mask || {};
      time = time || 0;
      const isWater = (base === 'water'); // base=water のときは みずがわの ふち（あわ）
      // しろい なみ／すなの きしの いろ
      const edge = isWater ? rgba(220, 240, 255, 0.55) : rgba(236, 222, 178, 0.85);
      const edge2 = isWater ? rgba(180, 220, 250, 0.40) : rgba(208, 188, 140, 0.6);
      const w = Math.max(2, ts * 0.16); // ふちの はば
      const t = time * 0.001;

      // たて・よこの へり（なみ うち。time で ほんのり うねる）
      // きた
      if (mask.n) edgeStrip(ctx, sx, sy, ts, w, 'n', edge, edge2, t, isWater);
      if (mask.s) edgeStrip(ctx, sx, sy, ts, w, 's', edge, edge2, t, isWater);
      if (mask.w) edgeStrip(ctx, sx, sy, ts, w, 'w', edge, edge2, t, isWater);
      if (mask.e) edgeStrip(ctx, sx, sy, ts, w, 'e', edge, edge2, t, isWater);

      // かど（そとがわの かどを まるめる）。となりが りょうほう ちがう ときだけ。
      cornerArc(ctx, sx, sy, ts, w, 'nw', mask, edge);
      cornerArc(ctx, sx, sy, ts, w, 'ne', mask, edge);
      cornerArc(ctx, sx, sy, ts, w, 'sw', mask, edge);
      cornerArc(ctx, sx, sy, ts, w, 'se', mask, edge);
    } catch (e) { /* むし */ }
  }

  function edgeStrip(ctx, sx, sy, ts, w, side, edge, edge2, t, wavy) {
    ctx.fillStyle = edge;
    // よこ（n/s）か たて（w/e）か
    if (side === 'n' || side === 's') {
      const y0 = side === 'n' ? sy : sy + ts - w;
      // なみ うち：うえべりは すこし でこぼこ
      ctx.beginPath();
      ctx.moveTo(sx, y0);
      const seg = 4;
      for (let k = 0; k <= seg; k++) {
        const x = sx + (k / seg) * ts;
        const wob = wavy ? Math.sin(t * 1.4 + k * 1.3 + (side === 'n' ? 0 : 3)) * w * 0.35 : 0;
        const yy = side === 'n' ? y0 + w + wob : y0 - wob;
        ctx.lineTo(x, yy);
      }
      ctx.lineTo(sx + ts, y0);
      ctx.closePath();
      ctx.fill();
      // うちがわの うすい おび
      ctx.fillStyle = edge2;
      const yb = side === 'n' ? sy + w : sy + ts - w * 1.6;
      ctx.fillRect(sx, yb, ts, w * 0.6);
    } else {
      const x0 = side === 'w' ? sx : sx + ts - w;
      ctx.beginPath();
      ctx.moveTo(x0, sy);
      const seg = 4;
      for (let k = 0; k <= seg; k++) {
        const y = sy + (k / seg) * ts;
        const wob = wavy ? Math.sin(t * 1.4 + k * 1.3 + (side === 'w' ? 1 : 4)) * w * 0.35 : 0;
        const xx = side === 'w' ? x0 + w + wob : x0 - wob;
        ctx.lineTo(xx, y);
      }
      ctx.lineTo(x0, sy + ts);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = edge2;
      const xb = side === 'w' ? sx + w : sx + ts - w * 1.6;
      ctx.fillRect(xb, sy, w * 0.6, ts);
    }
  }

  function cornerArc(ctx, sx, sy, ts, w, corner, mask, edge) {
    // そとがわの かどに ちいさな しかくっぽい あわ／すなを おく
    let ax, ay, need;
    if (corner === 'nw') { ax = sx; ay = sy; need = mask.nw || (mask.n && mask.w); }
    else if (corner === 'ne') { ax = sx + ts; ay = sy; need = mask.ne || (mask.n && mask.e); }
    else if (corner === 'sw') { ax = sx; ay = sy + ts; need = mask.sw || (mask.s && mask.w); }
    else { ax = sx + ts; ay = sy + ts; need = mask.se || (mask.s && mask.e); }
    if (!need) return;
    ctx.fillStyle = edge;
    ctx.beginPath();
    ctx.arc(ax, ay, w * 0.9, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ============================================================
     がけ cliff（みなみむきの すいちょくな めん＋ねもとの 影）
     ============================================================ */
  function cliff(ctx, sx, sy, ts, opts) {
    try {
      opts = opts || {};
      const faceH = Math.max(0, (typeof opts.faceH === 'number' ? opts.faceH : 0.6)) * ts;
      const capTop = opts.capTop !== false;
      const showShadow = opts.shadow !== false;
      const seed = opts.seed | 0;
      const night = !!opts.night;

      // ねもとの おち影（がけの したに よこながの 影→たかさを かんじる）
      if (showShadow && faceH > 0) {
        ctx.fillStyle = rgba(0, 0, 0, 0.28);
        ctx.beginPath();
        ctx.ellipse(sx + ts * 0.5, sy + ts + faceH, ts * 0.6, ts * 0.16, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // みなみむきの すいちょく めん（いわはだ。たてグラデで まるみ）
      if (faceH > 0) {
        let g;
        try { g = ctx.createLinearGradient(sx, sy + ts, sx, sy + ts + faceH); }
        catch (e) { g = null; }
        if (g) {
          g.addColorStop(0, rgb(150, 130, 104));
          g.addColorStop(1, rgb(96, 80, 62));
          ctx.fillStyle = g;
        } else {
          ctx.fillStyle = rgb(120, 102, 80);
        }
        ctx.fillRect(sx, sy + ts, ts, faceH);

        // ごつごつ：たての ひびと よこの だんさ（seed で かためる）
        ctx.strokeStyle = rgba(60, 48, 36, 0.5);
        ctx.lineWidth = Math.max(1, ts * 0.035);
        const cracks = 2 + (seed & 1);
        for (let i = 0; i < cracks; i++) {
          const cx = sx + rnd1(seed, 600 + i) * ts;
          ctx.beginPath();
          ctx.moveTo(cx, sy + ts);
          ctx.lineTo(cx + (rnd1(seed, 610 + i) - 0.5) * ts * 0.2, sy + ts + faceH);
          ctx.stroke();
        }
        // ひだりに ハイライト・みぎに 影で たちたいかんを だす
        ctx.fillStyle = rgba(255, 240, 210, 0.12);
        ctx.fillRect(sx, sy + ts, ts * 0.12, faceH);
        ctx.fillStyle = rgba(0, 0, 0, 0.18);
        ctx.fillRect(sx + ts * 0.86, sy + ts, ts * 0.14, faceH);
      }

      // うわめん（てんば）：いわ天端＋ふちの くさ
      if (capTop) {
        // いわの 天端
        ctx.fillStyle = rgb(176, 158, 130);
        ctx.fillRect(sx, sy, ts, ts);
        // でこぼこの まだら
        ctx.fillStyle = rgba(130, 112, 88, 0.4);
        for (let i = 0; i < 3; i++) {
          const px = sx + rnd1(seed, 700 + i) * ts;
          const py = sy + rnd1(seed, 710 + i) * ts;
          ctx.beginPath();
          ctx.ellipse(px, py, ts * 0.16, ts * 0.1, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        // うわべりの くさ（みどりの でっぱり→たかさの きわだち）
        ctx.fillStyle = rgb(86, 140, 64);
        ctx.beginPath();
        ctx.moveTo(sx, sy + ts);
        const seg = 6;
        for (let k = 0; k <= seg; k++) {
          const x = sx + (k / seg) * ts;
          const wob = (rnd1(seed, 720 + k) - 0.5) * ts * 0.12;
          ctx.lineTo(x, sy + ts - ts * 0.12 + wob);
        }
        ctx.lineTo(sx + ts, sy + ts);
        ctx.closePath();
        ctx.fill();
      }

      if (night) {
        ctx.fillStyle = rgba(20, 30, 70, 0.22);
        ctx.fillRect(sx, sy, ts, ts + faceH);
      }
    } catch (e) { /* むし */ }
  }

  /* ============================================================
     き tree（じゅかんが タイルより うえに たちあがる）
     ============================================================ */
  function tree(ctx, sx, sy, ts, variant, time, night) {
    try {
      variant = variant | 0;
      time = time || 0;
      const cx = sx + ts * 0.5;
      const groundY = sy + ts * 0.92; // ねもと（せっち点）
      const sway = Math.sin(time * 0.0012 + variant) * ts * 0.04; // ゆれ

      // ねもとの だ円の おち影
      shadow(ctx, cx, groundY, ts * 0.42, ts * 0.16);

      const kind = variant % 3; // 0=ひろば(広葉) 1=しんよう(針葉) 2=まるい おおき
      const scale = 0.9 + (variant % 2) * 0.25;

      // みき
      const trunkW = ts * 0.16 * scale;
      const trunkH = ts * 0.55 * scale;
      ctx.fillStyle = rgb(110, 78, 48);
      ctx.fillRect(cx - trunkW / 2, groundY - trunkH, trunkW, trunkH);
      // みきの ハイライト
      ctx.fillStyle = rgba(150, 110, 70, 0.6);
      ctx.fillRect(cx - trunkW / 2, groundY - trunkH, trunkW * 0.35, trunkH);

      const crownBaseY = groundY - trunkH;
      if (kind === 1) {
        // しんようじゅ：さんかくの だん（3だん）
        const top = crownBaseY - ts * 1.05 * scale;
        const colD = rgb(34, 92, 52), colL = rgb(60, 130, 74);
        for (let i = 0; i < 3; i++) {
          const ly = crownBaseY - i * ts * 0.42 * scale;
          const lw = ts * (0.62 - i * 0.13) * scale;
          ctx.fillStyle = i % 2 ? colL : colD;
          ctx.beginPath();
          ctx.moveTo(cx + sway * (i + 1) * 0.4, ly - ts * 0.55 * scale);
          ctx.lineTo(cx - lw, ly);
          ctx.lineTo(cx + lw, ly);
          ctx.closePath();
          ctx.fill();
        }
        // てっぺん
        void top;
      } else {
        // ひろようじゅ／まるき：まるい じゅかん（かさねた だ円で もこもこ）
        const big = kind === 2;
        const cyC = crownBaseY - ts * (big ? 0.62 : 0.5) * scale;
        const rw = ts * (big ? 0.62 : 0.5) * scale;
        const rh = ts * (big ? 0.62 : 0.52) * scale;
        const colD = rgb(40, 104, 54), colM = rgb(58, 134, 70), colL = rgb(96, 170, 96);
        // した影がわ
        ctx.fillStyle = colD;
        ctx.beginPath();
        ctx.ellipse(cx + sway, cyC + rh * 0.2, rw, rh, 0, 0, Math.PI * 2);
        ctx.fill();
        // もこもこ（3つの かたまり）
        const blobs = [[-0.4, 0.05, 0.62], [0.4, 0.05, 0.62], [0, -0.35, 0.7]];
        for (let i = 0; i < blobs.length; i++) {
          const b = blobs[i];
          ctx.fillStyle = colM;
          ctx.beginPath();
          ctx.ellipse(cx + sway + b[0] * rw, cyC + b[1] * rh, rw * b[2], rh * b[2], 0, 0, Math.PI * 2);
          ctx.fill();
        }
        // ひかりの あたる うえの ハイライト
        ctx.fillStyle = colL;
        ctx.beginPath();
        ctx.ellipse(cx + sway - rw * 0.25, cyC - rh * 0.4, rw * 0.4, rh * 0.32, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      if (night) {
        ctx.fillStyle = rgba(20, 30, 70, 0.22);
        ctx.beginPath();
        ctx.ellipse(cx, crownBaseY - ts * 0.4, ts * 0.7, ts * 0.9, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    } catch (e) { /* むし */ }
  }

  /* ============================================================
     そうしょく deco
     ============================================================ */
  function deco(ctx, sx, sy, ts, kind, seed, time) {
    try {
      seed = seed | 0;
      time = time || 0;
      const cx = sx + ts * 0.5;
      const baseY = sy + ts * 0.82;
      if (kind === 'flower') drawFlower(ctx, sx, sy, ts, seed);
      else if (kind === 'tallgrass') drawTallgrass(ctx, cx, baseY, ts, seed, time);
      else if (kind === 'rock') drawRock(ctx, cx, baseY, ts, seed);
      else if (kind === 'log') drawLog(ctx, cx, baseY, ts, seed);
      else if (kind === 'mushroom') drawMushroom(ctx, cx, baseY, ts, seed);
    } catch (e) { /* むし */ }
  }

  // はな：すうしょく。ひらたい そうしょく（地面の すぐあと）
  function drawFlower(ctx, sx, sy, ts, seed) {
    const cols = [
      [255, 120, 150], [255, 210, 90], [180, 140, 240], [255, 255, 255], [120, 190, 255],
    ];
    const n = 3 + (seed % 3);
    for (let i = 0; i < n; i++) {
      const fx = sx + (0.2 + rnd1(seed, 800 + i) * 0.6) * ts;
      const fy = sy + (0.35 + rnd1(seed, 810 + i) * 0.5) * ts;
      const c = cols[rndRange(seed, 820 + i, 0, cols.length - 1)];
      const r = ts * 0.07;
      // くき
      ctx.strokeStyle = rgba(60, 130, 50, 0.8);
      ctx.lineWidth = Math.max(1, ts * 0.025);
      ctx.beginPath();
      ctx.moveTo(fx, fy + r * 1.4);
      ctx.lineTo(fx, fy + r * 3);
      ctx.stroke();
      // はなびら（4まい）
      ctx.fillStyle = rgb(c[0], c[1], c[2]);
      for (let p = 0; p < 4; p++) {
        const a = p * Math.PI / 2;
        ctx.beginPath();
        ctx.ellipse(fx + Math.cos(a) * r, fy + Math.sin(a) * r, r * 0.7, r * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      // ちゅうしん
      ctx.fillStyle = rgb(255, 235, 120);
      ctx.beginPath();
      ctx.arc(fx, fy, r * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // せいたか草：time で そよぐ。すこし たちあがる（影つき）
  function drawTallgrass(ctx, cx, baseY, ts, seed, time) {
    shadow(ctx, cx, baseY, ts * 0.22, ts * 0.08);
    const blades = 5;
    const t = time * 0.001;
    ctx.lineWidth = Math.max(1.5, ts * 0.05);
    for (let i = 0; i < blades; i++) {
      const off = (i - (blades - 1) / 2) * ts * 0.08;
      const bx = cx + off;
      const h = ts * (0.5 + rnd1(seed, 900 + i) * 0.25);
      const sway = Math.sin(t * 1.6 + i * 0.7 + rnd1(seed, 910 + i) * 6.28) * ts * 0.12;
      const tone = rnd1(seed, 920 + i);
      ctx.strokeStyle = tone > 0.5 ? rgb(74, 150, 64) : rgb(54, 120, 50);
      ctx.beginPath();
      ctx.moveTo(bx, baseY);
      ctx.quadraticCurveTo(bx + sway * 0.5, baseY - h * 0.6, bx + sway, baseY - h);
      ctx.stroke();
    }
  }

  // こいし：まるくて した影で たちたい感
  function drawRock(ctx, cx, baseY, ts, seed) {
    shadow(ctx, cx, baseY, ts * 0.24, ts * 0.09);
    const rw = ts * (0.18 + rnd1(seed, 1000) * 0.08);
    const rh = rw * 0.8;
    // ほんたい
    ctx.fillStyle = rgb(150, 146, 138);
    ctx.beginPath();
    ctx.ellipse(cx, baseY - rh * 0.6, rw, rh, 0, 0, Math.PI * 2);
    ctx.fill();
    // うえの ハイライト
    ctx.fillStyle = rgba(210, 208, 200, 0.7);
    ctx.beginPath();
    ctx.ellipse(cx - rw * 0.25, baseY - rh * 0.9, rw * 0.45, rh * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    // した影がわ
    ctx.fillStyle = rgba(90, 88, 84, 0.5);
    ctx.beginPath();
    ctx.ellipse(cx + rw * 0.2, baseY - rh * 0.3, rw * 0.7, rh * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // まるた：よこに ねた き。きりくちの 年輪
  function drawLog(ctx, cx, baseY, ts, seed) {
    shadow(ctx, cx, baseY, ts * 0.36, ts * 0.1);
    const lw = ts * 0.62, lh = ts * 0.28;
    const x0 = cx - lw / 2, y0 = baseY - lh - ts * 0.02;
    // どうたい
    ctx.fillStyle = rgb(140, 96, 58);
    ctx.beginPath();
    ctx.ellipse(cx, y0 + lh / 2, lw / 2, lh / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(120, 82, 50);
    ctx.fillRect(x0, y0, lw, lh);
    ctx.beginPath();
    ctx.ellipse(cx, y0 + lh, lw / 2, lh / 2, 0, 0, Math.PI);
    ctx.fill();
    // きりくち（みぎ）：年輪
    ctx.fillStyle = rgb(196, 156, 110);
    ctx.beginPath();
    ctx.ellipse(x0 + lw, y0 + lh / 2, lw * 0.12, lh / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgba(120, 82, 50, 0.7);
    ctx.lineWidth = Math.max(1, ts * 0.02);
    for (let r = 1; r <= 2; r++) {
      ctx.beginPath();
      ctx.ellipse(x0 + lw, y0 + lh / 2, lw * 0.12 * (r / 3), lh / 2 * (r / 3), 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    void seed;
  }

  // きのこ：あかい かさ＋しろい てん。すこし たちあがる
  function drawMushroom(ctx, cx, baseY, ts, seed) {
    shadow(ctx, cx, baseY, ts * 0.2, ts * 0.07);
    const stemW = ts * 0.1, stemH = ts * 0.26;
    // じく
    ctx.fillStyle = rgb(245, 238, 222);
    ctx.fillRect(cx - stemW / 2, baseY - stemH, stemW, stemH);
    // かさ
    const capW = ts * 0.34, capY = baseY - stemH;
    const hue = rnd1(seed, 1100);
    const cap = hue > 0.5 ? [220, 60, 60] : [230, 150, 60]; // あか or オレンジ
    ctx.fillStyle = rgb(cap[0], cap[1], cap[2]);
    ctx.beginPath();
    ctx.ellipse(cx, capY, capW / 2, capW / 2 * 0.85, 0, Math.PI, 0);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx, capY, capW / 2, capW * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();
    // しろい てん
    ctx.fillStyle = rgba(255, 255, 255, 0.9);
    for (let i = 0; i < 3; i++) {
      const dx = (rnd1(seed, 1110 + i) - 0.5) * capW * 0.7;
      const dy = -rnd1(seed, 1120 + i) * capW * 0.25;
      ctx.beginPath();
      ctx.arc(cx + dx, capY + dy, ts * 0.025, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ============================================================
     おち影 shadow
     ============================================================ */
  function shadow(ctx, cx, cy, rx, ry) {
    try {
      ctx.fillStyle = rgba(0, 0, 0, 0.25);
      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2);
      ctx.fill();
    } catch (e) { /* むし */ }
  }

  /* ============================================================
     キャラ chibi（クロノ/DQ風 2.5とうしん。(cx,cy)=あしもと）
     ============================================================ */
  function chibi(ctx, cx, cy, ts, dir, walkPhase, kind, night) {
    try {
      dir = dir || 'down';
      walkPhase = walkPhase || 0;
      const isCpu = (kind === 'cpu');
      // あしぶみ：walkPhase で うえした バウンド＋あしの ぶれ
      const stride = Math.sin(walkPhase * Math.PI * 2);
      const bounce = Math.abs(Math.sin(walkPhase * Math.PI * 2)) * ts * 0.06;

      // からだの きほんサイズ（2.5とうしん）
      const headR = ts * 0.22;
      const bodyH = ts * 0.34;
      const bodyW = ts * 0.30;

      // いろ：player=あか系＋ぼうし、cpu=あお系＋ロボ風アンテナ
      const skin = rgb(255, 222, 190);
      const cloth = isCpu ? rgb(70, 130, 220) : rgb(220, 70, 70);
      const clothD = isCpu ? rgb(48, 96, 170) : rgb(170, 46, 46);
      const hatCol = isCpu ? rgb(180, 200, 220) : rgb(200, 40, 40);

      // あしもとの おち影（かならず）
      shadow(ctx, cx, cy, ts * 0.26, ts * 0.1);

      const footY = cy - bounce;
      const bodyBottom = footY - ts * 0.02;
      const bodyTop = bodyBottom - bodyH;
      const headCy = bodyTop - headR * 0.7;

      // あし（2ほん。walkで まえ／うしろ）
      ctx.fillStyle = clothD;
      const legW = ts * 0.09, legH = ts * 0.1;
      const legSwing = stride * ts * 0.06;
      ctx.fillRect(cx - bodyW * 0.28 - legW / 2 + legSwing, bodyBottom, legW, legH);
      ctx.fillRect(cx + bodyW * 0.28 - legW / 2 - legSwing, bodyBottom, legW, legH);

      // からだ（どう）
      ctx.fillStyle = cloth;
      roundRect(ctx, cx - bodyW / 2, bodyTop, bodyW, bodyH, ts * 0.06);
      ctx.fill();
      // からだの 影がわ（みぎ）
      ctx.fillStyle = clothD;
      roundRect(ctx, cx + bodyW * 0.18, bodyTop, bodyW * 0.32, bodyH, ts * 0.06);
      ctx.fill();

      // うで（むきで いちを かえる）
      ctx.fillStyle = skin;
      const armY = bodyTop + bodyH * 0.2;
      const armR = ts * 0.05;
      if (dir !== 'up') {
        ctx.beginPath(); ctx.arc(cx - bodyW * 0.5, armY + bodyH * 0.3, armR, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + bodyW * 0.5, armY + bodyH * 0.3, armR, 0, Math.PI * 2); ctx.fill();
      }

      // あたま
      ctx.fillStyle = skin;
      ctx.beginPath();
      ctx.arc(cx, headCy, headR, 0, Math.PI * 2);
      ctx.fill();

      // かみ／ぼうし（player は ぼうし、cpu は メタル頭＋アンテナ）
      if (isCpu) {
        // メタルな あたまカバー
        ctx.fillStyle = hatCol;
        ctx.beginPath();
        ctx.arc(cx, headCy - headR * 0.1, headR * 0.95, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(cx - headR * 0.95, headCy - headR * 0.1, headR * 1.9, headR * 0.3);
        // アンテナ
        ctx.strokeStyle = rgb(120, 140, 160);
        ctx.lineWidth = Math.max(1, ts * 0.02);
        ctx.beginPath();
        ctx.moveTo(cx, headCy - headR);
        ctx.lineTo(cx, headCy - headR * 1.7);
        ctx.stroke();
        ctx.fillStyle = rgb(255, 90, 90);
        ctx.beginPath();
        ctx.arc(cx, headCy - headR * 1.8, ts * 0.04, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // ぼうし（つば つき）
        ctx.fillStyle = hatCol;
        ctx.beginPath();
        ctx.arc(cx, headCy - headR * 0.15, headR * 0.95, Math.PI, 0);
        ctx.fill();
        // つば（むきで まえに でる）
        const brim = dir === 'left' ? -headR : (dir === 'right' ? headR : 0);
        ctx.beginPath();
        ctx.ellipse(cx + brim * 0.6, headCy - headR * 0.1, headR * (dir === 'down' ? 1.1 : 0.8), headR * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // かお（dir で め／むきを かえる。up は うしろむき→かお なし）
      if (dir !== 'up') {
        ctx.fillStyle = rgb(40, 40, 50);
        const eyeY = headCy + headR * 0.1;
        const eR = ts * 0.025;
        if (dir === 'down') {
          ctx.beginPath(); ctx.arc(cx - headR * 0.35, eyeY, eR, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(cx + headR * 0.35, eyeY, eR, 0, Math.PI * 2); ctx.fill();
        } else if (dir === 'left') {
          ctx.beginPath(); ctx.arc(cx - headR * 0.4, eyeY, eR, 0, Math.PI * 2); ctx.fill();
        } else if (dir === 'right') {
          ctx.beginPath(); ctx.arc(cx + headR * 0.4, eyeY, eR, 0, Math.PI * 2); ctx.fill();
        }
      }

      if (night) {
        // よる は うっすら あおい りんかく
        ctx.fillStyle = rgba(20, 30, 70, 0.18);
        ctx.beginPath();
        ctx.ellipse(cx, (headCy + bodyBottom) / 2, bodyW * 0.8, (bodyBottom - headCy) * 0.65, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    } catch (e) { /* むし */ }
  }

  // かどまる しかく ヘルパ
  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ============================================================
     けはい sign（ゆれる くさむら＋「！」がふわっと）
     ============================================================ */
  function sign(ctx, cx, cy, ts, time) {
    try {
      time = time || 0;
      const t = time * 0.001;
      // あしもとの おち影
      shadow(ctx, cx, cy, ts * 0.24, ts * 0.09);
      // ゆれる くさむら（3〜4ぼん）
      ctx.lineWidth = Math.max(1.5, ts * 0.06);
      for (let i = 0; i < 4; i++) {
        const off = (i - 1.5) * ts * 0.1;
        const bx = cx + off;
        const h = ts * (0.4 + (i % 2) * 0.12);
        const sway = Math.sin(t * 3 + i * 0.9) * ts * 0.1;
        ctx.strokeStyle = i % 2 ? rgb(74, 150, 64) : rgb(54, 120, 50);
        ctx.beginPath();
        ctx.moveTo(bx, cy);
        ctx.quadraticCurveTo(bx + sway * 0.5, cy - h * 0.6, bx + sway, cy - h);
        ctx.stroke();
      }
      // 「！」がふわっと うえした
      const floaty = Math.sin(t * 2.4) * ts * 0.08;
      const exY = cy - ts * 0.7 + floaty;
      // ふきだし まる
      ctx.fillStyle = rgba(255, 240, 120, 0.95);
      ctx.beginPath();
      ctx.arc(cx, exY, ts * 0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = rgb(200, 150, 30);
      ctx.lineWidth = Math.max(1, ts * 0.02);
      ctx.stroke();
      // 「！」もじ
      ctx.fillStyle = rgb(200, 60, 40);
      ctx.fillRect(cx - ts * 0.02, exY - ts * 0.09, ts * 0.04, ts * 0.1);
      ctx.beginPath();
      ctx.arc(cx, exY + ts * 0.05, ts * 0.025, 0, Math.PI * 2);
      ctx.fill();
    } catch (e) { /* むし */ }
  }

  /* ============================================================
     よるの あんまく nightOverlay（ぜんたい＋プレイヤーまわりの まるい あかり）
     ============================================================ */
  function nightOverlay(ctx, W, H, lx, ly, r) {
    try {
      r = Math.max(1, r || 1);
      ctx.save();
      let g;
      try { g = ctx.createRadialGradient(lx, ly, r * 0.2, lx, ly, r); }
      catch (e) { g = null; }
      if (g) {
        // ちゅうしんは すきとおり、そとは こい あお
        g.addColorStop(0, rgba(10, 14, 40, 0));
        g.addColorStop(0.55, rgba(10, 14, 40, 0.30));
        g.addColorStop(1, rgba(6, 8, 28, 0.78));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      } else {
        // グラデが つかえない ときは ぜんめん いちまい
        ctx.fillStyle = rgba(6, 8, 28, 0.6);
        ctx.fillRect(0, 0, W, H);
      }
      // あかりの ふちに あったかい にじみ
      ctx.fillStyle = rgba(255, 220, 150, 0.05);
      ctx.beginPath();
      ctx.arc(lx, ly, r * 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } catch (e) { /* むし */ }
  }

  /* ---- こうかい（グローバル const Tiles に まとめる） ---- */
  return {
    ground: ground,
    transition: transition,
    cliff: cliff,
    tree: tree,
    deco: deco,
    shadow: shadow,
    chibi: chibi,
    sign: sign,
    nightOverlay: nightOverlay,
  };
})();


/* ===== src/field/field-cpu.js ===== */
/* ============================================================
   むしとりバトル — field-cpu.js（フィールド＆CPU対戦）
   マップせいせい・たんさく・カメラ追従の立体えがき・CPUライバルを ぜんぶ ここで。
   core.js の G / CONFIG / U / D / enterCatch / updateHud と、
   bugs.js の BUGS / pickSpecies、render/tiles.js の Tiles を つかう。
   ※ import/export しない。関数宣言で genMap/startField/stopField/setupCpu/cpuTick をだす。
   tiles.js（Tiles）が さきに 連結されている まえてい。Tiles参照は ループ内（実行時）だけ。
   ============================================================ */

/* タイルのいみ（tiles）: 0草 / 1水 / 2崖(壁) / 3森(壁) / 4道 / 5砂利 — 歩けるのは 0/4/5
   かざり（deco・歩けるタイルの上だけ）: 0なし / 1花 / 2せいたか草 / 3小石 / 4丸太 / 5きのこ */

/* タイルの ピクセルサイズ＝カメラのズーム感。VIEW_TILE を そのまま タイルpx にする */
function _ts() { return CONFIG.VIEW_TILE; }              // = 40px
function _mapPixW() { return _ts() * CONFIG.MAP_W; }
function _mapPixH() { return _ts() * CONFIG.MAP_H; }

/* タイル中心の「ワールド」ピクセル座標（カメラまえ） */
function _tileCx(tx) { return tx * _ts() + _ts() / 2; }
function _tileCy(ty) { return ty * _ts() + _ts() / 2; }

/* canvas の ろんり（CSS）サイズ */
const VIEW_W = 420, VIEW_H = 600;

/* ============================================================
   マップせいせい（30×34・しぜんな ちけい）
   ============================================================ */
function genMap() {
  const W = CONFIG.MAP_W, H = CONFIG.MAP_H;
  const tiles = new Int8Array(W * H);
  const deco = new Int8Array(W * H);
  const at = (x, y) => y * W + x;
  const inBounds = (x, y) => x >= 0 && y >= 0 && x < W && y < H;

  // ぜんめん 草 でうめる
  tiles.fill(0);

  // そとわくは 森（3）で かこむ
  for (let x = 0; x < W; x++) { tiles[at(x, 0)] = 3; tiles[at(x, H - 1)] = 3; }
  for (let y = 0; y < H; y++) { tiles[at(0, y)] = 3; tiles[at(W - 1, y)] = 3; }

  // ---- うねる 川（1）を よこに わたす。とちゅう 1〜2か所「はし＝道(4)」で つうろを のこす ----
  const riverRows = [];
  {
    const cands = [];
    for (let y = 5; y < H - 5; y++) cands.push(y);
    const want = U.rint(2, 3);
    for (let i = 0; i < want && cands.length; i++) {
      const idx = U.rint(0, cands.length - 1);
      const ry = cands[idx];
      for (let k = cands.length - 1; k >= 0; k--) if (Math.abs(cands[k] - ry) < 4) cands.splice(k, 1);
      riverRows.push(ry);
    }
  }
  for (const ry of riverRows) {
    // うねうね する: 行を サインで すこし 上下させ、はばも 1〜2 で ゆらす
    let phase = U.rnd() * 6.28;
    for (let x = 1; x < W - 1; x++) {
      const wob = Math.round(Math.sin(phase + x * 0.5) * 1.4);
      const cy = U.clamp(ry + wob, 1, H - 2);
      const half = U.rnd() < 0.4 ? 1 : 0; // ところどころ はばひろ
      for (let dy = -half; dy <= half; dy++) {
        const yy = U.clamp(cy + dy, 1, H - 2);
        if (tiles[at(x, yy)] !== 3) tiles[at(x, yy)] = 1;
      }
    }
    // はし（道）を 1〜2か所
    const gaps = U.rint(1, 2);
    for (let g = 0; g < gaps; g++) {
      const gx = U.rint(3, W - 4);
      for (let y = 1; y < H - 1; y++) if (tiles[at(gx, y)] === 1) tiles[at(gx, y)] = 4;
    }
  }

  // ---- 湖／池（1）を 1〜2こ おく（だ円っぽい かたまり） ----
  {
    const ponds = U.rint(1, 2);
    for (let i = 0; i < ponds; i++) {
      const cx = U.rint(4, W - 5), cy = U.rint(6, H - 7);
      const rx = U.rint(2, 4), ry = U.rint(2, 3);
      for (let y = cy - ry; y <= cy + ry; y++) for (let x = cx - rx; x <= cx + rx; x++) {
        if (!inBounds(x, y) || x === 0 || y === 0 || x === W - 1 || y === H - 1) continue;
        const nx = (x - cx) / (rx + 0.5), ny = (y - cy) / (ry + 0.5);
        if (nx * nx + ny * ny <= 1 && tiles[at(x, y)] !== 3) tiles[at(x, y)] = 1;
      }
    }
  }

  // ---- 崖の 尾根（2）で 高低差。たてに 1〜2ほん。すきまを 砂利(5) で あける ----
  {
    const want = U.rint(1, 2);
    for (let i = 0; i < want; i++) {
      const rx = U.rint(4, W - 5);
      let phase = U.rnd() * 6.28;
      for (let y = 1; y < H - 1; y++) {
        const wob = Math.round(Math.sin(phase + y * 0.45) * 1.2);
        const xx = U.clamp(rx + wob, 1, W - 2);
        if (tiles[at(xx, y)] === 1 || tiles[at(xx, y)] === 4) continue; // 川/はし は のこす
        if (tiles[at(xx, y)] !== 3) tiles[at(xx, y)] = 2;
      }
      // すきまを 1〜2か所 砂利で あける
      const gaps = U.rint(1, 2);
      for (let g = 0; g < gaps; g++) {
        const gy = U.rint(2, H - 3);
        for (let y = gy; y < H - 1; y++) { // たてに ちかい 崖を いくつか けずる
          let cleared = false;
          for (let x = 1; x < W - 1; x++) if (tiles[at(x, y)] === 2) { tiles[at(x, y)] = 5; cleared = true; break; }
          if (cleared) break;
        }
      }
    }
  }

  // ---- 森の かたまり（3）を 2〜4こ ちらす（まるい くさむら状） ----
  {
    const blobs = U.rint(2, 4);
    for (let i = 0; i < blobs; i++) {
      const cx = U.rint(3, W - 4), cy = U.rint(3, H - 4);
      const r = U.rint(1, 3);
      for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
        if (!inBounds(x, y) || x === 0 || y === 0 || x === W - 1 || y === H - 1) continue;
        const dd = (x - cx) * (x - cx) + (y - cy) * (y - cy);
        if (dd <= r * r && tiles[at(x, y)] === 0 && U.rnd() < 0.8) tiles[at(x, y)] = 3;
      }
    }
  }

  // ---- 道(4)／砂利(5) の こみち を ちらす（歩けるところを へらしすぎない） ----
  for (let n = 0; n < Math.floor(W * H * 0.05); n++) {
    const x = U.rint(1, W - 2), y = U.rint(1, H - 2);
    if (tiles[at(x, y)] !== 0) continue;
    tiles[at(x, y)] = U.pick([4, 5]); // 道 or 砂利（どちらも歩ける）
  }

  G.map = { w: W, h: H, tiles, deco };

  // ---- れんけつせいを ほしょう（壁配置の あとで BFS、孤立は 砂利の こみちで つなぐ）----
  const isWalk = (x, y) => {
    if (!inBounds(x, y)) return false;
    const t = tiles[at(x, y)];
    return t === 0 || t === 4 || t === 5;
  };
  const DD = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  // コンポーネントを みつける
  const comp = new Int16Array(W * H).fill(-1);
  const comps = [];
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (!isWalk(x, y) || comp[at(x, y)] !== -1) continue;
    const id = comps.length;
    const cells = [];
    const q = [[x, y]]; let head = 0;
    comp[at(x, y)] = id;
    while (head < q.length) {
      const [cx, cy] = q[head++];
      cells.push([cx, cy]);
      for (const [dx, dy] of DD) {
        const nx = cx + dx, ny = cy + dy;
        if (isWalk(nx, ny) && comp[at(nx, ny)] === -1) { comp[at(nx, ny)] = id; q.push([nx, ny]); }
      }
    }
    comps.push(cells);
  }

  // ほんたい＝いちばん 大きい かたまり
  let mainId = 0;
  for (let i = 1; i < comps.length; i++) if (comps[i].length > comps[mainId].length) mainId = i;

  // ほかの かたまりを 本体へ 砂利の こみちで つなぐ
  for (let i = 0; i < comps.length; i++) {
    if (i === mainId || comps.length === 0) continue;
    let bestA = null, bestB = null, bd = 1e9;
    const sample = comps[i], mainCells = comps[mainId];
    const stepA = Math.max(1, (sample.length / 24) | 0);
    const stepB = Math.max(1, (mainCells.length / 40) | 0);
    for (let a = 0; a < sample.length; a += stepA) {
      const [ax, ay] = sample[a];
      for (let b = 0; b < mainCells.length; b += stepB) {
        const [bx, by] = mainCells[b];
        const d = Math.abs(ax - bx) + Math.abs(ay - by);
        if (d < bd) { bd = d; bestA = [ax, ay]; bestB = [bx, by]; }
      }
    }
    if (!bestA) continue;
    let [cx, cy] = bestA;
    const [tx2, ty2] = bestB;
    const carve = (x, y) => {
      if (x <= 0 || y <= 0 || x >= W - 1 || y >= H - 1) return; // そとわくは のこす
      if (!isWalk(x, y)) tiles[at(x, y)] = 5; // 砂利の こみち
    };
    while (cx !== tx2) { cx += cx < tx2 ? 1 : -1; carve(cx, cy); }
    while (cy !== ty2) { cy += cy < ty2 ? 1 : -1; carve(cx, cy); }
  }

  // しゅっぱつち: 本体の 中から、なるべく 中央したよりの 歩けるマス
  let start = null;
  if (comps.length) {
    const cy0 = H - 4, cx0 = (W >> 1);
    let bd2 = 1e9;
    for (const [x, y] of comps[mainId]) {
      const d = Math.abs(x - cx0) + Math.abs(y - cy0);
      if (d < bd2) { bd2 = d; start = { x, y }; }
    }
  }
  if (!start) { tiles[at(1, 1)] = 0; start = { x: 1, y: 1 }; }

  // さいしゅう連結チェック: start から BFS、とどかない 歩けるタイルは 崖(2)で うめて 孤立=0 に
  const seen = new Uint8Array(W * H);
  {
    const q = [start]; let head = 0;
    seen[at(start.x, start.y)] = 1;
    while (head < q.length) {
      const c = q[head++];
      for (const [dx, dy] of DD) {
        const nx = c.x + dx, ny = c.y + dy;
        if (isWalk(nx, ny) && !seen[at(nx, ny)]) { seen[at(nx, ny)] = 1; q.push({ x: nx, y: ny }); }
      }
    }
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (isWalk(x, y) && !seen[at(x, y)]) tiles[at(x, y)] = 2;
  }

  // ---- かざり deco を ちらす（歩けるタイルの 上だけ・start は あけておく）----
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (!isWalk(x, y)) { deco[at(x, y)] = 0; continue; }
    if (x === start.x && y === start.y) continue;
    const t = tiles[at(x, y)];
    if (t !== 0) continue; // 道/砂利の 上には あまり おかない（草の上に）
    const r = U.rnd();
    if (r < 0.10) deco[at(x, y)] = 1;       // 花
    else if (r < 0.16) deco[at(x, y)] = 2;  // せいたか草
    else if (r < 0.185) deco[at(x, y)] = 3; // 小石
    else if (r < 0.20) deco[at(x, y)] = 4;  // 丸太
    else if (r < 0.215) deco[at(x, y)] = 5; // きのこ
  }
  // 花畑: 花を かたまりで すこし こく
  {
    const fields = U.rint(2, 4);
    for (let i = 0; i < fields; i++) {
      const cx = U.rint(3, W - 4), cy = U.rint(3, H - 4), r = U.rint(1, 2);
      for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
        if (isWalk(x, y) && tiles[at(x, y)] === 0 && deco[at(x, y)] === 0 && U.rnd() < 0.7) deco[at(x, y)] = 1;
      }
    }
  }

  // プレイヤーを しゅっぱつちへ
  const p = G.player;
  p.tx = start.x; p.ty = start.y;
  p.x = _tileCx(p.tx); p.y = _tileCy(p.ty);
  p.fx = p.x; p.fy = p.y;
  p.dir = 'down'; p.moving = false; p.mvT = 0; p.busy = false;

  // カメラを プレイヤーに あわせて しょきか
  _camInit();

  // けはいを SIGN_TARGET こ ばらまく
  G.signs = [];
  for (let i = 0; i < CONFIG.SIGN_TARGET; i++) spawnSign();
}

/* 歩けて だれとも かぶらない タイルへ けはいを ついか */
function spawnSign() {
  const W = CONFIG.MAP_W, H = CONFIG.MAP_H;
  const occupied = (tx, ty) => {
    if (G.player && G.player.tx === tx && G.player.ty === ty) return true;
    if (G.mode === 'vs' && G.cpu && G.cpu.tx === tx && G.cpu.ty === ty) return true;
    return G.signs.some(s => s.tx === tx && s.ty === ty);
  };
  for (let tries = 0; tries < 400; tries++) {
    const tx = U.rint(1, W - 2), ty = U.rint(1, H - 2);
    if (!U.walkable(tx, ty)) continue;
    if (G.player && Math.abs(tx - G.player.tx) + Math.abs(ty - G.player.ty) < 2) continue;
    if (occupied(tx, ty)) continue;
    G.signs.push({ tx, ty, key: pickSpecies(G.night), id: ++G.signSeq });
    return;
  }
}

/* ============================================================
   CPU（たいせん）
   ============================================================ */
function setupCpu() {
  const W = CONFIG.MAP_W, H = CONFIG.MAP_H;
  let best = null, bd = -1;
  for (let t = 0; t < 500; t++) {
    const x = U.rint(1, W - 2), y = U.rint(1, H - 2);
    if (!U.walkable(x, y)) continue;
    const d = Math.abs(x - G.player.tx) + Math.abs(y - G.player.ty);
    if (d > bd) { bd = d; best = { x, y }; }
    if (bd >= W + H - 6) break;
  }
  if (!best) best = { x: G.player.tx, y: G.player.ty };
  const c = G.cpu;
  c.tx = best.x; c.ty = best.y;
  c.x = _tileCx(c.tx); c.y = _tileCy(c.ty);
  c.fx = c.x; c.fy = c.y;
  c.dir = 'down'; c.moving = false; c.mvT = 0;
  c.stopUntil = 0; c.path = null; c.targetId = null;
  c._acc = 0;
  c._wdir = 'down';
}

/* CPU→もくひょうへの BFS。さいしょの 1マスの [dx,dy] をかえす（なければ null） */
function cpuPathStep(fromTx, fromTy, toTx, toTy) {
  if (fromTx === toTx && fromTy === toTy) return null;
  const W = CONFIG.MAP_W;
  const key = (x, y) => y * W + x;
  const prev = new Map();
  const q = [[fromTx, fromTy]]; let head = 0;
  prev.set(key(fromTx, fromTy), -1);
  let found = false;
  const DD = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (head < q.length && !found) {
    const [x, y] = q[head++];
    for (const [dx, dy] of DD) {
      const nx = x + dx, ny = y + dy;
      if (!U.walkable(nx, ny) || prev.has(key(nx, ny))) continue;
      prev.set(key(nx, ny), key(x, y));
      if (nx === toTx && ny === toTy) { found = true; break; }
      q.push([nx, ny]);
    }
  }
  if (!found) return null;
  let cur = key(toTx, toTy);
  const startK = key(fromTx, fromTy);
  while (prev.get(cur) !== startK) cur = prev.get(cur);
  return [cur % W - fromTx, Math.floor(cur / W) - fromTy];
}

/* CPU を 1マス うごかす（歩ける場合のみ）。ほかんを はじめる */
function _cpuStartMove(dx, dy) {
  const c = G.cpu;
  const nx = c.tx + dx, ny = c.ty + dy;
  if (!U.walkable(nx, ny)) return false;
  c.fx = c.x; c.fy = c.y;
  c.tx = nx; c.ty = ny;
  c.moving = true; c.mvT = 0;
  c.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up';
  return true;
}

function cpuTick(dtMs) {
  const c = G.cpu;
  const now = performance.now();

  if (c.moving) {
    c.mvT += dtMs;
    const stepMs = CONFIG.CPU_STEP_MS[G.cpuLv] || 640;
    const p = Math.min(1, c.mvT / stepMs);
    c.x = c.fx + (_tileCx(c.tx) - c.fx) * p;
    c.y = c.fy + (_tileCy(c.ty) - c.fy) * p;
    if (p >= 1) {
      c.moving = false;
      c.x = _tileCx(c.tx); c.y = _tileCy(c.ty);
      _cpuTryCatch();
    }
    return;
  }

  if (now < c.stopUntil) return;

  c._acc += dtMs;
  const stepMs = CONFIG.CPU_STEP_MS[G.cpuLv] || 640;
  if (c._acc < stepMs) return;
  c._acc = 0;

  let target = null, bd = 1e9;
  for (const s of G.signs) {
    const d = Math.abs(s.tx - c.tx) + Math.abs(s.ty - c.ty);
    if (d < bd) { bd = d; target = s; }
  }
  let moved = false;
  if (target && bd <= CONFIG.CPU_CHASE_R) {
    const step = cpuPathStep(c.tx, c.ty, target.tx, target.ty);
    if (step) moved = _cpuStartMove(step[0], step[1]);
  }
  if (!moved) {
    const DMAP = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const ks = Object.keys(DMAP).sort(() => Math.random() - 0.5);
    const order = [c._wdir, ...ks];
    for (const k of order) {
      const [dx, dy] = DMAP[k];
      if (_cpuStartMove(dx, dy)) { c._wdir = k; break; }
    }
  }
}

/* CPU が けはいタイルへ とうちゃく → 捕獲はんてい */
function _cpuTryCatch() {
  const c = G.cpu;
  const idx = G.signs.findIndex(s => s.tx === c.tx && s.ty === c.ty);
  if (idx < 0) return;
  const sign = G.signs[idx];
  G.signs.splice(idx, 1);
  c.targetId = null;

  const p = CONFIG.CPU_CATCH_P[G.cpuLv] || 0.5;
  if (U.chance(p)) {
    const b = BUGS[sign.key];
    const pts = (b && b.pts) || 0;
    G.cpuScore += pts;
    G.cpuCaught.push({ key: sign.key, name: b ? b.name : '？', pts });
    c.stopUntil = performance.now() + 600;
  } else {
    c.stopUntil = performance.now() + Math.max(1200, (8 - G.cpuLv) * 700);
  }
  updateHud();
  setTimeout(() => { if (G.running) spawnSign(); }, CONFIG.SIGN_RESPAWN_MS);
}

/* ============================================================
   カメラ（プレイヤー追従・端でクランプ・やや遅れて滑らかに）
   ============================================================ */
const _cam = { x: 0, y: 0 };  // 画面左上が さす ワールド座標（px）

function _camClampTarget(wx, wy) {
  // プレイヤー中心が 画面まんなかに くるよう、左上ワールド座標を もとめてクランプ
  const maxX = Math.max(0, _mapPixW() - VIEW_W);
  const maxY = Math.max(0, _mapPixH() - VIEW_H);
  let cx = wx - VIEW_W / 2;
  let cy = wy - VIEW_H / 2;
  cx = U.clamp(cx, 0, maxX);
  cy = U.clamp(cy, 0, maxY);
  return { x: cx, y: cy };
}

function _camInit() {
  const t = _camClampTarget(G.player.x, G.player.y);
  _cam.x = t.x; _cam.y = t.y;
}

function _camUpdate(dtMs) {
  const t = _camClampTarget(G.player.x, G.player.y);
  // フレームレート ふいの なめらかおいかけ（指数おいかけ）
  const k = 1 - Math.pow(0.0025, dtMs / 1000); // やく 0..1（dt おおきいほど 1に ちかい）
  _cam.x += (t.x - _cam.x) * k;
  _cam.y += (t.y - _cam.y) * k;
}

/* ============================================================
   rAF ループ
   ============================================================ */
let _rafId = 0;
let _lastT = 0;
let _stepSfxT = 0;
let _animTime = 0; // 水/草アニメ用の じかん（ms）

function startField() {
  if (_rafId) return;
  _ensureCanvasSize();
  _lastT = performance.now();
  const loop = (now) => {
    _rafId = requestAnimationFrame(loop);
    const dt = Math.min(60, now - _lastT);
    _lastT = now;
    if (!G.player.busy) _update(dt, now);
    _camUpdate(dt);
    _drawField(now);
    _animTime += dt; // 水・草・けはいの アニメ じかんを すすめる
  };
  _rafId = requestAnimationFrame(loop);
}

function stopField() {
  if (_rafId) { cancelAnimationFrame(_rafId); _rafId = 0; }
}

function _update(dtMs, now) {
  const p = G.player;

  if (p.moving) {
    p.mvT += dtMs;
    const t = Math.min(1, p.mvT / CONFIG.STEP_MS);
    p.x = p.fx + (_tileCx(p.tx) - p.fx) * t;
    p.y = p.fy + (_tileCy(p.ty) - p.fy) * t;
    if (t >= 1) {
      p.moving = false;
      p.x = _tileCx(p.tx); p.y = _tileCy(p.ty);
      _checkReachSign();
    }
  } else {
    const { dx, dy } = G.input;
    if (dx !== 0 || dy !== 0) {
      p.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up';
      const nx = p.tx + dx, ny = p.ty + dy;
      if (U.walkable(nx, ny)) {
        p.fx = p.x; p.fy = p.y;
        p.tx = nx; p.ty = ny;
        p.moving = true; p.mvT = 0;
        if (now - _stepSfxT > 200) { _stepSfxT = now; if (typeof Sound !== 'undefined' && Sound && Sound.sfx) Sound.sfx.step(); }
      }
    }
  }

  if (G.mode === 'vs') cpuTick(dtMs);

  // テンポ: 場の けはいが ふえなさすぎ／枯れすぎ ないよう、たまに 目安数まで そっと おぎなう。
  // （やり過ぎない: たりない ぶんを ゆっくり 1こずつ。既存の respawn と けんかしない軽い保険）
  _topUpSigns(dtMs);
}

/* けはいの 目安数を ほそく たもつ（こまめに 1こだけ おぎなう）。れいがいで おちない */
let _signTopAcc = 0;
function _topUpSigns(dtMs) {
  try {
    if (!G.running || !G.signs) return;
    _signTopAcc += dtMs || 0;
    if (_signTopAcc < 900) return; // やく0.9秒ごとに しらべる（軽く）
    _signTopAcc = 0;
    const target = (typeof CONFIG !== 'undefined' && CONFIG.SIGN_TARGET) ? CONFIG.SIGN_TARGET : 9;
    // 既存の respawn タイマも うごくので、ここでは「いちじるしく たりない」ときだけ 1こ
    if (G.signs.length < target - 1) spawnSign();
  } catch (e) { /* むし */ }
}

/* プレイヤーが けはいタイルへ → 捕獲シーンへ */
function _checkReachSign() {
  const p = G.player;
  const idx = G.signs.findIndex(s => s.tx === p.tx && s.ty === p.ty);
  if (idx < 0) return;
  const sign = G.signs[idx];
  G.signs.splice(idx, 1);
  setTimeout(() => { if (G.running) spawnSign(); }, CONFIG.SIGN_RESPAWN_MS);
  enterCatch(sign);
}

/* ============================================================
   canvas サイズ（devicePixelRatio 対応・リサイズにも安全に）
   ============================================================ */
function _ensureCanvasSize() {
  const cv = D.canvas; if (!cv) return null;
  const ctx = cv.getContext('2d');
  const dpr = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
  const needW = Math.round(VIEW_W * dpr), needH = Math.round(VIEW_H * dpr);
  if (cv.width !== needW || cv.height !== needH) {
    cv.width = needW; cv.height = needH;
    // CSS の みためサイズは ろんりサイズに（スタイルが あれば そちら ゆうせん）
    if (!cv.style.width) cv.style.width = VIEW_W + 'px';
    if (!cv.style.height) cv.style.height = VIEW_H + 'px';
  }
  // まいフレーム リセット: ろんり座標で えがけるよう DPR スケール
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

/* ============================================================
   えがく（カメラ変換ご・可視はんいだけ・足元ワールドYで奥行きソート）
   ============================================================ */
function _drawField(now) {
  const ctx = _ensureCanvasSize();
  if (!ctx) return;
  const m = G.map; if (!m) return;
  const TS = _ts();
  const W = m.w, H = m.h;
  const time = _animTime;
  const night = !!G.night;
  const at = (x, y) => y * W + x;

  // ワールド→スクリーン
  const sX = (wx) => wx - _cam.x;
  const sY = (wy) => wy - _cam.y;

  // せなか（くろ）でクリア
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = night ? '#0b1226' : '#1c2b18';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // ---- 可視タイルはんい（カリング）----
  const x0 = Math.max(0, Math.floor(_cam.x / TS) - 1);
  const y0 = Math.max(0, Math.floor(_cam.y / TS) - 1);
  const x1 = Math.min(W - 1, Math.ceil((_cam.x + VIEW_W) / TS) + 1);
  const y1 = Math.min(H - 1, Math.ceil((_cam.y + VIEW_H) / TS) + 1);

  const tileAt = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? 3 : m.tiles[at(x, y)];
  const groundKind = (t) => t === 1 ? 'water' : t === 4 ? 'path' : t === 5 ? 'gravel' : 'grass';
  // 崖(2)/森(3) の 足元は 草の地面に する（立ち上がる物として 上に かさねる）
  const baseKind = (t) => (t === 2 || t === 3) ? 'grass' : groundKind(t);

  const T = (typeof Tiles !== 'undefined') ? Tiles : null;

  // ---- ① 地面レイヤ ----
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const t = m.tiles[at(x, y)];
      const px = sX(x * TS), py = sY(y * TS);
      const seed = (x * 73856093) ^ (y * 19349663);
      const kind = baseKind(t);
      if (T && T.ground) T.ground(ctx, px, py, TS, kind, seed, time, night);
      else { ctx.fillStyle = kind === 'water' ? '#3a8fd0' : kind === 'path' ? '#c9b079' : kind === 'gravel' ? '#b8b2a0' : '#5ba84e'; ctx.fillRect(px, py, TS + 1, TS + 1); }
    }
  }

  // ---- ② 地面の さかいめ なじみ（水辺・道）----
  if (T && T.transition) {
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const t = m.tiles[at(x, y)];
        if (t !== 1 && t !== 4) continue; // 水・道 の ふちだけ
        const px = sX(x * TS), py = sY(y * TS);
        const diff = (nx, ny) => {
          const nt = tileAt(nx, ny);
          if (t === 1) return nt !== 1; // 水: りく/べつ地形 が となり
          return nt !== 4;              // 道: みち いがい が となり
        };
        const mask = {
          n: diff(x, y - 1), e: diff(x + 1, y), s: diff(x, y + 1), w: diff(x - 1, y),
          ne: diff(x + 1, y - 1), nw: diff(x - 1, y - 1), se: diff(x + 1, y + 1), sw: diff(x - 1, y + 1),
        };
        const base = t === 1 ? 'water' : 'path';
        T.transition(ctx, px, py, TS, base, mask, time);
      }
    }
  }

  // ---- ③ 平らな deco（花・小石）は 地面の すぐあと ----
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const d = m.deco[at(x, y)];
      if (d !== 1 && d !== 3) continue; // 花 / 小石
      const cx = sX(_tileCx(x)), cy = sY(_tileCy(y));
      const seed = (x * 73856093) ^ (y * 19349663);
      if (T && T.deco) T.deco(ctx, cx, cy, TS, d === 1 ? 'flower' : 'rock', seed, time);
    }
  }

  // ---- ④ 立ち上がる物を あつめて 足元ワールドYで ソート（後→前）----
  const draws = [];
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const idx = at(x, y);
      const t = m.tiles[idx];
      const d = m.deco[idx];
      const footY = (y + 1) * TS; // 足元（タイル下辺）ワールドY
      const seed = (x * 73856093) ^ (y * 19349663);
      if (t === 2) draws.push({ y: footY, kind: 'cliff', x, ty: y, seed });
      else if (t === 3) draws.push({ y: footY, kind: 'tree', x, ty: y, seed });
      if (d === 2 || d === 4 || d === 5) draws.push({ y: footY, kind: 'deco', x, ty: y, deco: d, seed });
    }
  }
  // けはい
  for (const s of G.signs) {
    if (s.tx < x0 - 1 || s.tx > x1 + 1 || s.ty < y0 - 1 || s.ty > y1 + 1) continue;
    draws.push({ y: (s.ty + 1) * TS, kind: 'sign', sign: s });
  }
  // CPU・プレイヤー（足元＝x,y はピクセル中心なので 下ばしまで すこし たす）
  if (G.mode === 'vs' && G.cpu) draws.push({ y: G.cpu.y + TS * 0.5, kind: 'cpu' });
  draws.push({ y: G.player.y + TS * 0.5, kind: 'player' });

  draws.sort((a, b) => a.y - b.y);

  for (const it of draws) {
    if (it.kind === 'cliff') {
      const px = sX(it.x * TS), py = sY(it.ty * TS);
      // 下の となりが 崖でなければ 崖面を 下に だす
      const below = tileAt(it.x, it.ty + 1);
      const faceH = (below === 2) ? 0.15 : 0.9;
      const capTop = (tileAt(it.x, it.ty - 1) !== 2); // 上が 崖でなければ 天端
      if (T && T.cliff) T.cliff(ctx, px, py, TS, { faceH, capTop, shadow: faceH > 0.3, seed: it.seed, night });
      else { ctx.fillStyle = '#8a8a82'; ctx.fillRect(px, py, TS, TS); }
    } else if (it.kind === 'tree') {
      const cx = sX(_tileCx(it.x)), cy = sY(_tileCy(it.ty));
      const variant = ((it.seed >>> 3) & 3);
      if (T && T.tree) T.tree(ctx, cx, cy, TS, variant, time, night);
      else { ctx.fillStyle = '#2f6b3a'; ctx.beginPath(); ctx.arc(cx, cy, TS * 0.4, 0, 7); ctx.fill(); }
    } else if (it.kind === 'deco') {
      const cx = sX(_tileCx(it.x)), cy = sY(_tileCy(it.ty));
      const kind = it.deco === 2 ? 'tallgrass' : it.deco === 4 ? 'log' : 'mushroom';
      if (T && T.deco) T.deco(ctx, cx, cy, TS, kind, it.seed, time);
    } else if (it.kind === 'sign') {
      const s = it.sign;
      const cx = sX(_tileCx(s.tx)), cy = sY(_tileCy(s.ty));
      // レアヒント: w で みための おおきさ＆きらめきを かえる（tiles.js は さわらない）
      const rare = _signRare(s);           // 1=レア / 2=中堅 / 3=ふつう
      _drawSignAura(ctx, cx, cy, TS, rare, s, time); // けはいの まえに オーラ／ひかり
      const scale = rare === 1 ? 1.32 : rare === 2 ? 1.14 : 1.0; // レアほど 大きめ
      if (T && T.sign) {
        if (scale !== 1) {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(scale, scale);
          T.sign(ctx, 0, 0, TS, time);
          ctx.restore();
        } else {
          T.sign(ctx, cx, cy, TS, time);
        }
      } else { ctx.fillStyle = '#3e7e36'; ctx.beginPath(); ctx.arc(cx, cy, TS * 0.25 * scale, 0, 7); ctx.fill(); }
      if (rare === 1) _drawSignSparkle(ctx, cx, cy, TS, s, time); // レアは 星の きらめきを うえに
    } else if (it.kind === 'cpu') {
      const c = G.cpu;
      const cx = sX(c.x), cy = sY(c.y);
      const ph = _walkPhase(c, now);
      if (T && T.chibi) T.chibi(ctx, cx, cy + TS * 0.4, TS, c.dir, ph, 'cpu', night);
      else _fallbackChibi(ctx, cx, cy, true);
    } else if (it.kind === 'player') {
      const p = G.player;
      const cx = sX(p.x), cy = sY(p.y);
      const ph = _walkPhase(p, now);
      if (T && T.chibi) T.chibi(ctx, cx, cy + TS * 0.4, TS, p.dir, ph, 'player', night);
      else _fallbackChibi(ctx, cx, cy, false);
    }
  }

  // ---- ⑤ 夜の あんまく（プレイヤー画面座標 中心のライト）----
  if (night && T && T.nightOverlay) {
    const lx = sX(G.player.x), ly = sY(G.player.y);
    T.nightOverlay(ctx, VIEW_W, VIEW_H, lx, ly, TS * 4);
  } else if (night) {
    // フォールバックの あんまく
    const lx = sX(G.player.x), ly = sY(G.player.y), r = TS * 4;
    const grad = ctx.createRadialGradient(lx, ly, TS, lx, ly, r);
    grad.addColorStop(0, 'rgba(8,12,30,0)');
    grad.addColorStop(1, 'rgba(8,12,30,.75)');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

/* けはいの レア度を かえす（1=レア / 2=中堅 / 3=ふつう）。BUGS未定義でも おちない */
function _signRare(s) {
  try {
    const b = (typeof BUGS !== 'undefined' && s && s.key) ? BUGS[s.key] : null;
    const w = (b && typeof b.w === 'number') ? b.w : 3;
    if (w <= 1) return 1;
    if (w === 2) return 2;
    return 3;
  } catch (e) { return 3; }
}

/* けはいの 種いろ（淡いオーラ用）。なければ きいろ系で フォールバック */
function _signColor(s) {
  try {
    const b = (typeof BUGS !== 'undefined' && s && s.key) ? BUGS[s.key] : null;
    const c = b && b.color;
    if (typeof c === 'string' && c[0] === '#' && (c.length === 7 || c.length === 4)) return c;
  } catch (e) { /* むし */ }
  return '#ffe478';
}

/* '#rrggbb' / '#rgb' を rgba もじれつへ（パースできなければ きいろ） */
function _toRgba(hex, a) {
  try {
    let h = hex;
    if (h.length === 4) h = '#' + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
    const r = parseInt(h.slice(1, 3), 16);
    const g = parseInt(h.slice(3, 5), 16);
    const b = parseInt(h.slice(5, 7), 16);
    if (isNaN(r) || isNaN(g) || isNaN(b)) return 'rgba(255,228,120,' + a + ')';
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  } catch (e) { return 'rgba(255,228,120,' + a + ')'; }
}

/* けはいの あしもとに 淡い ひかりの オーラ（レアほど 大きく あかるく 明滅）。
   Tiles.sign の まえに よぶ（うしろがわの ひかり）。れいがいで おちない。 */
function _drawSignAura(ctx, cx, cy, ts, rare, s, time) {
  try {
    if (rare === 3) return; // ふつう は いままで どおり（そうしょく なし）
    const t = (time || 0) * 0.001;
    const col = _signColor(s);
    // 明滅（0..1）。レアは つよめ、中堅は ひかえめ
    const puls = 0.5 + 0.5 * Math.sin(t * (rare === 1 ? 3.2 : 2.2) + (s && s.id ? s.id : 0));
    const baseR = rare === 1 ? ts * 0.62 : ts * 0.42;
    const r = baseR * (1 + 0.10 * puls);
    const aMax = rare === 1 ? 0.34 : 0.18;
    const a = aMax * (0.6 + 0.4 * puls);
    ctx.save();
    let g = null;
    try { g = ctx.createRadialGradient(cx, cy - ts * 0.12, r * 0.15, cx, cy - ts * 0.12, r); }
    catch (e) { g = null; }
    if (g) {
      g.addColorStop(0, _toRgba(col, a));
      g.addColorStop(0.6, _toRgba(col, a * 0.5));
      g.addColorStop(1, _toRgba(col, 0));
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = _toRgba(col, a * 0.5);
    }
    ctx.beginPath();
    ctx.ellipse(cx, cy - ts * 0.12, r, r * 0.78, 0, 0, Math.PI * 2);
    ctx.fill();
    // レアは ひかりの リングも ひとつ（まわる ような 明滅）
    if (rare === 1) {
      ctx.lineWidth = Math.max(1, ts * 0.03);
      ctx.strokeStyle = _toRgba(col, 0.30 * (0.5 + 0.5 * puls));
      ctx.beginPath();
      ctx.ellipse(cx, cy - ts * 0.05, r * 0.78, r * 0.5, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  } catch (e) { /* むし */ }
}

/* レアの けはいに 星の きらめき（Tiles.sign の うえに かさねる）。れいがいで おちない */
function _drawSignSparkle(ctx, cx, cy, ts, s, time) {
  try {
    const t = (time || 0) * 0.001;
    const seedId = (s && s.id) ? s.id : 1;
    const stars = 3;
    ctx.save();
    for (let i = 0; i < stars; i++) {
      // それぞれ ちがう いちで まわりながら ちかちか
      const ang = t * 1.1 + i * (Math.PI * 2 / stars) + seedId * 0.7;
      const orbit = ts * (0.34 + 0.06 * Math.sin(t * 2 + i));
      const sxp = cx + Math.cos(ang) * orbit;
      const syp = cy - ts * 0.55 + Math.sin(ang) * orbit * 0.5;
      const tw = 0.5 + 0.5 * Math.sin(t * 5 + i * 1.9 + seedId);
      const a = 0.45 + 0.5 * tw;
      const sr = ts * (0.05 + 0.04 * tw);
      _drawStar(ctx, sxp, syp, sr, a);
    }
    ctx.restore();
  } catch (e) { /* むし */ }
}

/* ちいさな 4ほうの きらきら星（十字のひかり） */
function _drawStar(ctx, x, y, r, a) {
  try {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.lineTo(x + r * 0.28, y - r * 0.28);
    ctx.lineTo(x + r, y);
    ctx.lineTo(x + r * 0.28, y + r * 0.28);
    ctx.lineTo(x, y + r);
    ctx.lineTo(x - r * 0.28, y + r * 0.28);
    ctx.lineTo(x - r, y);
    ctx.lineTo(x - r * 0.28, y - r * 0.28);
    ctx.closePath();
    ctx.fill();
    // ちゅうしんの ほんのり きいろ
    ctx.fillStyle = 'rgba(255,240,170,' + (a * 0.8) + ')';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } catch (e) { /* むし */ }
}

/* 歩きフェーズ（0..1）。moving中は じかんで ぐるぐる、とまっていれば ゆっくり ゆれ */
function _walkPhase(ent, now) {
  if (ent.moving) return ((now / 140) % 1);
  return 0;
}

/* Tiles が まだ ない ときの ほけん用 チビ（ふだんは つかわない） */
function _fallbackChibi(ctx, x, y, rival) {
  ctx.save();
  ctx.fillStyle = 'rgba(15,30,8,.25)';
  ctx.beginPath(); ctx.ellipse(x, y + 12, 10, 3.5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = rival ? '#4a7ac9' : '#e8543d';
  ctx.beginPath(); ctx.arc(x, y, 10, 0, 7); ctx.fill();
  ctx.restore();
}
