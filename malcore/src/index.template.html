<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f12">
<title>マルこれ 🦠</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">

  <button id="btn-mute" class="mute-btn" aria-label="おと">🔊</button>

  <!-- タイトル -->
  <section id="title-screen" class="screen active">
    <div class="title-wrap">
      <div class="title-logo">マル<span>これ</span></div>
      <div class="title-sub">マルウェアコレクション — 攻めて学ぶセキュリティ</div>
      <div class="title-glyphs">🦠 🛡️ ⚔️ 📡 🧬</div>
      <button id="btn-start" class="big-btn">▶ はじめる</button>
      <button id="btn-codex" class="big-btn ghost">📖 図鑑</button>
      <div class="title-foot">攻撃を遊んで、防御に活かす。</div>
    </div>
  </section>

  <!-- 図鑑 -->
  <section id="codex-screen" class="screen">
    <h1 class="screen-title">📖 図鑑（マルウェア × 攻撃手法 × 対策）</h1>
    <div id="codex-body"></div>
    <button id="btn-codex-back" class="big-btn">← タイトルへ</button>
  </section>

  <!-- ステージ選択 -->
  <section id="stage-screen" class="screen">
    <h1 class="screen-title">🗺️ ステージ選択</h1>
    <div id="stage-body"></div>
    <button id="btn-stage-back" class="big-btn">← タイトルへ</button>
  </section>

  <!-- 作戦ブリーフィング -->
  <section id="briefing-screen" class="screen">
    <h1 id="briefing-title" class="screen-title">作戦</h1>
    <div id="briefing-body"></div>
    <button id="btn-sortie" class="big-btn">🦠 出撃</button>
    <button id="btn-brief-back" class="big-btn ghost">← ステージ選択へ</button>
  </section>

  <!-- 戦闘 -->
  <section id="battle-screen" class="screen">
    <div id="battle-root"><!-- core.js が描画 --></div>
  </section>

  <!-- リザルト -->
  <section id="result-screen" class="screen">
    <h1 class="screen-title">作戦結果</h1>
    <div id="result-body"></div>
    <div class="result-btns">
      <button id="btn-retry" class="big-btn retry">🔁 編成・進化へ</button>
      <button id="btn-title" class="big-btn">タイトルへ</button>
    </div>
  </section>

</div>
<script>
/*__JS__*/
</script>
</body>
</html>
