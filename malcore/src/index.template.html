<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f12">
<title>マルこれ 🦠</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">

  <button id="btn-mute" class="mute-btn" aria-label="おと">🔊</button>

  <!-- タイトル -->
  <section id="title-screen" class="screen active">
    <div class="title-wrap">
      <div class="title-logo">マル<span>これ</span></div>
      <div class="title-sub">マルウェアコレクション — 攻めて学ぶセキュリティ</div>
      <div class="title-glyphs">🦠 🛡️ ⚔️ 📡 🧬</div>
      <button id="btn-start" class="big-btn">▶ はじめる</button>
      <button id="btn-codex" class="big-btn ghost">📖 図鑑</button>
      <div class="title-foot">攻撃を遊んで、防御に活かす。</div>
    </div>
  </section>

  <!-- 母港（ハブ） -->
  <section id="home-screen" class="screen hub">
    <h1 class="screen-title">🏠 母港</h1>
    <div id="home-body"></div>
  </section>

  <!-- 図鑑 -->
  <section id="codex-screen" class="screen hub">
    <h1 class="screen-title">📖 図鑑（マルウェア × 攻撃手法 × 対策）</h1>
    <div id="codex-body"></div>
  </section>

  <!-- 開発（母港バフ） -->
  <section id="develop-screen" class="screen hub">
    <h1 class="screen-title">🛠️ 開発（母港バフ）</h1>
    <div id="develop-body"></div>
  </section>

  <!-- ステージ選択 -->
  <section id="stage-screen" class="screen hub">
    <h1 class="screen-title">🗺️ ステージ選択（出撃）</h1>
    <div id="stage-body"></div>
  </section>

  <!-- 作戦ブリーフィング -->
  <section id="briefing-screen" class="screen">
    <h1 id="briefing-title" class="screen-title">作戦</h1>
    <div id="briefing-body"></div>
    <button id="btn-sortie" class="big-btn">🦠 出撃</button>
    <button id="btn-brief-back" class="big-btn ghost">← ステージ選択へ</button>
  </section>

  <!-- 戦闘 -->
  <section id="battle-screen" class="screen">
    <div id="battle-root"><!-- core.js が描画 --></div>
  </section>

  <!-- リザルト -->
  <section id="result-screen" class="screen">
    <h1 class="screen-title">作戦結果</h1>
    <div id="result-body"></div>
    <div class="result-btns">
      <button id="btn-retry" class="big-btn retry">🔁 編成・進化へ</button>
      <button id="btn-title" class="big-btn">🏠 母港へ</button>
    </div>
  </section>

  <!-- 下部タブバー（母港/図鑑/開発/出撃） -->
  <nav id="tabbar" class="tabbar" hidden>
    <button class="tabbar-btn" data-tab="home-screen">🏠<span>母港</span></button>
    <button class="tabbar-btn" data-tab="codex-screen">📖<span>図鑑</span></button>
    <button class="tabbar-btn" data-tab="develop-screen">🛠️<span>開発</span></button>
    <button class="tabbar-btn" data-tab="stage-screen">⚔️<span>出撃</span></button>
  </nav>

  <!-- 横画面ロック: 縦のときだけ表示して回転を促す（マルこれは横画面専用） -->
  <div class="rotate-lock">
    <div class="rl-inner">
      <div class="rl-icon">📱</div>
      <div class="rl-title">画面を横にしてください</div>
      <div class="rl-sub">マルこれは<b>横画面専用</b>です。<br>端末を横向きにするとプレイできます。</div>
    </div>
  </div>

</div>
<script>
/*__JS__*/
</script>
</body>
</html>
