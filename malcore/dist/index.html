<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f12">
<title>マルこれ 🦠</title>
<style>
/* ===== src/styles.css ===== */
/* styles.css — マルこれ MVP（ターミナル/サイバー基調・スマホ縦想定） */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #0e161b 0%, #070a0d 70%);
  color: #cfe9d8; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  font-size: 15px; line-height: 1.5;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; }
.screen { display: none; padding: 16px; min-height: 100vh; }
.screen.active { display: block; }
.screen-title { font-size: 20px; color: #6fe3a6; border-left: 4px solid #2f9e63; padding-left: 10px; margin: 6px 0 14px; }

/* タイトル */
.title-wrap { text-align: center; padding-top: 16vh; }
.title-logo { font-size: 56px; font-weight: 900; letter-spacing: 2px; color: #7CFFB2; text-shadow: 0 0 18px rgba(72,255,160,.45); }
.title-logo span { color: #ff6b6b; }
.title-sub { color: #8fb6a3; margin-top: 8px; }
.title-glyphs { font-size: 26px; margin: 22px 0; letter-spacing: 6px; }
.title-foot { color: #5e7d6e; margin-top: 10px; font-size: 13px; }

.mute-btn { position: fixed; top: 10px; right: 10px; z-index: 60; width: 40px; height: 40px; border-radius: 50%;
  background: #12201a; color: #9fe7c1; border: 1px solid #2a4a3a; font-size: 18px; cursor: pointer; }

.big-btn {
  display: block; width: 100%; max-width: 320px; margin: 18px auto 0; padding: 14px;
  font-size: 18px; font-weight: 800; color: #07120b; background: linear-gradient(180deg,#7CFFB2,#34c878);
  border: 0; border-radius: 12px; box-shadow: 0 6px 0 #1d6b41; cursor: pointer;
}
.big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #1d6b41; }
.big-btn.retry { background: linear-gradient(180deg,#ffd479,#f0a93a); box-shadow: 0 6px 0 #9c6a14; }
.big-btn.ghost { background: #12201a; color: #9fe7c1; box-shadow: 0 6px 0 #0c1712; border: 1px solid #2a4a3a; }

.sub { font-size: 14px; color: #9fe7c1; margin: 16px 0 6px; border-bottom: 1px solid #1f3a30; padding-bottom: 4px; }
.sub small { color: #7fb89c; font-weight: 400; }

/* ブリーフィング */
.intro { background: #0f1b18; border: 1px solid #1f3a30; border-radius: 10px; padding: 12px; }
.hint { color: #9fd9bb; font-size: 13px; background: #0c1512; border-radius: 10px; padding: 10px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.card { background: #0f1620; border: 1px solid #243447; border-radius: 10px; padding: 10px; }
.card-top { display: flex; align-items: center; gap: 8px; }
.card-name { display: flex; flex-direction: column; }
.card-top b { color: #ff8a8a; }
.card-name span { font-size: 11px; color: #6f8597; }

/* スプライト共通 */
.malspr, .nodespr, .bossspr, .actspr { display: inline-block; flex: none; }
.malspr svg, .nodespr svg, .bossspr svg, .actspr svg { width: 100%; height: 100%; display: block; }
.malspr { width: 46px; height: 46px; }
.actspr { width: 30px; height: 30px; }
.nodespr { width: 48px; height: 48px; }
.nodespr.sm { width: 34px; height: 34px; }
.bossspr { width: 52px; height: 52px; }
/* 世代進化のオーラ（見た目パワーアップ） */
.malspr.evo1 { filter: drop-shadow(0 0 6px rgba(255,211,74,.8)); }
.malspr.evo2 { filter: drop-shadow(0 0 9px rgba(255,170,40,.95)) drop-shadow(0 0 3px rgba(255,255,180,.9)); }
/* 本命DBが瀕死(crit)のとき小刻みに揺れる */
.bossspr.crit { animation: hpShake .5s linear infinite; }
@keyframes hpShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-2px) rotate(-2deg)} 75%{transform:translateX(2px) rotate(2deg)} }
.card-cia { font-size: 13px; margin: 4px 0; }
.card-role { font-size: 11px; color: #7fd0ff; }
.card-waza { font-size: 12px; font-weight: 800; color: #ffd34a; margin: 4px 0 2px; text-shadow: 0 0 8px rgba(255,211,74,.4); }
.card-desc { font-size: 11px; color: #9fb3c2; margin-top: 4px; }
.evo-badge { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 6px; font-size: 11px;
  background: linear-gradient(180deg,#ffd34a,#f0a93a); color: #5a3a00; font-weight: 900; vertical-align: middle; }
.evo-btn { width: 100%; margin-top: 8px; padding: 7px; border-radius: 8px; font-size: 12px; font-weight: 800;
  background: #2a2010; color: #ffd79a; border: 1px solid #6a4a1a; cursor: pointer; }
.evo-btn:disabled { opacity: .45; cursor: not-allowed; }
.evo-btn:not(:disabled):active { transform: translateY(1px); }

/* 技カットイン バナー */
.banner {
  position: fixed; left: 0; right: 0; top: 38%; z-index: 50; text-align: center;
  pointer-events: none; animation: bannerPop 1.1s ease-out forwards;
}
.banner-name {
  display: inline-block; font-size: 30px; font-weight: 900; color: #fff;
  padding: 8px 20px; letter-spacing: 1px;
  background: linear-gradient(90deg, rgba(255,82,82,0) 0%, rgba(255,82,82,.85) 50%, rgba(255,82,82,0) 100%);
  text-shadow: 0 0 14px rgba(255,90,90,.9), 0 2px 0 #6a0d0d;
  transform: skewX(-8deg);
}
.banner-spr { width: 84px; height: 84px; margin: 0 auto 2px; animation: lunge .4s ease-out; }
.banner-spr svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 8px rgba(0,0,0,.5)); }
@keyframes lunge { 0%{transform:scale(.5) translateY(20px); opacity:0} 60%{transform:scale(1.15) translateY(-4px); opacity:1} 100%{transform:scale(1) translateY(0)} }
.banner-en { font-size: 13px; color: #ffd9d9; letter-spacing: 3px; margin-top: 4px; }
.banner-crit { font-size: 20px; font-weight: 900; color: #ffd34a; text-shadow: 0 0 12px rgba(255,211,74,.9); margin-top: 2px; }
.banner.ci .banner-name { background: linear-gradient(90deg, rgba(138,90,255,0) 0%, rgba(138,90,255,.85) 50%, rgba(138,90,255,0) 100%); text-shadow: 0 0 14px rgba(170,120,255,.9), 0 2px 0 #2a1060; }
.banner.crit .banner-name { background: linear-gradient(90deg, rgba(255,170,40,0) 0%, rgba(255,170,40,.9) 50%, rgba(255,170,40,0) 100%); }
.banner.counter .banner-name { font-size: 24px; background: linear-gradient(90deg, rgba(79,163,255,0) 0%, rgba(79,163,255,.85) 50%, rgba(79,163,255,0) 100%); text-shadow: 0 0 12px rgba(120,180,255,.9), 0 2px 0 #103a6a; }
.banner-spr.hurt { animation: hurtShake .45s ease-in-out; }
@keyframes hurtShake { 0%,100%{transform:translateX(0) rotate(0)} 20%{transform:translateX(-5px) rotate(-6deg)} 50%{transform:translateX(5px) rotate(6deg)} 80%{transform:translateX(-3px) rotate(-3deg)} }

/* 画面シェイク（被弾） */
#app.shake { animation: appShake .42s ease-in-out; }
@keyframes appShake { 0%,100%{transform:translateX(0)} 15%{transform:translateX(-7px)} 35%{transform:translateX(6px)} 55%{transform:translateX(-5px)} 75%{transform:translateX(4px)} }
@keyframes bannerPop {
  0%   { opacity: 0; transform: scale(.6); }
  18%  { opacity: 1; transform: scale(1.12); }
  30%  { transform: scale(1); }
  78%  { opacity: 1; }
  100% { opacity: 0; transform: scale(1.02); }
}

/* HUD / バー */
.hud { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.pill { font-size: 12px; padding: 5px 9px; border-radius: 999px; background: #0f1b18; border: 1px solid #244; }
.pill.turn { background: #1b1320; border-color: #5a3a6a; color: #e6b8ff; }
.bar { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; }
.bar-label { width: 64px; flex: none; }
.bar-track { flex: 1; height: 12px; background: #0b1310; border-radius: 999px; overflow: hidden; border: 1px solid #1d2c25; }
.bar-fill { display: block; height: 100%; }
.bar-fill.warn { background: linear-gradient(90deg,#f0a93a,#ff5252); }
.bar-fill.c { background: #4aa3ff; }
.bar-fill.i { background: #44d07b; }
.bar-fill.a { background: #ffd34a; }
.bar-num { width: 34px; text-align: right; flex: none; color: #b9d6c7; }

/* 経路 */
.path { display: flex; align-items: flex-start; gap: 2px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
.hop { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 6px; border-radius: 10px; border: 1px solid transparent; }
.hop small { font-size: 10px; color: #6c8a7b; white-space: nowrap; }
.hop.on { background: #12241c; border-color: #2f9e63; }
.hop.on small { color: #aef0c9; }
.hop:not(.on) .nodespr { filter: grayscale(.7) brightness(.7); }
.hop.fw small { color: #e08a7a; }
.hop-arrow { color: #5e7d6e; font-size: 16px; align-self: center; padding-top: 14px; }
.hop-arrow.open { color: #2f9e63; }

/* ボス */
.boss { background: #0e1620; border: 1px solid #2a3b50; border-radius: 12px; padding: 12px; margin: 8px 0; }
.boss-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.boss-title { font-weight: 800; color: #ff9d9d; display: flex; flex-direction: column; }
.boss-head .hv { font-size: 11px; color: #9fb3c2; font-weight: 400; }
.badge { font-size: 10px; padding: 2px 6px; border-radius: 6px; margin-left: 4px; }
.badge.ci { background: #2a1b3a; color: #e0b3ff; border: 1px solid #6a4a8a; }
.boss-foot { font-size: 11px; color: #8fb6a3; margin-top: 6px; }

/* 行動ボタン */
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.act { display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; border-radius: 10px; background: #122019; border: 1px solid #2a4a3a; color: #d6f0e0; cursor: pointer; }
.act .act-txt { display: flex; flex-direction: column; }
.act b { display: block; font-size: 13px; }
.act small { display: block; font-size: 10px; color: #8fb6a3; margin-top: 2px; }
.act:active { transform: translateY(1px); }
.act.off { opacity: .4; cursor: not-allowed; }
.act.strike { border-color: #6a4a2a; background: #1d1710; }
.act.strike b { color: #ffd34a; }
.act.card { border-color: #6a2a4a; background: #1d1018; }
.act.card b { color: #ff8ac0; }

/* 装備技カード選択 */
.equips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.equip { text-align: left; padding: 8px 10px; border-radius: 10px; background: #14101a; border: 1px solid #3a2a4a; color: #e6d0f0; cursor: pointer; }
.equip b { display: block; font-size: 12px; color: #ff8ac0; }
.equip small { display: block; font-size: 10px; color: #b39fc2; margin-top: 2px; }
.equip.on { border-color: #ff8ac0; box-shadow: 0 0 10px rgba(255,138,192,.4); background: #241430; }

/* 図鑑 */
.codex-card { background: #0f1620; border: 1px solid #243447; border-radius: 10px; padding: 10px; margin-bottom: 8px; }
.cc-top { display: flex; justify-content: space-between; align-items: baseline; }
.cc-top b { color: #ffd34a; font-size: 14px; }
.cc-gen { font-size: 11px; color: #8fb6a3; }
.cc-en { font-size: 11px; color: #7fd0ff; margin: 3px 0; }
.cc-desc { font-size: 12px; color: #cfe9d8; }
.cc-def { font-size: 12px; color: #9fe7c1; margin-top: 4px; background: #0c1512; border-radius: 6px; padding: 5px 7px; }

/* ログ */
.logbox { background: #080d0b; border: 1px solid #1a2620; border-radius: 10px; padding: 8px; font-size: 11px; color: #9fcbb3; max-height: 130px; overflow: auto; }
.logbox div { padding: 1px 0; border-bottom: 1px dashed #16221c; }

/* リザルト */
.verdict { font-size: 28px; font-weight: 900; text-align: center; margin: 12px 0; }
.verdict.win { color: #7CFFB2; text-shadow: 0 0 16px rgba(72,255,160,.5); }
.verdict.lose { color: #ff6b6b; }
.stat { text-align: center; color: #9fb3c2; font-size: 13px; }
.reward { text-align: center; color: #ffd79a; font-size: 13px; margin-top: 10px; background: #1f1808; border: 1px solid #6a4a1a; border-radius: 8px; padding: 8px; }
.debrief { background: #0f1b18; border: 1px solid #2f4a3c; border-radius: 10px; padding: 12px; margin-top: 14px; }
.debrief b { color: #7fd0ff; }
.debrief p { margin: 6px 0 0; font-size: 13px; }
.result-btns { margin-top: 18px; }

</style>
</head>
<body>
<div id="app">

  <button id="btn-mute" class="mute-btn" aria-label="おと">🔊</button>

  <!-- タイトル -->
  <section id="title-screen" class="screen active">
    <div class="title-wrap">
      <div class="title-logo">マル<span>これ</span></div>
      <div class="title-sub">マルウェアコレクション — 攻めて学ぶセキュリティ</div>
      <div class="title-glyphs">🦠 🛡️ ⚔️ 📡 🧬</div>
      <button id="btn-start" class="big-btn">▶ はじめる</button>
      <button id="btn-codex" class="big-btn ghost">📖 技図鑑</button>
      <div class="title-foot">攻撃を遊んで、防御に活かす。</div>
    </div>
  </section>

  <!-- 技図鑑 -->
  <section id="codex-screen" class="screen">
    <h1 class="screen-title">📖 技図鑑（攻撃手法 × 対策）</h1>
    <div id="codex-body"></div>
    <button id="btn-codex-back" class="big-btn">← タイトルへ</button>
  </section>

  <!-- 作戦ブリーフィング -->
  <section id="briefing-screen" class="screen">
    <h1 class="screen-title">作戦: ゼニス銀行</h1>
    <div id="briefing-body"></div>
    <button id="btn-sortie" class="big-btn">🦠 出撃</button>
  </section>

  <!-- 戦闘 -->
  <section id="battle-screen" class="screen">
    <div id="battle-root"><!-- core.js が描画 --></div>
  </section>

  <!-- リザルト -->
  <section id="result-screen" class="screen">
    <h1 class="screen-title">作戦結果</h1>
    <div id="result-body"></div>
    <div class="result-btns">
      <button id="btn-retry" class="big-btn retry">🔁 編成・進化へ</button>
      <button id="btn-title" class="big-btn">タイトルへ</button>
    </div>
  </section>

</div>
<script>

/* ===== src/data/malware.js ===== */
/* data/malware.js — マルこれ 世代0マルウェア（MVP用の初期編成サブセット）
   C/I/A攻撃力・ロールは docs/MALCORE_BALANCE.md §7 準拠。
   ※挙動の抽象表現。実コード・悪用手順は含まない（docs/MALCORE_CONCEPT.md §2）。 */
const MAL = [
  {
    id: 'zeus', name: 'Zeus/Zbot', year: 2007, gen: 0,
    C: 95, I: 45, A: 15,
    role: '撃破(C特化)', sub: '偵察', recon: true, breaker: false,
    desc: 'バンキング型トロイ。認証情報を窃取し機密性(🔵)を一気に抜く本命撃破役。',
    waza: { name: 'マン・イン・ザ・ブラウザ！！', en: 'Man-in-the-Browser', gauge: 'C',
            defense: 'MFAと取引署名で、単独の認証情報漏えいを無効化する。' },
  },
  {
    id: 'iloveyou', name: 'ILOVEYOU', year: 2000, gen: 0,
    C: 55, I: 85, A: 60,
    role: '撃破(I)', sub: '侵入', recon: false, breaker: false,
    desc: 'メール感染ワーム。ファイルを上書き破壊し完全性(🟢)を激しく削る。',
    waza: { name: 'メールワーム・オーバーライト！！', en: 'Mail Worm Overwrite', gauge: 'I',
            defense: '添付スクリプトの実行制限と、重要データのバックアップ。' },
  },
  {
    id: 'mydoom', name: 'MyDoom', year: 2004, gen: 0,
    C: 55, I: 25, A: 85,
    role: '足場/ボット', sub: '撃破(A)', recon: false, breaker: false,
    desc: 'バックドアを開き踏み台をボット化。可用性(🟡)も高い。',
    waza: { name: 'ボットネット・コンスクリプション！！', en: 'Botnet Conscription', gauge: 'A',
            defense: '外向き接続と開放ポートの監視（egress filtering）。' },
  },
  {
    id: 'blaster', name: 'Blaster', year: 2003, gen: 0,
    C: 10, I: 25, A: 85,
    role: '撃破(A)', sub: '装置破壊', recon: false, breaker: true,
    desc: 'RPC型ワーム。機器をクラッシュさせ防御装置(境界FW等)を破壊できる。',
    waza: { name: 'バッファ・オーバーフロー！！', en: 'Buffer Overflow', gauge: 'A',
            defense: 'パッチ適用とDEP/ASLR、RPCポートの遮断。' },
  },
];

function malById(id) { return MAL.find(m => m.id === id) || null; }

if (typeof globalThis !== 'undefined') { globalThis.MAL = MAL; globalThis.malById = malById; }


/* ===== src/data/cards.js ===== */
/* data/cards.js — マルこれ 攻撃手法カード（装備技）
   docs/MALCORE_SKILLS.md の技ロスターを装備技として実装。
   ・gauge: 主に削るゲージ（緩和の噛み合いにも使う）
   ・cia:   ダメージ配分（基礎攻撃力）。複数ゲージ技はここで表現
   ・cost:  装備技の発動コスト（情報/技術/資源）
   ・special: 'ignoreH'=ハードニング無視（ゼロデイ）
   ・defense: 防御官の対策解説（攻撃＝防御学習の原則）
   ※挙動の抽象表現。実コード・悪用手順は含まない。 */
const CARDS = [
  // 🔵 機密性(C)
  { id: 'sqli', name: 'SQL・インジェクション', en: 'SQL Injection', gauge: 'C',
    cia: { C: 70 }, type: '窃取', tactic: 'OWASP A03', gen: 0, cost: { info: 10 }, special: null,
    desc: '入力の隙からDBへ問い合わせを注入し、情報を吸い出す。',
    defense: 'プレースホルダ(プリペアドステートメント)と入力検証で遮断する。' },
  { id: 'xss', name: 'クロスサイト・スクリプティング', en: 'XSS', gauge: 'C',
    cia: { C: 50 }, type: '窃取', tactic: 'OWASP A03', gen: 0, cost: { info: 5 }, special: null,
    desc: 'ページにスクリプトを紛れ込ませ、セッションを奪う。',
    defense: '出力エンコードとCSPでスクリプト実行を封じる。' },
  { id: 'traversal', name: 'ディレクトリ・トラバーサル', en: 'Directory Traversal', gauge: 'C',
    cia: { C: 55 }, type: '窃取', tactic: 'OWASP A01', gen: 0, cost: { info: 5 }, special: null,
    desc: '範囲外のパスを辿り、機密ファイルを読み出す。',
    defense: 'パス正規化と最小権限、公開ディレクトリの限定。' },
  { id: 'kerberoast', name: 'ケルベロースティング', en: 'Kerberoasting', gauge: 'C',
    cia: { C: 75 }, type: '認証', tactic: 'ATT&CK Credential Access', gen: 2, cost: { info: 10, tech: 5 }, special: null,
    desc: 'サービスチケットを要求し、資格情報をオフラインで解く。',
    defense: '強い鍵とサービスアカウント監査、異常検知。' },
  // 🟢 完全性(I)
  { id: 'csrf', name: 'クロスサイト・リクエスト・フォージェリ', en: 'CSRF', gauge: 'I',
    cia: { I: 55 }, type: '改ざん', tactic: 'OWASP', gen: 0, cost: { tech: 5 }, special: null,
    desc: '正規ユーザーになりすました操作を強制する。',
    defense: 'CSRFトークンとSameSite Cookieで正規性を担保。' },
  { id: 'deserialize', name: 'インセキュア・デシリアライゼーション', en: 'Insecure Deserialization', gauge: 'I',
    cia: { I: 70 }, type: '改ざん', tactic: 'OWASP A08', gen: 2, cost: { tech: 10 }, special: null,
    desc: '信頼できないデータの復元を悪用し、処理を歪める。',
    defense: '署名検証と型の許可リスト、復元対象の限定。' },
  { id: 'webshell', name: 'ウェブシェル・インプラント', en: 'Web Shell', gauge: 'I',
    cia: { I: 50, C: 20 }, type: '改ざん', tactic: 'ATT&CK Persistence', gen: 1, cost: { tech: 5, info: 5 }, special: null,
    desc: '改ざん拠点を植え付け、遠隔から操作する。',

/* audio/sound.js — マルこれ おとエンジン（Web Audio 合成のみ）
   公開API:
     Sound.unlock()                初回タッチで AudioContext 生成/再開
     Sound.setMuted(bool)/isMuted()
     Sound.play(name)              'select'|'strike'|'crit'|'cutin'|'win'|'lose'|'warn'
   ・外部音源ファイル禁止。合成のみ。muted時/未対応時は no-op（ヘッドレス安全）。
   ・トップレベルで AudioContext を即生成しない。 */
const Sound = (() => {
  let ac = null, master = null, bgmGain = null, muted = false, unsupported = false;
  let bgmTimer = null, bstep = 0, btime = 0;

  function ctx() {
    if (ac) return ac;
    if (unsupported) return null;
    try {
      const AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
      if (!AC) { unsupported = true; return null; }
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -12; comp.knee.value = 16; comp.ratio.value = 14;
      comp.attack.value = 0.003; comp.release.value = 0.25; comp.connect(ac.destination);
      master = ac.createGain(); master.gain.value = 0.55; master.connect(comp);
      bgmGain = ac.createGain(); bgmGain.gain.value = muted ? 0 : 0.42; bgmGain.connect(master);
    } catch (e) { unsupported = true; ac = null; return null; }
    return ac;
  }

  function resume(a) { try { if (a && a.state === 'suspended' && a.resume) a.resume(); } catch (e) {} }

  function unlock() {
    const a = ctx(); if (!a) return; resume(a);
    try {
      const b = a.createBuffer(1, 1, 22050); const s = a.createBufferSource();
      s.buffer = b; s.connect(a.destination); (s.start ? s.start(0) : s.noteOn && s.noteOn(0));
    } catch (e) {}
    resume(a);

  /* ---- 1音（発振器→ゲインのエンベロープ）---- */
  function tone(opt) {
    const a = ctx(); if (!a || muted) return;
    resume(a);
    const t0 = a.currentTime + (opt.delay || 0);
    const o = a.createOscillator(), g = a.createGain();

    const peak = opt.gain != null ? opt.gain : 0.5;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + opt.dur);

        if (inBar % 4 === 0) bkick(btime);                                   // 四つ打ちキック
        if (inBar % 2 === 1) bhat(btime, inBar % 8 === 7 ? 0.18 : 0.10);     // オフビートのハット
        if (inBar % 2 === 0) bvoice('sawtooth', mtof(roots[ci] + (inBar % 8 === 0 ? 0 : 12)), btime, STEP * 1.4, 0.30); // ベース
        if (bar % 8 >= 4) bvoice('square', mtof(chords[ci][inBar % 3] + 12), btime, STEP * 0.8, 0.12); // 後半でアルペジオ
        if (inBar === 0) chords[ci].forEach(m => bvoice('triangle', mtof(m), btime, STEP * 14, 0.045)); // 小節頭のパッド
      }
      btime += STEP; bstep++;
    }
  }

  const SFX = {
    select() { tone({ type: 'square', f0: 520, f1: 700, dur: 0.07, gain: 0.25 }); },
    hit() { noise(0.10, 0.4); tone({ type: 'sine', f0: 120, f1: 48, dur: 0.16, gain: 0.4 }); }, // 被弾
    strike() { // 必殺技ヒット: 下降ズァッ＋ノイズの芯
      noise(0.12, 0.35);
      tone({ type: 'sawtooth', f0: 320, f1: 80, dur: 0.18, gain: 0.45 });
    },
    crit() { // 会心: ヒット＋上昇キラッ
      SFX.strike();
      tone({ type: 'square', f0: 880, f1: 1760, dur: 0.16, gain: 0.32, delay: 0.05 });
      tone({ type: 'triangle', f0: 1320, f1: 2200, dur: 0.14, gain: 0.22, delay: 0.10 });
    },
    cutin() { // カットイン発動: 上昇スイープ
      tone({ type: 'sawtooth', f0: 200, f1: 1200, dur: 0.22, gain: 0.3 });
    },
    warn() { tone({ type: 'square', f0: 300, f1: 160, dur: 0.18, gain: 0.3 }); },
    win() { // 勝利: 上昇アルペジオ
      [523, 659, 784, 1047].forEach((f, i) => tone({ type: 'triangle', f0: f, dur: 0.22, gain: 0.3, delay: i * 0.12 }));
    },
    lose() { // 敗北: 下降
      [392, 311, 247].forEach((f, i) => tone({ type: 'sawtooth', f0: f, f1: f * 0.7, dur: 0.3, gain: 0.3, delay: i * 0.16 }));
    },
  };

  function play(name) { try { (SFX[name] || (() => {}))(); } catch (e) {} }

  function bgm() {
    const a = ctx(); if (!a) return; resume(a);
    if (bgmTimer) return;                 // 多重再生しない
    bstep = 0; btime = a.currentTime + 0.1;
    try { bgmSchedule(); bgmTimer = setInterval(bgmSchedule, 25); } catch (e) {}
  }
  function stopBgm() { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }

  return {
    unlock,
    setMuted(b) { muted = !!b; if (bgmGain) bgmGain.gain.value = muted ? 0 : 0.42; },
    isMuted() { return muted; },
    play, bgm, stopBgm,
  };
})();

if (typeof globalThis !== 'undefined') globalThis.Sound = Sound;


/* ===== src/game/core.js ===== */
/* game/core.js — マルこれ MVP コアエンジン
   ・前半: 純粋ロジック（DOM非依存・テスト可能）
   ・後半: UI（document があるときだけ動く）
   ダメージ式・綱引き・監査・ターン制限は docs/MALCORE_BALANCE.md / MALCORE_STAGE_MODEL.md 準拠。 */

/* ===== 乱数（テストで差し替え可能） ===== */
let _rng = Math.random;
function setRng(fn) { _rng = fn; }

/* ===== ゲーム状態生成 ===== */
function createGame(stage, equipped, levels) {
  const db = stage.nodes.db;
  return {
    stage,
    turn: 1,
    maxTurn: stage.turnLimit,
    warning: 0,
    res: { info: 40, tech: 20, res: 20 }, // 初期資源
    hand: ['zeus', 'iloveyou', 'mydoom', 'blaster'],
    levels: levels || {},               // 世代進化レベル（id→0..2）
    equipped: (equipped || []).slice(0, 3), // 装備した攻撃手法カード（最大3）
    footholds: { outside: true, pc: false, db: false },
    botnet: false,    // 踏み台をボット化したか（A火力+10%）
    fwOpen: false,    // 境界FWを開通したか
    reconDone: false, // 本命を偵察したか
    diagDone: false,  // ブルーのセキュリティ診断が発動済みか
    cut: { hHack: 0, vDiag: 0 }, // カットイン残ターン
    db: {
      C: db.C, I: db.I, A: db.A,
      baseH: db.H, baseV: db.V, mit: db.mit,
      initTotal: db.C + db.I + db.A,
    },
    log: ['◆ 出撃: ' + stage.name + '（制限 ' + stage.turnLimit + 'T）'],
    result: null, // null | 'win' | 'lose_turn' | 'lose_warn'
  };
}

/* ===== 実効ステータス（カットイン込み） ===== */
function effH(g) { return Math.max(0, Math.min(100, g.db.baseH - (g.cut.hHack > 0 ? 20 : 0))); }
function effV(g) { return Math.max(0, Math.min(100, g.db.baseV + (g.cut.vDiag > 0 ? 25 : 0))); }

/* ===== 資源コスト ===== */
function canAfford(g, cost) {
  if (!cost) return true;
  return (g.res.info >= (cost.info || 0)) && (g.res.tech >= (cost.tech || 0)) && (g.res.res >= (cost.res || 0));
}
function payCost(g, cost) {
  if (!cost) return;
  g.res.info -= (cost.info || 0); g.res.tech -= (cost.tech || 0); g.res.res -= (cost.res || 0);
}
function costLabel(cost) {
  if (!cost) return '';
  const p = [];
  if (cost.info) p.push('情報' + cost.info);
  if (cost.tech) p.push('技術' + cost.tech);
  if (cost.res) p.push('資源' + cost.res);
  return p.join('/');
}

/* ===== ダメージ計算（1ゲージ分） ===== */
function gaugeDamage(g, base, gauge, opt) {
  opt = opt || {};
  const H = opt.ignoreH ? 0 : effH(g); // ゼロデイ等はハードニング無視
  const V = effV(g);
  const defMul = 0.5 + H / 100;
  const mit = Math.min(0.80, (g.db.mit[gauge] || 0) * defMul);
  const hit = 0.6 + (V / 100) * 0.8;
  const crit = _rng() < V / 100 ? 1.5 : 1.0;
  return { dmg: base * (1 - mit) * hit * crit, crit: crit > 1 };
}

/* ===== 世代進化 ===== */
const EVO_MAX = 2;
const EVO_SUFFIX = ['', '・改', '・改弐'];
function evoMul(level) { return 1 + 0.25 * (level || 0); }        // Lv0=1.0 / Lv1=1.25 / Lv2=1.5
function evoCost(level) { return level <= 0 ? 2 : 3; }            // 次の世代への開発Pコスト
function malStats(m, level) {
  const k = evoMul(level);
  return { C: Math.round(m.C * k), I: Math.round(m.I * k), A: Math.round(m.A * k) };
}
function wazaName(m, level) {
  const base = (m.waza ? m.waza.name : m.name).replace(/！+$/, '');
  return base + (EVO_SUFFIX[level] || '') + '！！';
}

/* ===== 撃破の共通処理（マルウェア・カード共用） =====
   cia: {C,I,A} の基礎攻撃力。opt.ignoreH / opt.botnet(可用性ボーナス) */
function resolveStrike(g, cia, opt) {
  opt = opt || {};
  const aBonus = opt.botnet ? 1.10 : 1.0;
  const rc = gaugeDamage(g, cia.C || 0, 'C', opt);
  const ri = gaugeDamage(g, cia.I || 0, 'I', opt);
  const ra = gaugeDamage(g, (cia.A || 0) * aBonus, 'A', opt);
  g.db.C = Math.max(0, g.db.C - rc.dmg);
  g.db.I = Math.max(0, g.db.I - ri.dmg);
  g.db.A = Math.max(0, g.db.A - ra.dmg);
  // 戦利品（削った量に応じて資源獲得）
  g.res.info += Math.floor(rc.dmg / 10);
  g.res.tech += Math.floor(ri.dmg / 10);
  g.res.res += Math.floor(ra.dmg / 10);
  return { rc, ri, ra, crit: (rc.crit || ri.crit || ra.crit) };
}

/* ===== 行動一覧（状態に応じて可否を返す） ===== */
function listActions(g) {
  if (g.result) return [];
  const f = g.footholds, A = [];
  const can = (id, label, ok, reason, hint) => A.push({ id, label, enabled: ok, reason, hint });

  can('recon', '🔍 偵察（本命）', !g.reconDone, '偵察済み',
      '本命の防御を開示。偵察カットインの前提。 W+2');
  can('breach', '🚪 初期侵害（社員PC）', !f.pc, '侵害済み',
      'フィッシングで踏み台に足場確立。 W+5');
  can('botnet', '🏴 ボット化（社員PC）', f.pc && !g.botnet, f.pc ? '実施済み' : '踏み台が必要',
      '踏み台をボット化。可用性火力+10%。 W+5');
  can('fw_evade', '🌫️ 境界FWを回避', f.pc && !g.fwOpen && g.res.info >= 15, f.pc ? (g.fwOpen ? '開通済み' : '情報15が必要') : '踏み台が必要',
      '正規経路に偽装して通す。情報-15 / W+2');
  const hasBreaker = g.hand.some(id => (malById(id) || {}).breaker);
  can('fw_break', '💥 境界FWを破壊', f.pc && !g.fwOpen && hasBreaker, f.pc ? (g.fwOpen ? '開通済み' : '装置破壊ロールが必要') : '踏み台が必要',
      '装置破壊ロールで強行突破。 W+25（派手）');
  can('pivot', '↔️ 横展開 → 本命DB', f.pc && g.fwOpen && !f.db, f.db ? '到達済み' : (g.fwOpen ? '踏み台が必要' : '境界FWが閉'),
      '本命へ到達。 W+5');
  can('ci_recon', '🛠️ 偵察カットイン（H -20/3T）', g.reconDone && g.res.info >= 20, g.reconDone ? '情報20が必要' : '先に偵察が必要',
      'ハードニングを下げ通りやすくする。情報-20 / W+5');
  can('ci_diag', '🧪 診断カットイン（V +25/3T）', g.res.tech >= 15, '技術15が必要',
      '脆弱性を露出させ命中・会心UP。技術-15 / W+5');

  // 撃破（本命に到達後、手持ちのマルウェア固有技ごと。世代進化を反映）
  g.hand.forEach(id => {
    const m = malById(id);
    const L = (g.levels && g.levels[id]) || 0;
    const s = malStats(m, L);
    const tag = L > 0 ? EVO_SUFFIX[L].replace('・', '') + ' ' : '';
    can('strike:' + id, '⚔️ ' + tag + (m.waza ? m.waza.name.replace(/！+$/, '') : m.name), f.db, '本命未到達',
        'C' + s.C + '/I' + s.I + '/A' + s.A + ' で攻撃。 W+10');
  });
  // 装備技カード（本命到達後・資源を満たすとき）
  (g.equipped || []).forEach(id => {
    const c = cardById(id); if (!c) return;
    const ok = f.db && canAfford(g, c.cost);
    const reason = !f.db ? '本命未到達' : '資源不足(' + costLabel(c.cost) + ')';
    const cia = c.cia || {};
    can('card:' + id, '🃏 ' + c.name, ok, reason,
        'C' + (cia.C || 0) + '/I' + (cia.I || 0) + '/A' + (cia.A || 0) +
        (c.special === 'ignoreH' ? ' 貫通' : '') + ' ' + costLabel(c.cost) + ' W+8');
  });
  return A;
}

/* ===== 行動の適用 ===== */
function applyAction(g, actionId) {
  if (g.result) return { ok: false, msg: '決着済み' };
  const valid = listActions(g).find(a => a.id === actionId && a.enabled);
  if (!valid) return { ok: false, msg: 'その行動は今できない' };

  g.counter = null; // ブルー反撃（被弾）フラグ。endTurnで立つ
  let warn = 0, msg = '';
  if (actionId === 'recon') {
    g.reconDone = true; warn = 2;
    msg = '偵察完了: 本命 H' + g.db.baseH + ' / V' + g.db.baseV + '（機密性が厚い）';
  } else if (actionId === 'breach') {
    g.footholds.pc = true; warn = 5; msg = 'フィッシング成功: 社員PCに足場を確立';
  } else if (actionId === 'botnet') {
    g.botnet = true; warn = 5; msg = '社員PCをボット化: 可用性火力 +10%';
  } else if (actionId === 'fw_evade') {
    g.fwOpen = true; g.res.info -= 15; warn = 2; msg = '境界FWを回避: 正規経路に偽装して通過';
  } else if (actionId === 'fw_break') {
    g.fwOpen = true; warn = 25; msg = '境界FWを破壊: 経路は開いたが警戒度が跳ね上がった';
  } else if (actionId === 'pivot') {
    g.footholds.db = true; warn = 5; msg = '横展開成功: 本命「勘定系DB」へ到達';
  } else if (actionId === 'ci_recon') {
    g.cut.hHack = 3; g.res.info -= 20; warn = 5; msg = '🛠️ 偵察カットイン発動! ハードニング -20（3T）';
    g.banner = { name: 'ポート・スキャン！', en: 'Port Scan', tone: 'ci' };
  } else if (actionId === 'ci_diag') {
    g.cut.vDiag = 3; g.res.tech -= 15; warn = 5; msg = '🧪 診断カットイン発動! 脆弱性 +25（3T）';
    g.banner = { name: 'ヴァルナラビリティ・スキャン！', en: 'Vulnerability Scan', tone: 'ci' };
  } else if (actionId.startsWith('strike:')) {
    const id = actionId.slice(7);
    const m = malById(id);
    const L = (g.levels && g.levels[id]) || 0;
    const s = malStats(m, L);
    const r = resolveStrike(g, s, { botnet: g.botnet });
    warn = 10;
    const w = m.waza || { name: m.name, en: '', gauge: 'C' };
    const nm = wazaName(m, L);
    // 技名カットイン演出（攻撃名を必殺技として表示・攻撃表情のキャラつき）
    g.banner = { name: nm, en: w.en, tone: 'strike', gauge: w.gauge, crit: r.crit,
                 defense: w.defense, sprId: id, gen: L };
    msg = '⚡ ' + nm + (r.crit ? ' 会心!' : '') + ' 🔵-' + Math.round(r.rc.dmg) +
          ' 🟢-' + Math.round(r.ri.dmg) + ' 🟡-' + Math.round(r.ra.dmg);
  } else if (actionId.startsWith('card:')) {
    const c = cardById(actionId.slice(5));
    payCost(g, c.cost);
    const r = resolveStrike(g, c.cia || {}, { botnet: g.botnet, ignoreH: c.special === 'ignoreH' });
    warn = 8;
    g.banner = { name: c.name + '！', en: c.en, tone: 'strike', gauge: c.gauge, crit: r.crit, defense: c.defense };
    msg = '🃏 ' + c.name + (r.crit ? ' 会心!' : '') + ' 🔵-' + Math.round(r.rc.dmg) +
          ' 🟢-' + Math.round(r.ri.dmg) + ' 🟡-' + Math.round(r.ra.dmg);
  }

  g.warning = Math.min(100, g.warning + warn);
  g.log.push('T' + g.turn + '  ' + msg);
  endTurn(g);
  return { ok: true, msg };
}

/* ===== ターン終了処理（監査・診断・カットイン減衰・判定） ===== */
function endTurn(g) {
  // カットイン残ターン減衰
  if (g.cut.hHack > 0) g.cut.hHack--;
  if (g.cut.vDiag > 0) g.cut.vDiag--;

  // ブルー: システム監査（一定ターン毎にH↑）
  if (g.turn % g.stage.audit.every === 0) {
    g.db.baseH = Math.min(100, g.db.baseH + g.stage.audit.hardenUp);
    g.log.push('T' + g.turn + '  🔵 システム監査: ハードニング +' + g.stage.audit.hardenUp + '（→' + g.db.baseH + '）');
    g.counter = { kind: 'audit', label: 'システム監査 H+' + g.stage.audit.hardenUp };
  }
  // ブルー: セキュリティ診断（警戒度が閾値超えで一度だけV↓）
  if (!g.diagDone && g.warning >= g.stage.diag.warnThreshold) {
    g.db.baseV = Math.max(0, g.db.baseV - g.stage.diag.vulnDown);
    g.diagDone = true;
    g.log.push('T' + g.turn + '  🔵 セキュリティ診断: 脆弱性 -' + g.stage.diag.vulnDown + '（→' + g.db.baseV + '）');
    g.counter = { kind: 'diag', label: 'セキュリティ診断 V-' + g.stage.diag.vulnDown };
  }

  checkEnd(g);
  if (!g.result) g.turn++;
}

/* ===== 勝敗判定 ===== */
function checkEnd(g) {
  const total = g.db.C + g.db.I + g.db.A;
  if (total <= g.db.initTotal * g.stage.win.ratio) { g.result = 'win'; return; }
  if (g.warning >= 100) { g.result = 'lose_warn'; return; }
  if (g.turn >= g.maxTurn) { g.result = 'lose_turn'; return; }
}

/* ===== 防御官の総評（攻撃と対策はセット、という学び） ===== */
function debrief(g) {
  if (g.result === 'win') {
    return '攻略成功。だが現実なら——機密性を抜かれたのは多要素認証と取引の異常検知が甘かったから。' +
           'カットイン（偵察・診断）に崩されたのは、攻撃者に弱点を先に診断され尽くした証だ。';
  }
  if (g.result === 'lose_turn') {
    return 'タイムオーバー。ブルーチームの封じ込めが間に合った。' +
           '＝ネットワーク分離とログ監視で攻撃者の滞留時間を稼ぎ、素早く追い出した防御の勝利だ。';
  }
  return '警戒度MAXで足場を一斉駆除された。派手に動きすぎ＝EDR/IDSに検知された。静かな攻撃ほど怖い、という教訓だ。';
}

/* ===== エクスポート（テスト/UI共用） ===== */
const MALCORE = {
  createGame, listActions, applyAction, endTurn, checkEnd,
  effH, effV, gaugeDamage, resolveStrike, canAfford, debrief, setRng,
  malStats, wazaName, evoCost, evoMul, EVO_MAX,
  STAGE: (typeof STAGE_ZENITH !== 'undefined') ? STAGE_ZENITH : null,
  CARDS: (typeof CARDS !== 'undefined') ? CARDS : [],
};
if (typeof globalThis !== 'undefined') globalThis.MALCORE = MALCORE;

/* =======================================================================
   UI 層（document があるときだけ）
   ======================================================================= */
if (typeof document !== 'undefined' && document.getElementById) {
  let G = null;

  const $ = (id) => document.getElementById(id);
  const show = (id) => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  };

  function bar(label, val, max, cls) {
    const pct = Math.max(0, Math.min(100, (val / max) * 100));
    return '<div class="bar"><span class="bar-label">' + label + '</span>' +
      '<span class="bar-track"><i class="bar-fill ' + cls + '" style="width:' + pct + '%"></i></span>' +
      '<span class="bar-num">' + Math.round(val) + '</span></div>';
  }

  function renderBattle() {
    const g = G, d = g.db;
    const dbState = (function () {
      const r = (d.C + d.I + d.A) / d.initTotal;
      return r > 0.66 ? 'ok' : (r > 0.33 ? 'hurt' : 'crit');
    })();
    const hops = g.stage.path.map((n, i) => {
      const reached = n === 'outside' ? true : g.footholds[n];
      const nm = n === 'outside' ? '外部' : g.stage.nodes[n].name.split('（')[0];
      const sprOpt = n === 'db' ? { state: dbState } : undefined;
      const hop = '<span class="hop ' + (reached ? 'on' : '') + '">' +
        '<span class="nodespr">' + SPRITES.node(n === 'outside' ? 'outside' : n, sprOpt) + '</span>' +
        '<small>' + nm + '</small></span>';
      if (i === g.stage.path.length - 1) return hop;
      const next = g.stage.path[i + 1];
      // pc → db の間に境界FW装置（開通=通路 / 閉鎖=FWアイコン）
      if (next === 'db') {
        const dev = g.fwOpen
          ? '<span class="hop-arrow open">▶</span>'
          : '<span class="hop fw"><span class="nodespr sm">' + SPRITES.node('fw') + '</span><small>境界FW</small></span>';
        return hop + dev;
      }
      return hop + '<span class="hop-arrow">▶</span>';
    }).join('');
    const pathHtml = hops;

    const cutBadges =
      (g.cut.hHack > 0 ? '<span class="badge ci">🛠️H-20(' + g.cut.hHack + 'T)</span>' : '') +
      (g.cut.vDiag > 0 ? '<span class="badge ci">🧪V+25(' + g.cut.vDiag + 'T)</span>' : '');

    const acts = listActions(g).map(a => {
      const kind = a.id.startsWith('card:') ? ' card' : (a.id.startsWith('strike:') ? ' strike' : '');
      const spr = a.id.startsWith('strike:')
        ? '<span class="actspr">' + SPRITES.mal(a.id.slice(7), { gen: (g.levels && g.levels[a.id.slice(7)]) || 0 }) + '</span>' : '';
      return '<button class="act' + kind + ' ' + (a.enabled ? '' : 'off') + '" data-act="' + a.id + '" ' +
        (a.enabled ? '' : 'disabled title="' + a.reason + '"') + '>' +
        spr + '<span class="act-txt"><b>' + a.label + '</b><small>' + (a.enabled ? a.hint : a.reason) + '</small></span></button>';
    }).join('');

    $('battle-root').innerHTML =
      '<div class="hud">' +
        '<span class="pill turn">⏳ T ' + g.turn + ' / ' + g.maxTurn + '</span>' +
        '<span class="pill info">📡 情報 ' + g.res.info + '</span>' +
        '<span class="pill tech">🧬 技術 ' + g.res.tech + '</span>' +
        '<span class="pill resr">⚙️ 資源 ' + g.res.res + '</span>' +
      '</div>' +
      bar('🚨 警戒度', g.warning, 100, 'warn') +
      '<div class="path">' + pathHtml + '</div>' +
      '<div class="boss">' +
        '<div class="boss-head"><span class="bossspr ' + dbState + '">' + SPRITES.node('db', { state: dbState }) + '</span>' +
          '<span class="boss-title">★ ' + g.stage.nodes.db.name +
          '<span class="hv">H ' + effH(g) + ' / V ' + effV(g) + ' ' + cutBadges + '</span></span></div>' +
        bar('🔵 機密性', d.C, 160, 'c') +
        bar('🟢 完全性', d.I, 100, 'i') +
        bar('🟡 可用性', d.A, 100, 'a') +
        '<div class="boss-foot">勝利: CIA合計を ' + Math.round(d.initTotal * g.stage.win.ratio) +
          ' 以下に（現在 ' + Math.round(d.C + d.I + d.A) + '）</div>' +
      '</div>' +
      '<div class="acts">' + acts + '</div>' +
      '<div class="logbox">' + g.log.slice(-6).reverse().map(l => '<div>' + l + '</div>').join('') + '</div>';

    $('battle-root').querySelectorAll('.act:not(.off)').forEach(b =>
      b.addEventListener('click', () => {
        Sound.unlock();
        const act = b.dataset.act;
        // 撃破/カード/カットインは banner 側で音が出る。移動系だけ select 音。
        if (!/^(strike:|card:|ci_)/.test(act)) Sound.play('select');
        applyAction(G, act); afterAction();
      }));
  }

  function popBanner(b) {
    // 連続発動で重ならないよう、既存バナーを消してから出す
    document.querySelectorAll('.banner').forEach(e => e.remove());
    const el = document.createElement('div');
    el.className = 'banner ' + (b.tone || '') + (b.crit ? ' crit' : '');
    const spr = b.sprId ? '<div class="banner-spr">' + SPRITES.mal(b.sprId, { expr: 'attack', gen: b.gen || 0 }) + '</div>' : '';
    el.innerHTML = spr +
      '<div class="banner-name">⚡ ' + b.name + '</div>' +
      (b.en ? '<div class="banner-en">' + b.en + '</div>' : '') +
      (b.crit ? '<div class="banner-crit">会心!</div>' : '');
    $('app').appendChild(el);
    Sound.play(b.tone === 'ci' ? 'cutin' : (b.crit ? 'crit' : 'strike'));
    setTimeout(() => el.remove(), 1100);
  }

  function popCounter(c) {
    // ブルーチーム反撃＝こちらの被弾。やられ顔のキャラ＋画面シェイク＋効果音。
    document.querySelectorAll('.banner').forEach(e => e.remove());
    const id = G.hand[(G.turn + 1) % G.hand.length];
    const el = document.createElement('div');
    el.className = 'banner counter';
    el.innerHTML =
      '<div class="banner-spr hurt">' + SPRITES.mal(id, { expr: 'hurt', gen: (G.levels && G.levels[id]) || 0 }) + '</div>' +
      '<div class="banner-name">🛡️ ブルーチーム反撃！</div>' +
      '<div class="banner-en">' + c.label + '</div>';
    $('app').appendChild(el);
    const app = $('app'); app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');
    Sound.play('hit');
    setTimeout(() => el.remove(), 1200);
  }

  function afterAction() {
    if (G.banner) { popBanner(G.banner); G.banner = null; }
    const counter = G.counter; G.counter = null;
    if (G.result) {
      Sound.stopBgm();
      Sound.play(G.result === 'win' ? 'win' : 'lose');
      return renderResult();
    }
    renderBattle();
    if (counter) setTimeout(() => popCounter(counter), 720); // 行動バナーの後に被弾演出
  }

  function renderResult() {
    show('result-screen');
    const win = G.result === 'win';
    let reward = '';
    if (win) { // 勝利で開発P獲得（次の進化資金）
      devP += 3; saveJSON('malcore.devP', devP);
      reward = '<div class="reward">🛠️ 開発P +3（所持 ' + devP + '）— ブリーフィングで世代進化に使える</div>';
    }
    $('result-body').innerHTML =
      '<div class="verdict ' + (win ? 'win' : 'lose') + '">' +
        (win ? '🏆 攻略成功' : (G.result === 'lose_turn' ? '⏳ タイムオーバー' : '🚨 駆除された')) + '</div>' +
      '<div class="stat">残りCIA合計 ' + Math.round(G.db.C + G.db.I + G.db.A) +
        ' ／ 使用 ' + (G.turn) + 'T ／ 警戒度 ' + G.warning + '</div>' +
      reward +
      '<div class="debrief"><b>防御官の総評</b><p>' + debrief(G) + '</p></div>';
  }

  let equipped = []; // 装備中の攻撃手法カード（最大3）

  // 世代進化の永続状態（localStorage、無ければデモ用に開発P=4で開始）
  let levels = loadJSON('malcore.levels', {});
  let devP = loadJSON('malcore.devP', 4);
  function loadJSON(key, def) {
    try { const v = localStorage.getItem(key); return v == null ? def : JSON.parse(v); } catch (e) { return def; }
  }
  function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

  function startGame() { G = createGame(STAGE_ZENITH, equipped, levels); Sound.bgm(); show('battle-screen'); renderBattle(); }

  function evolve(id) {
    const L = levels[id] || 0;
    if (L >= EVO_MAX) return;
    const cost = evoCost(L);
    if (devP < cost) return;
    devP -= cost; levels[id] = L + 1;
    saveJSON('malcore.levels', levels); saveJSON('malcore.devP', devP);
    Sound.play('cutin');
    renderBriefing();
  }

  function renderBriefing() {
    const handHtml = ['zeus', 'iloveyou', 'mydoom', 'blaster'].map(id => {
      const m = malById(id);
      const L = levels[id] || 0;
      const s = MALCORE.malStats(m, L);
      const badge = L > 0 ? '<span class="evo-badge">' + ['', '改', '改弐'][L] + '</span>' : '';
      const maxed = L >= EVO_MAX;
      const cost = evoCost(L);
      const evoBtn = '<button class="evo-btn" data-evo="' + id + '" ' + (maxed || devP < cost ? 'disabled' : '') + '>' +
        (maxed ? '進化MAX' : '⬆ 進化（開発P ' + cost + '）') + '</button>';
      return '<div class="card"><div class="card-top">' +
        '<span class="malspr evo' + L + '">' + SPRITES.mal(id, { gen: L }) + '</span>' +
        '<span class="card-name"><b>' + m.name + badge + '</b><span>' + m.year + ' / 世代Lv' + L + '</span></span></div>' +
        '<div class="card-cia">🔵' + s.C + ' 🟢' + s.I + ' 🟡' + s.A + '</div>' +
        '<div class="card-role">' + m.role + ' / ' + m.sub + '</div>' +
        (m.waza ? '<div class="card-waza">⚡ ' + MALCORE.wazaName(m, L) + '</div>' : '') +
        evoBtn + '</div>';
    }).join('');
    // 装備技カードの選択（最大3）
    const equipHtml = CARDS.map(c =>
      '<button class="equip ' + (equipped.includes(c.id) ? 'on' : '') + '" data-card="' + c.id + '">' +
      '<b>🃏 ' + c.name + '</b><small>' + gaugeMark(c) + ' ' + costLabel(c.cost) +
      (c.special === 'ignoreH' ? ' / 貫通' : '') + '</small></button>'
    ).join('');
    $('briefing-body').innerHTML =
      '<p class="intro">' + STAGE_ZENITH.intro + '</p>' +
      '<h2 class="sub">編成（固有技）<small>🛠️ 開発P ' + devP + '</small></h2>' +
      '<div class="cards">' + handHtml + '</div>' +
      '<h2 class="sub">装備技カード <small id="equip-count">' + equipped.length + '/3</small></h2>' +
      '<div class="equips">' + equipHtml + '</div>';
    $('briefing-body').querySelectorAll('.equip').forEach(b =>
      b.addEventListener('click', () => { toggleEquip(b.dataset.card); renderBriefing(); }));
    $('briefing-body').querySelectorAll('.evo-btn').forEach(b =>
      b.addEventListener('click', () => { Sound.unlock(); evolve(b.dataset.evo); }));
  }

  function gaugeMark(c) {
    const cia = c.cia || {};
    return (cia.C ? '🔵' + cia.C + ' ' : '') + (cia.I ? '🟢' + cia.I + ' ' : '') + (cia.A ? '🟡' + cia.A : '');
  }

  function toggleEquip(id) {
    const i = equipped.indexOf(id);
    if (i >= 0) equipped.splice(i, 1);
    else if (equipped.length < 3) equipped.push(id);
  }

  // 図鑑（全カードを英名・型・世代・対策つきで一覧）
  function renderCodex() {
    const groups = [['C', '🔵 機密性'], ['I', '🟢 完全性'], ['A', '🟡 可用性']];
    const html = groups.map(([g, title]) => {
      const items = CARDS.filter(c => c.gauge === g).map(c =>
        '<div class="codex-card"><div class="cc-top"><b>⚡ ' + c.name + '</b>' +
        '<span class="cc-gen">世代' + c.gen + '</span></div>' +
        '<div class="cc-en">' + c.en + ' ・ ' + c.type + ' ・ ' + c.tactic + '</div>' +
        '<div class="cc-desc">' + c.desc + '</div>' +
        '<div class="cc-def">🛡️ ' + c.defense + '</div></div>'
      ).join('');
      return '<h2 class="sub">' + title + '</h2>' + items;
    }).join('');
    $('codex-body').innerHTML = html;
  }

  function initUI() {
    // click だけでなく touchend も拾う（スマホでの取りこぼし防止）
    const tap = (id, fn) => {
      const el = $(id); if (!el) return;
      const h = (e) => { e.preventDefault(); Sound.unlock(); fn(); };
      el.addEventListener('click', h);
    };
    tap('btn-start', () => { Sound.play('select'); renderBriefing(); show('briefing-screen'); });
    tap('btn-codex', () => { Sound.play('select'); renderCodex(); show('codex-screen'); });
    tap('btn-codex-back', () => show('title-screen'));
    tap('btn-sortie', () => { Sound.play('select'); startGame(); });
    tap('btn-retry', () => { Sound.play('select'); Sound.stopBgm(); renderBriefing(); show('briefing-screen'); });
    tap('btn-title', () => { Sound.stopBgm(); show('title-screen'); });
    $('btn-mute').addEventListener('click', () => {
      Sound.unlock();
      const m = !Sound.isMuted();
      Sound.setMuted(m);
      $('btn-mute').textContent = m ? '🔇' : '🔊';
      if (!m) Sound.play('select');
    });
  }
  // スクリプトは body 末尾。DOMが既に準備済みなら即時初期化（DOMContentLoaded取りこぼし対策）
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initUI);
  else initUI();
}

</script>
</body>
</html>
